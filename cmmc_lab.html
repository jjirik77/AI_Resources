10.3, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r12.c5\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5b.t4\" data-cols=\"6\">+ Add row<\/button>\n<p><strong>One more check.<\/strong> Online work, after Session B. Compare the two mapping columns in the gap list. Where they differ, read both requirements in NIST SP 800-171. Which one fits the gap as described? Then look at any other mapping you doubt.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t5\"><thead><tr><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>The requirement the company names<\/strong><\/th><th scope=\"col\"><strong>Does it fit the gap? Why or why not?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m5b.t5.r1.c0\" rows=\"2\" aria-label=\"row 1, Gap\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t5.r1.c1\" rows=\"2\" aria-label=\"row 1, The requirement the company names\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t5.r1.c2\" rows=\"2\" aria-label=\"row 1, Does it fit the gap? Why or why not?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r1.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m5b.t5.r2.c0\" rows=\"2\" aria-label=\"row 2, Gap\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t5.r2.c1\" rows=\"2\" aria-label=\"row 2, The requirement the company names\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t5.r2.c2\" rows=\"2\" aria-label=\"row 2, Does it fit the gap? Why or why not?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t5.r2.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5b.t5\" data-cols=\"3\">+ Add row<\/button>\n<p>Partner check, last 10 minutes of Session B. Read one &quot;Sufficient: Yes&quot; or &quot;Partly&quot; row to a partner. Your partner asks: does it hold up for every in-scope system and both sites? Your partner does not write in your log. You decide what to change.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t6\"><thead><tr><th scope=\"col\"><strong>The row I read aloud<\/strong><\/th><th scope=\"col\"><strong>My partner&#x27;s question<\/strong><\/th><th scope=\"col\"><strong>What I will change, if anything<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m5b.t6.r1.c0\" rows=\"2\" aria-label=\"row 1, The row I read aloud\"><\/textarea><div class=\"pm\" data-m=\"m5b.t6.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t6.r1.c1\" rows=\"2\" aria-label=\"row 1, My partner&amp;#x27;s question\"><\/textarea><div class=\"pm\" data-m=\"m5b.t6.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t6.r1.c2\" rows=\"2\" aria-label=\"row 1, What I will change, if anything\"><\/textarea><div class=\"pm\" data-m=\"m5b.t6.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5b.t6\" data-cols=\"3\">+ Add row<\/button>"], ["Technical evidence lab", "<p class=\"docmeta\">Module 5 online work. About 1.5 hours. Complete it between Session A and Session B. Not graded.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this handout<\/p><p>In Session A you judged a policy, a screenshot, and an email. Most evidence an assessor sees is not like that. It is a report or a list that a system prints out. This lab gives you five of them from ThreadBridge.<\/p><p>Work alone. Spend about 15 minutes on each export, then 15 minutes on the last question.<\/p><p>Type your answers into the empty cells. You use what you find here in your D3 evidence log (Part A).<\/p><\/aside>\n<h3>What you are looking at<\/h3>\n<p>An export is a file a system produces on request, such as a report, a list, or a copy of its settings. Dennis Park, ThreadBridge&#x27;s IT Manager, ran each export below in June 2025 and sent it to the compliance team. Nothing has been changed to make it look better or worse.<\/p>\n<p>An export is often strong evidence, because a system wrote it and not a person. But it still faces the two tests from Session A.<\/p>\n<ul><li><strong>Adequate:<\/strong> the evidence exists and matches what the requirement intends.<\/li><li><strong>Sufficient:<\/strong> there is enough evidence to show the control is in place, followed, and working across the whole scope.<\/li><\/ul>\n<p>Three questions help with every export:<\/p>\n<ul><li>Which system, and which part of the scope, does it cover? Count what it leaves out.<\/li><li>Does it show a setting, a record of activity, or a list? Each one shows something different.<\/li><li>What date or time span does it cover? A control must be true today and over time.<\/li><\/ul>\n<p>For each export, use the 12 D3 requirements from Session B. The first column of each table asks which requirement the export supports. Some exports support more than one. Some support none well.<\/p>\n<h3>Export 1 — MFA registration report, by user<\/h3>\n<p>Multifactor authentication (MFA) means a user gives a second proof of identity, such as a code on a phone, in addition to a password. A privileged account is an account with administrator rights.<\/p>\n<p>Exported by Dennis Park from the Microsoft 365 admin center. The report lists each Microsoft 365 user and the MFA methods that user has set up. The first 10 rows are shown.<\/p>\n<pre class=\"scenario\">Microsoft Entra ID - Authentication methods - User registration details\nTenant:     ThreadBridge Solutions, LLC\nExported:   June 9, 2025  08:14   by dpark\n \nUser           Admin role              MFA capable   Methods registered\n-------------  ----------------------  ------------  ---------------------\ndpark          Global Administrator    Yes           Authenticator app\njtorres        Global Administrator    Yes           Authenticator app\nmholloway      None                    Yes           Authenticator app\nsybarra        None                    Yes           Authenticator app, SMS\nrchen          None                    Yes           Authenticator app\nlnguyen        None                    Yes           SMS\nmwebb          None                    Yes           Authenticator app\ncmendez        None                    Yes           Authenticator app\n...\nTotal users: 82     MFA capable: 82     Not registered: 0<\/pre>\n<p>Guide prompts:<\/p>\n<ul><li>The report covers one system. Which one? Look at the MFA status list in the ThreadBridge case. How many in-scope systems are not in this report?<\/li><li>&quot;MFA capable&quot; means the user has set up a second factor. Does that show that every sign-in asks for it?<\/li><li>Two accounts have admin roles in Microsoft 365. Do the same people have admin rights anywhere else? Would this report show it?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t1\"><thead><tr><th scope=\"col\"><strong>Which requirement does it support?<\/strong><\/th><th scope=\"col\"><strong>Adequate? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>Sufficient? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>What is still needed? Name specific items.<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t1.r1.c0\" rows=\"2\" aria-label=\"row 1, Which requirement does it support?\"><\/textarea><div class=\"pm\" data-m=\"techni.t1.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t1.r1.c1\" rows=\"2\" aria-label=\"row 1, Adequate? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t1.r1.c2\" rows=\"2\" aria-label=\"row 1, Sufficient? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t1.r1.c3\" rows=\"2\" aria-label=\"row 1, What is still needed? Name specific items.\"><\/textarea><div class=\"pm\" data-m=\"techni.t1.r1.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"techni.t1\" data-cols=\"4\">+ Add row<\/button>\n<h3>Export 2 — Windows security event log, domain controller<\/h3>\n<p>An event log is a record that a system writes each time something happens, such as a sign-in. Each kind of event has a number, called an event ID. The domain controller is the server that manages user accounts and sign-ins for the company network.<\/p>\n<p>Exported by Dennis Park from the Security log on the domain controller, TBS-DC01 (SRV-003). He filtered the log to show four event IDs. The table under the export explains them.<\/p>\n<pre class=\"scenario\">Event Viewer - Security log - Filtered export\nComputer:   TBS-DC01.threadbridge.local\nFilter:     Event ID 4624, 4625, 4720, 4726\nExported:   June 9, 2025  08:31   by dpark\n \nDate/Time            ID    Account    Logon type   Source     Detail\n-------------------  ----  ---------  -----------  ---------  ------------------------\n2025-06-06 07:51:41  4625  rchen      3 Network    WRK-014    Bad password (0xC000006A)\n2025-06-06 07:51:58  4625  rchen      3 Network    WRK-014    Bad password (0xC000006A)\n2025-06-06 07:52:10  4624  rchen      3 Network    WRK-014    Logon succeeded\n2025-06-06 09:05:33  4624  dpark      10 Remote    WRK-002    Logon succeeded\n2025-06-06 10:47:02  4720  ksato      -            -          Created by: dpark\n2025-06-06 16:20:45  4726  tbtemp     -            -          Deleted by: jtorres\n2025-06-08 22:13:07  4625  admin      3 Network    MOB-005    Unknown user name (0xC0000064)\n2025-06-08 22:13:09  4625  admin      3 Network    MOB-005    Unknown user name (0xC0000064)\n2025-06-08 22:13:12  4625  admin      3 Network    MOB-005    Unknown user name (0xC0000064)\n...\nLog size: 20 MB (maximum)     Oldest event in log: May 31, 2025<\/pre>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t2\"><thead><tr><th scope=\"col\"><strong>Event ID<\/strong><\/th><th scope=\"col\"><strong>What it means<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">4624<\/th><td>An account signed in successfully<\/td><\/tr><tr><th scope=\"row\">4625<\/th><td>An account failed to sign in<\/td><\/tr><tr><th scope=\"row\">4720<\/th><td>A user account was created<\/td><\/tr><tr><th scope=\"row\">4726<\/th><td>A user account was deleted<\/td><\/tr><tr><th scope=\"row\">Logon type 3<\/th><td>A sign-in from another computer over the network<\/td><\/tr><tr><th scope=\"row\">Logon type 10<\/th><td>A sign-in by remote desktop<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Guide prompts:<\/p>\n<ul><li>This log is evidence that events are recorded. Is it also evidence that anyone reviews them? Look at the three failed sign-ins from MOB-005 late on June 8. MOB-005 is one of the Android tablets on the production floor.<\/li><li>Find the oldest event in the log. How many days does the log keep? What happens to older events?<\/li><li>Look at the 4624 event for dpark. It is a remote desktop sign-in to the domain controller. Does anything in the log show a second factor?<\/li><li>Who asked for the account ksato to be created? Does the log say?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t3\"><thead><tr><th scope=\"col\"><strong>Which requirement does it support?<\/strong><\/th><th scope=\"col\"><strong>Adequate? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>Sufficient? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>What is still needed? Name specific items.<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t3.r1.c0\" rows=\"2\" aria-label=\"row 1, Which requirement does it support?\"><\/textarea><div class=\"pm\" data-m=\"techni.t3.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t3.r1.c1\" rows=\"2\" aria-label=\"row 1, Adequate? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t3.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t3.r1.c2\" rows=\"2\" aria-label=\"row 1, Sufficient? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t3.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t3.r1.c3\" rows=\"2\" aria-label=\"row 1, What is still needed? Name specific items.\"><\/textarea><div class=\"pm\" data-m=\"techni.t3.r1.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"techni.t3\" data-cols=\"4\">+ Add row<\/button>\n<h3>Export 3 — Active Directory account list, with last sign-in<\/h3>\n<p>Active Directory (AD) is the Microsoft system that holds the company&#x27;s network user accounts. An enabled account can sign in. A disabled account cannot. A service account is an account that a program uses, not a person.<\/p>\n<p>Exported by Dennis Park with a standard PowerShell command. PowerShell is a Windows tool for running commands. The first 14 rows are shown.<\/p>\n<pre class=\"scenario\">PS C:\\&gt; Get-ADUser -Filter * -Properties LastLogonDate, Description, MemberOf |\n        Select SamAccountName, Enabled, LastLogonDate, Groups, Description\n \nSamAccountName  Enabled  LastLogonDate     Groups                 Description\n--------------  -------  ----------------  ---------------------  ----------------------\ndpark           True     2025-06-09 08:02  Domain Admins          IT Manager\njtorres         True     2025-06-09 07:45  Domain Admins          IT Specialist\nmholloway       True     2025-06-06 16:58  Domain Users           CEO\nsybarra         True     2025-06-09 08:10  Domain Users           Contracts Manager\nrchen           True     2025-06-06 07:52  Domain Users           Production Manager\nlnguyen         True     2025-06-06 15:31  Domain Users           HR Manager\nmwebb           True     2025-06-06 06:44  Domain Users           Warehouse - Frostburg\ncmendez         True     2025-06-06 08:20  Domain Users           Accounting\njreyes          False    2025-02-03 11:15  Domain Users           Sales - remote\ntechserv        True     2025-06-07 00:41  SSLVPN Users           ERP vendor VPN\nsvc_backup      True     2025-06-09 01:00  Backup Operators       Veeam backup job\nsvc_erp         True     2025-06-09 05:30  Domain Users           Epicor service\nsvc_scan        True     2024-06-18 14:02  Domain Admins          (none)\nksato           True     (never)           Domain Users           (none)\n...\nShowing 14 of 91 user objects.<\/pre>\n<p>Guide prompts:<\/p>\n<ul><li>ThreadBridge has 82 employees. This list has 91 user objects. What would you need to explain the difference?<\/li><li>To judge whether access is limited to authorized users, you compare this list with something. What? Does ThreadBridge have it? Look at gap G-02.<\/li><li>The orphaned QuickBooks administrator account from G-02 is not in this list. Why not? (Hint: look at how QuickBooks users sign in, in the case&#x27;s MFA status list.)<\/li><li>Look at the techserv account&#x27;s last sign-in time. Look at svc_scan&#x27;s group and its last sign-in date. What would you ask about each one?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t4\"><thead><tr><th scope=\"col\"><strong>Which requirement does it support?<\/strong><\/th><th scope=\"col\"><strong>Adequate? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>Sufficient? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>What is still needed? Name specific items.<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t4.r1.c0\" rows=\"2\" aria-label=\"row 1, Which requirement does it support?\"><\/textarea><div class=\"pm\" data-m=\"techni.t4.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t4.r1.c1\" rows=\"2\" aria-label=\"row 1, Adequate? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t4.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t4.r1.c2\" rows=\"2\" aria-label=\"row 1, Sufficient? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t4.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t4.r1.c3\" rows=\"2\" aria-label=\"row 1, What is still needed? Name specific items.\"><\/textarea><div class=\"pm\" data-m=\"techni.t4.r1.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"techni.t4\" data-cols=\"4\">+ Add row<\/button>\n<h3>Export 4 — Firewall rule list<\/h3>\n<p>A firewall is a device that controls which network traffic may pass between zones. A zone is a part of the network the firewall knows about, such as the internal network (LAN), the internet (WAN), or remote users who connect by VPN. A virtual private network (VPN) is a protected connection that lets remote users reach the company network over the internet.<\/p>\n<p>Exported from the Sophos XG 310 firewall (NET-001). Cascade Networks, which manages the firewall, ran the export at Dennis Park&#x27;s request. Park sent it with this note: &quot;This shows we separate things at the firewall. Use it for 3.13.3.&quot;<\/p>\n<pre class=\"scenario\">Sophos Firewall XG 310 (SFOS 19.5) - Firewall rules - Export\nExported:  June 9, 2025   by cascade-admin\n \n#  Name                 Source zone  Dest zone  Source           Destination   Service      Action  Log\n-  -------------------  -----------  ---------  ---------------  ------------  -----------  ------  ---\n1  LAN to Internet      LAN          WAN        Any              Any           Any          Accept  On\n2  SSL VPN to LAN       VPN          LAN        SSLVPN Users     Any           Any          Accept  Off\n3  Cascade management   WAN          Local      Cascade Networks Firewall      HTTPS admin  Accept  On\n4  Default drop         Any          Any        Any              Any           Any          Drop    On\n \nLast rule change: rule 2, March 2022, by cascade-admin<\/pre>\n<p>Guide prompts:<\/p>\n<ul><li>A firewall sees traffic only when it crosses from one zone to another. ThreadBridge has one VLAN for every device. Does traffic from a tablet to the file server ever cross the firewall?<\/li><li>Requirement 3.13.3 is about separating user functions from system management functions. An example is using a separate administrator account, and limiting where admin tools can be reached from. Does this export address that?<\/li><li>Rule 2 lets every VPN user reach any address on the LAN, with any service, and logging is off. The techserv account is in the SSLVPN Users group (Export 3). Which other D3 requirement does that touch?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t5\"><thead><tr><th scope=\"col\"><strong>Which requirement does it support?<\/strong><\/th><th scope=\"col\"><strong>Adequate? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>Sufficient? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>What is still needed? Name specific items.<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t5.r1.c0\" rows=\"2\" aria-label=\"row 1, Which requirement does it support?\"><\/textarea><div class=\"pm\" data-m=\"techni.t5.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t5.r1.c1\" rows=\"2\" aria-label=\"row 1, Adequate? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t5.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t5.r1.c2\" rows=\"2\" aria-label=\"row 1, Sufficient? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t5.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t5.r1.c3\" rows=\"2\" aria-label=\"row 1, What is still needed? Name specific items.\"><\/textarea><div class=\"pm\" data-m=\"techni.t5.r1.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"techni.t5\" data-cols=\"4\">+ Add row<\/button>\n<h3>Export 5 — Removable media settings, one workstation<\/h3>\n<p>Removable media are storage devices you can plug in and take away, such as USB drives. Group Policy is the Windows feature that pushes settings from the domain controller to every computer. Windows has a set of Group Policy settings, under &quot;Removable Storage Access&quot;, that can block USB drives.<\/p>\n<p>Exported by Dennis Park from WRK-007, a workstation in the contracts office in Cumberland that handles CUI. Controlled Unclassified Information (CUI) is government information that must be protected under the contract. The export has two parts: the Group Policy result, and the list of USB storage devices Windows has seen on this computer.<\/p>\n<pre class=\"scenario\">Group Policy Results - WRK-007.threadbridge.local\nExported:   June 9, 2025  09:02   by dpark\n \nApplied Group Policy Objects:   Default Domain Policy\n \nComputer Configuration &gt; Policies &gt; Administrative Templates\n  &gt; System &gt; Removable Storage Access\n      All Removable Storage classes: Deny all access ..... Not configured\n      Removable Disks: Deny read access .................. Not configured\n      Removable Disks: Deny write access ................. Not configured\n \nUSB storage devices seen on this computer\nDevice                         First connected     Last connected\n-----------------------------  ------------------  ------------------\nSanDisk Cruzer Blade 32GB      2024-11-04 10:12    2025-06-05 14:37\nKingston DataTraveler 64GB     2025-01-21 08:55    2025-05-29 16:03\nGeneric USB Flash Disk 8GB     2025-04-14 13:20    2025-04-14 13:41<\/pre>\n<p>Guide prompts:<\/p>\n<ul><li>Is this the right kind of evidence for 3.8.7, which says to control the use of removable media on system components?<\/li><li>What does the export show about the control on WRK-007? Can good evidence show that a control is missing?<\/li><li>The company says 8 of its 40 workstations handle CUI. This export covers one. What would you need for the others?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t6\"><thead><tr><th scope=\"col\"><strong>Which requirement does it support?<\/strong><\/th><th scope=\"col\"><strong>Adequate? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>Sufficient? (Yes, No, or Partly, and why)<\/strong><\/th><th scope=\"col\"><strong>What is still needed? Name specific items.<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t6.r1.c0\" rows=\"2\" aria-label=\"row 1, Which requirement does it support?\"><\/textarea><div class=\"pm\" data-m=\"techni.t6.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t6.r1.c1\" rows=\"2\" aria-label=\"row 1, Adequate? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t6.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t6.r1.c2\" rows=\"2\" aria-label=\"row 1, Sufficient? (Yes, No, or Partly, and why)\"><\/textarea><div class=\"pm\" data-m=\"techni.t6.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"techni.t6.r1.c3\" rows=\"2\" aria-label=\"row 1, What is still needed? Name specific items.\"><\/textarea><div class=\"pm\" data-m=\"techni.t6.r1.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"techni.t6\" data-cols=\"4\">+ Add row<\/button>\n<h3>Last question — what technical evidence can and cannot show<\/h3>\n<p>Look back at all five exports. Answer in four to six sentences. What did the exports show that a policy or an email could not? What could none of them show on its own? Think about scope, time, and whether anyone reviews what the system records.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"techni.t7\"><thead><tr><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"techni.t7.r1.c0\" rows=\"2\" aria-label=\"row 1, Your answer\"><\/textarea><div class=\"pm\" data-m=\"techni.t7.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Before you finish, copy anything useful into your D3 Part A evidence log. Name the export and the date, for example &quot;Export 3, AD account list, June 9, 2025&quot;. Name what is missing, but do not write how to fix it.<\/p>"]], "deliv": "Module 5 activities", "keys": ["m5b"]}, {"id": "m6a", "group": "Module 6", "nav": "Module 6 activities", "title": "Module 6 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 6 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1, 2 and 3.<\/p><\/aside>\n<h3>Activity 1 — Warm-up: adequate or sufficient?<\/h3>\n<p>Session A. Work with a partner for 7 minutes.<\/p>\n<p>Each item below comes from a different, fictional company. It is not ThreadBridge. For each item, decide whether the evidence is adequate, sufficient, both, or neither. Write one reason.<\/p>\n<p>Remember the two tests from Module 5:<\/p>\n<ul><li>Adequate: the evidence exists and matches what the requirement intends.<\/li><li>Sufficient: there is enough evidence to show the control is in place, followed, and working across the whole scope.<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m6a.t1\"><thead><tr><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>The evidence<\/strong><\/th><th scope=\"col\"><strong>Offered for<\/strong><\/th><th scope=\"col\"><strong>Adequate, sufficient, both, or neither?<\/strong><\/th><th scope=\"col\"><strong>One-line reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">W1<\/th><td>A signed policy, dated last month, that says all users must use multifactor authentication. Nothing else is supplied.<\/td><td>3.5.3, multifactor authentication<\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r1.c3\" rows=\"2\" aria-label=\"W1, Adequate, sufficient, both, or neither?\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r1.c4\" rows=\"2\" aria-label=\"W1, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">W2<\/th><td>The IT lead says in an interview, &quot;We scan for vulnerabilities every month.&quot; No reports are supplied.<\/td><td>3.11.2, vulnerability scanning<\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r2.c3\" rows=\"2\" aria-label=\"W2, Adequate, sufficient, both, or neither?\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r2.c4\" rows=\"2\" aria-label=\"W2, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">W3<\/th><td>A procedure for removable media, plus the device control settings from all 25 company computers, exported last week. Each one blocks USB storage.<\/td><td>3.8.7, removable media<\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r3.c3\" rows=\"2\" aria-label=\"W3, Adequate, sufficient, both, or neither?\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t1.r3.c4\" rows=\"2\" aria-label=\"W3, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m6a.t1.r3.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6a.t1\" data-cols=\"5\">+ Add row<\/button>\n<h3>Activity 2 — Guided determinations<\/h3>\n<p>Session A. Work alone for 20 minutes, then compare with a partner for 5 minutes. If you change an answer after you compare, write the change in your own words.<\/p>\n<p>First, read the worked example for 3.1.1. It shows what a finished determination looks like. Then do the same for 3.5.3 and 3.11.2. Use your D3 Part A evidence log and the ThreadBridge case.<\/p>\n<p><strong>Worked example: 3.1.1 (gap G-02).<\/strong> Requirement text: &quot;Limit system access to authorized users, processes acting on behalf of authorized users, and devices (including other systems).&quot;<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m6a.t2\"><thead><tr><th scope=\"col\"><strong>Step<\/strong><\/th><th scope=\"col\"><strong>The worked answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1. The parts that must be true<\/th><td>Allowed users, processes, and devices are identified. Access is limited to each of them. Six parts in all.<\/td><\/tr><tr><th scope=\"row\">2. The evidence<\/th><td>Access control policy, March 2021, signed by the CEO. No access control matrix. Access managed from memory by Dennis Park. A QuickBooks administrator account active 14 months after its owner left.<\/td><\/tr><tr><th scope=\"row\">3. Adequate? Sufficient?<\/th><td>Adequate: the policy exists and matches the intent. Not sufficient: nothing lists the allowed users, and a former employee&#x27;s account stayed active.<\/td><\/tr><tr><th scope=\"row\">4. Determination and reason<\/th><td>NOT MET. Allowed users are not identified, and access is not limited to them: the former owner&#x27;s QuickBooks account stayed open for 14 months.<\/td><\/tr><tr><th scope=\"row\">5. Root cause type<\/th><td>No owner. The policy names the IT Manager to review access, but no review has happened. &quot;No schedule&quot; is also acceptable with a reason.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Your turn: 3.5.3 (gap G-01).<\/strong> Requirement text: &quot;Use multifactor authentication for local and network access to privileged accounts and for network access to non-privileged accounts.&quot;<\/p>\n<p>Prompts:<\/p>\n<ul><li>Which systems at ThreadBridge use multifactor authentication (MFA)? Which do not? Look at the G-01 description and the case.<\/li><li>Who uses the virtual private network (VPN) to reach the company from outside? Who uses remote desktop (RDP) to reach the domain controller?<\/li><li>Is evidence that covers only Microsoft 365 enough for the whole scope?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m6a.t3\"><thead><tr><th scope=\"col\"><strong>Step<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1. The parts that must be true<\/th><td><textarea class=\"fld \" data-f=\"m6a.t3.r1.c1\" rows=\"2\" aria-label=\"1. The parts that must be true, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t3.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">2. The evidence<\/th><td><textarea class=\"fld \" data-f=\"m6a.t3.r2.c1\" rows=\"2\" aria-label=\"2. The evidence, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t3.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">3. Adequate? Sufficient?<\/th><td><textarea class=\"fld \" data-f=\"m6a.t3.r3.c1\" rows=\"2\" aria-label=\"3. Adequate? Sufficient?, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t3.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">4. Determination and reason<\/th><td><textarea class=\"fld \" data-f=\"m6a.t3.r4.c1\" rows=\"2\" aria-label=\"4. Determination and reason, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t3.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">5. Root cause type<\/th><td><textarea class=\"fld \" data-f=\"m6a.t3.r5.c1\" rows=\"2\" aria-label=\"5. Root cause type, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t3.r5.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6a.t3\" data-cols=\"2\">+ Add row<\/button>\n<p><strong>Your turn: 3.11.2 (gap G-04).<\/strong> Requirement text: &quot;Scan for vulnerabilities in organizational systems and applications periodically and when new vulnerabilities affecting those systems and applications are identified.&quot;<\/p>\n<p>Prompts:<\/p>\n<ul><li>The requirement uses the word &quot;periodically&quot;. What would show that scanning happens on a schedule?<\/li><li>What did ThreadBridge receive from its last scan: a full report or a summary? When was it?<\/li><li>Is there any record of what was fixed after the scan?<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m6a.t4\"><thead><tr><th scope=\"col\"><strong>Step<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1. The parts that must be true<\/th><td><textarea class=\"fld \" data-f=\"m6a.t4.r1.c1\" rows=\"2\" aria-label=\"1. The parts that must be true, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t4.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">2. The evidence<\/th><td><textarea class=\"fld \" data-f=\"m6a.t4.r2.c1\" rows=\"2\" aria-label=\"2. The evidence, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t4.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">3. Adequate? Sufficient?<\/th><td><textarea class=\"fld \" data-f=\"m6a.t4.r3.c1\" rows=\"2\" aria-label=\"3. Adequate? Sufficient?, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t4.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">4. Determination and reason<\/th><td><textarea class=\"fld \" data-f=\"m6a.t4.r4.c1\" rows=\"2\" aria-label=\"4. Determination and reason, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t4.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">5. Root cause type<\/th><td><textarea class=\"fld \" data-f=\"m6a.t4.r5.c1\" rows=\"2\" aria-label=\"5. Root cause type, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m6a.t4.r5.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6a.t4\" data-cols=\"2\">+ Add row<\/button>\n<p>When you finish, copy all three determinations into Part B of the D3 template.<\/p>\n<h3>Activity 3 — Spot challenge<\/h3>\n<p>Session A. Whole class, last 10 minutes.<\/p>\n<p>Two students each read out one of their determinations. Other students challenge it. A challenge must point to evidence or to the requirement text. Record what happened.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m6a.t5\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>The determination read out<\/strong><\/th><th scope=\"col\"><strong>The challenge<\/strong><\/th><th scope=\"col\"><strong>The answer given<\/strong><\/th><th scope=\"col\"><strong>Did the determination change? Why?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m6a.t5.r1.c0\" rows=\"2\" aria-label=\"row 1, Requirement\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r1.c1\" rows=\"2\" aria-label=\"row 1, The determination read out\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r1.c2\" rows=\"2\" aria-label=\"row 1, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r1.c3\" rows=\"2\" aria-label=\"row 1, The answer given\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r1.c4\" rows=\"2\" aria-label=\"row 1, Did the determination change? Why?\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r1.c4\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m6a.t5.r2.c0\" rows=\"2\" aria-label=\"row 2, Requirement\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r2.c1\" rows=\"2\" aria-label=\"row 2, The determination read out\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r2.c2\" rows=\"2\" aria-label=\"row 2, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r2.c3\" rows=\"2\" aria-label=\"row 2, The answer given\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6a.t5.r2.c4\" rows=\"2\" aria-label=\"row 2, Did the determination change? Why?\"><\/textarea><div class=\"pm\" data-m=\"m6a.t5.r2.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6a.t5\" data-cols=\"5\">+ Add row<\/button>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 6 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 4 and 6. Online, outside class: Activity 5.<\/p><\/aside>\n<h3>Activity 4 — Practice score: Harbor Valve Company<\/h3>\n<p>Session B. Work alone for 12 minutes, then compare with a partner.<\/p>\n<p>Harbor Valve Company is a fictional company. It is not ThreadBridge. Its compliance team has checked all 110 requirements. Six are NOT MET. Every other requirement is MET.<\/p>\n<p>For each line:<\/p>\n<p>1. Look up the point value in Annex A of the DoD Assessment Methodology. Do not guess.<\/p>\n<p>2. For 3.5.3 and 3.13.11, read the facts and decide whether the partial-credit exception applies.<\/p>\n<p>3. Enter the deduction.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m6b.t1\"><thead><tr><th scope=\"col\"><strong>Line<\/strong><\/th><th scope=\"col\"><strong>What the compliance team found<\/strong><\/th><th scope=\"col\"><strong>Requirement NOT MET<\/strong><\/th><th scope=\"col\"><strong>Point value<\/strong><\/th><th scope=\"col\"><strong>Deduction<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">H-1<\/th><td>Six of 30 computers have no protection from malicious code<\/td><td>3.14.2, provide protection from malicious code<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r1.c3\" rows=\"2\" aria-label=\"H-1, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r1.c4\" rows=\"2\" aria-label=\"H-1, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">H-2<\/th><td>Paper drawings marked CUI are kept on an open shelf<\/td><td>3.8.1, protect system media containing CUI<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r2.c3\" rows=\"2\" aria-label=\"H-2, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r2.c4\" rows=\"2\" aria-label=\"H-2, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">H-3<\/th><td>MFA is in place for remote access and for administrator accounts, but not for general office users on the network<\/td><td>3.5.3, multifactor authentication<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r3.c3\" rows=\"2\" aria-label=\"H-3, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r3.c4\" rows=\"2\" aria-label=\"H-3, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">H-4<\/th><td>Laptops that hold CUI are encrypted, but the encryption is not FIPS validated<\/td><td>3.13.11, FIPS-validated encryption<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r4.c3\" rows=\"2\" aria-label=\"H-4, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r4.c4\" rows=\"2\" aria-label=\"H-4, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r4.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">H-5<\/th><td>Computers do not lock after a period of no use<\/td><td>3.1.10, session lock<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r5.c3\" rows=\"2\" aria-label=\"H-5, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r5.c4\" rows=\"2\" aria-label=\"H-5, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r5.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">H-6<\/th><td>Security settings differ from computer to computer, and no standard settings are enforced<\/td><td>3.4.2, security configuration settings<\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r6.c3\" rows=\"2\" aria-label=\"H-6, Point value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r6.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t1.r6.c4\" rows=\"2\" aria-label=\"H-6, Deduction\"><\/textarea><div class=\"pm\" data-m=\"m6b.t1.r6.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6b.t1\" data-cols=\"5\">+ Add row<\/button>\n<div class=\"tbl-wrap\"><table data-tid=\"m6b.t2\"><thead><tr><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>Value<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Starting score<\/th><td>110<\/td><\/tr><tr><th scope=\"row\">Total deductions<\/th><td><textarea class=\"fld \" data-f=\"m6b.t2.r2.c1\" rows=\"2\" aria-label=\"Total deductions, Value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t2.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Score<\/th><td><textarea class=\"fld \" data-f=\"m6b.t2.r3.c1\" rows=\"2\" aria-label=\"Score, Value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t2.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Score ÷ 110<\/th><td><textarea class=\"fld \" data-f=\"m6b.t2.r4.c1\" rows=\"2\" aria-label=\"Score ÷ 110, Value\"><\/textarea><div class=\"pm\" data-m=\"m6b.t2.r4.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6b.t2\" data-cols=\"2\">+ Add row<\/button>\n<div class=\"tbl-wrap\"><table data-tid=\"m6b.t3\"><thead><tr><th scope=\"col\"><strong>Did you and your partner get the same score? If not, which line was different, and who was right?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m6b.t3.r1.c0\" rows=\"2\" aria-label=\"row 1, Did you and your partner get the same score? If not, which line was different, and who was right?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t3.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 5 — What the score means<\/h3>\n<p>Online work, after Session B. Work alone for about 20 minutes.<\/p>\n<p>For each statement, write &quot;Agree&quot; or &quot;Disagree&quot; and one reason.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m6b.t4\"><thead><tr><th scope=\"col\"><strong>Statement<\/strong><\/th><th scope=\"col\"><strong>Agree or disagree?<\/strong><\/th><th scope=\"col\"><strong>One reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">S1. A score of 110 in SPRS means the company holds a CMMC certificate.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r1.c1\" rows=\"2\" aria-label=\"S1. A score of 110 in SPRS means the company holds a CMMC certificate., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r1.c2\" rows=\"2\" aria-label=\"S1. A score of 110 in SPRS means the company holds a CMMC certificate., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r1.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">S2. If a requirement has four objectives and three are met, the company can subtract part of the points.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r2.c1\" rows=\"2\" aria-label=\"S2. If a requirement has four objectives and three are met, the company can subtract part of the points., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r2.c2\" rows=\"2\" aria-label=\"S2. If a requirement has four objectives and three are met, the company can subtract part of the points., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r2.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">S3. A company with no System Security Plan can still post a score, as long as the arithmetic is right.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r3.c1\" rows=\"2\" aria-label=\"S3. A company with no System Security Plan can still post a score, as long as the arithmetic is right., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r3.c2\" rows=\"2\" aria-label=\"S3. A company with no System Security Plan can still post a score, as long as the arithmetic is right., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r3.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">S4. Marking a requirement NOT APPLICABLE raises the score, so it must be justified.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r4.c1\" rows=\"2\" aria-label=\"S4. Marking a requirement NOT APPLICABLE raises the score, so it must be justified., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r4.c2\" rows=\"2\" aria-label=\"S4. Marking a requirement NOT APPLICABLE raises the score, so it must be justified., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r4.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">S5. A score calculated from a 13-item gap list is the most accurate score the company could have.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r5.c1\" rows=\"2\" aria-label=\"S5. A score calculated from a 13-item gap list is the most accurate score the company could have., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r5.c2\" rows=\"2\" aria-label=\"S5. A score calculated from a 13-item gap list is the most accurate score the company could have., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r5.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">S6. If the posted score is too high, the problem belongs to the IT department, not to any one person.<\/th><td><textarea class=\"fld \" data-f=\"m6b.t4.r6.c1\" rows=\"2\" aria-label=\"S6. If the posted score is too high, the problem belongs to the IT department, not to any one person., Agree or disagree?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r6.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t4.r6.c2\" rows=\"2\" aria-label=\"S6. If the posted score is too high, the problem belongs to the IT department, not to any one person., One reason\"><\/textarea><div class=\"pm\" data-m=\"m6b.t4.r6.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6b.t4\" data-cols=\"3\">+ Add row<\/button>\n<h3>Activity 6 — D3 final check<\/h3>\n<p>Session B. Work alone for 10 minutes, then read one Part B reason to a partner for 5 minutes.<\/p>\n<p>Check your D3 workbook against each line. Write &quot;Yes&quot; or &quot;No&quot;. For each &quot;No&quot;, write what you will fix and when.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m6b.t5\"><thead><tr><th scope=\"col\"><strong>Check<\/strong><\/th><th scope=\"col\"><strong>Yes or no?<\/strong><\/th><th scope=\"col\"><strong>What I will fix, and when<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Part A has evidence, or a clear note of what is missing, for all 12 requirements<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r1.c1\" rows=\"2\" aria-label=\"Part A has evidence, or a clear note of what is missing, for all 12 requirements, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r1.c2\" rows=\"2\" aria-label=\"Part A has evidence, or a clear note of what is missing, for all 12 requirements, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r1.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Every evidence item is a specific thing someone could retrieve, not a topic<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r2.c1\" rows=\"2\" aria-label=\"Every evidence item is a specific thing someone could retrieve, not a topic, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r2.c2\" rows=\"2\" aria-label=\"Every evidence item is a specific thing someone could retrieve, not a topic, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r2.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Adequate and sufficient are judged separately for every item<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r3.c1\" rows=\"2\" aria-label=\"Adequate and sufficient are judged separately for every item, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r3.c2\" rows=\"2\" aria-label=\"Adequate and sufficient are judged separately for every item, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r3.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Part B has MET or NOT MET for all 12, with no partial credit<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r4.c1\" rows=\"2\" aria-label=\"Part B has MET or NOT MET for all 12, with no partial credit, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r4.c2\" rows=\"2\" aria-label=\"Part B has MET or NOT MET for all 12, with no partial credit, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r4.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Every reason in Part B cites evidence from Part A<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r5.c1\" rows=\"2\" aria-label=\"Every reason in Part B cites evidence from Part A, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r5.c2\" rows=\"2\" aria-label=\"Every reason in Part B cites evidence from Part A, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r5.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Every NOT MET has one root cause type, with a reason<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r6.c1\" rows=\"2\" aria-label=\"Every NOT MET has one root cause type, with a reason, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r6.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r6.c2\" rows=\"2\" aria-label=\"Every NOT MET has one root cause type, with a reason, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r6.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Nothing in Parts A or B tells ThreadBridge what to do<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r7.c1\" rows=\"2\" aria-label=\"Nothing in Parts A or B tells ThreadBridge what to do, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r7.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r7.c2\" rows=\"2\" aria-label=\"Nothing in Parts A or B tells ThreadBridge what to do, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r7.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">I know that Part C is done alone, outside class<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r8.c1\" rows=\"2\" aria-label=\"I know that Part C is done alone, outside class, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r8.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r8.c2\" rows=\"2\" aria-label=\"I know that Part C is done alone, outside class, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r8.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">A partner heard one Part B reason and could follow it without a question<\/th><td><textarea class=\"fld \" data-f=\"m6b.t5.r9.c1\" rows=\"2\" aria-label=\"A partner heard one Part B reason and could follow it without a question, Yes or no?\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r9.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m6b.t5.r9.c2\" rows=\"2\" aria-label=\"A partner heard one Part B reason and could follow it without a question, What I will fix, and when\"><\/textarea><div class=\"pm\" data-m=\"m6b.t5.r9.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m6b.t5\" data-cols=\"3\">+ Add row<\/button>"], ["Rev 2 and Rev 3 (optional)", "<p class=\"docmeta\">Module 6 online work. Optional enrichment. About 45 minutes. Not graded.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this handout<\/p><p>This handout is optional. Read it if you want to know why the course uses Revision 2 when NIST has published Revision 3.<\/p><p>It explains which revision CMMC uses and why, what changed in Revision 3, and where the 12 D3 requirements went.<\/p><p>For D3, keep using Revision 2 numbers, such as 3.5.3. Do not use Revision 3 numbers in your work.<\/p><\/aside>\n<h3>Two revisions, one rule for this course<\/h3>\n<p>NIST SP 800-171 is the publication that lists the security requirements for protecting Controlled Unclassified Information (CUI) in a company&#x27;s systems. CUI is government information that must be protected, but is not classified. NIST, the National Institute of Standards and Technology, writes the publication. The Department of Defense (DoD) decides which version its contractors must meet.<\/p>\n<p>NIST published Revision 3 on May 14, 2024. On the NIST website, Revision 3 replaces Revision 2. So if you search for &quot;NIST SP 800-171&quot;, you will probably find Revision 3 first.<\/p>\n<p>CMMC Level 2 still uses Revision 2. Two rules say so.<\/p>\n<ul><li><strong>The CMMC rule.<\/strong> 32 CFR 170.14(c)(3) says the security requirements in CMMC Level 2 are identical to the requirements in NIST SP 800-171 R2. R2 means Revision 2. A change to Revision 3 would need a change to this rule.<\/li><li><strong>The contract clause.<\/strong> DFARS 252.204-7012 is the contract clause that requires contractors to protect CUI. It does not name a revision. On May 2, 2024, DoD issued Class Deviation 2024-O0013. A class deviation is an official instruction to contracting officers to use different clause wording. This one tells them to require Revision 2.<\/li><\/ul>\n<p>When this handout was last checked, in November 2026, DoD still required Revision 2. Check the CMMC rule and the DoD class deviations page before you rely on this. The links are at the end.<\/p>\n<h3>What changed in Revision 3<\/h3>\n<div class=\"tbl-wrap\"><table data-tid=\"rev2_r.t1\"><thead><tr><th scope=\"col\"><strong>Feature<\/strong><\/th><th scope=\"col\"><strong>Revision 2 (February 2020, updated January 2021)<\/strong><\/th><th scope=\"col\"><strong>Revision 3 (May 2024)<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Number of requirements<\/th><td>110<\/td><td>97<\/td><\/tr><tr><th scope=\"row\">Number of families<\/th><td>14<\/td><td>17<\/td><\/tr><tr><th scope=\"row\">New families<\/th><td>None<\/td><td>Planning; System and Services Acquisition; Supply Chain Risk Management<\/td><\/tr><tr><th scope=\"row\">Numbering style<\/th><td>3.1.1<\/td><td>03.01.01<\/td><\/tr><tr><th scope=\"row\">Organization-defined parameters<\/th><td>Not used<\/td><td>Used in many requirements<\/td><\/tr><tr><th scope=\"row\">Withdrawn requirements<\/th><td>None<\/td><td>33 Revision 2 requirements were withdrawn. Their content was moved into other requirements or is covered by them.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A family is a group of requirements on one topic, such as Access Control. The numbering style changed so that every part of the number has two digits. For example, 3.1.1 becomes 03.01.01.<\/p>\n<h4>Organization-defined parameters<\/h4>\n<p>An organization-defined parameter (ODP) is a blank in a requirement that someone must fill in, such as a time period or a frequency. Revision 3 marks each one with the words &quot;Assignment: organization-defined&quot;.<\/p>\n<p>Here is an example. Revision 3 says a company must disable system accounts when they &quot;have been inactive for [Assignment: organization-defined time period]&quot;. The Revision 2 requirement, 3.1.1, did not say this.<\/p>\n<p>NIST says a federal agency may fill in the value. If the agency does not, the company must choose the value itself. NIST&#x27;s comparison file lists 49 Revision 3 requirements that gained at least one new ODP.<\/p>\n<p>Why does this matter? A requirement with a blank is harder to judge. Before you can decide MET or NOT MET, you must know the value that applies, and check that the company meets it.<\/p>\n<h3>Where the 12 D3 requirements went<\/h3>\n<p>This table uses NIST&#x27;s own Revision 2 to Revision 3 comparison file. &quot;Withdrawn&quot; means the Revision 3 number exists only as a pointer to where the content went.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"rev2_r.t2\"><thead><tr><th scope=\"col\"><strong>Revision 2<\/strong><\/th><th scope=\"col\"><strong>What it covers<\/strong><\/th><th scope=\"col\"><strong>Revision 3<\/strong><\/th><th scope=\"col\"><strong>What NIST&#x27;s comparison file says<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">3.5.3<\/th><td>Multifactor authentication<\/td><td>03.05.03, Multi-Factor Authentication<\/td><td>Minor change. Revision 3 requires MFA for access to privileged and non-privileged accounts. NIST calls this a change in applicability to all system accounts.<\/td><\/tr><tr><th scope=\"row\">3.1.1<\/th><td>Limit access to authorized users, processes, and devices<\/td><td>03.01.01, Account Management<\/td><td>Significant change. More detail on managing accounts, and new ODPs, such as the time limits for inactive accounts.<\/td><\/tr><tr><th scope=\"row\">3.3.1<\/th><td>Create and keep audit logs<\/td><td>03.03.01, Event Logging<\/td><td>Significant change. New ODPs, such as which event types to log.<\/td><\/tr><tr><th scope=\"row\">3.11.2<\/th><td>Scan for vulnerabilities<\/td><td>03.11.02, Vulnerability Monitoring and Scanning<\/td><td>Significant change. New ODPs for how often to scan and how fast to fix. It also takes in 3.11.3, fixing vulnerabilities, which was withdrawn.<\/td><\/tr><tr><th scope=\"row\">3.6.1<\/th><td>Incident handling<\/td><td>03.06.01, Incident Handling<\/td><td>Significant change. It ties incident handling to a written incident response plan.<\/td><\/tr><tr><th scope=\"row\">3.4.1<\/th><td>Baseline configurations and inventories<\/td><td>03.04.01, Baseline Configuration<\/td><td>Minor change, with a new ODP for how often to review the baseline. Revision 3 also adds a separate new requirement, 03.04.10, System Component Inventory.<\/td><\/tr><tr><th scope=\"row\">3.7.5<\/th><td>MFA for remote maintenance, and ending those sessions<\/td><td>03.07.05, Nonlocal Maintenance<\/td><td>Minor change.<\/td><\/tr><tr><th scope=\"row\">3.12.4<\/th><td>System Security Plan<\/td><td>03.15.02, System Security Plan<\/td><td>Moved to the new Planning family. The number 03.12.04 is withdrawn and points to 03.15.02. A new ODP sets how often to review the plan.<\/td><\/tr><tr><th scope=\"row\">3.13.3<\/th><td>Separate user functions from system management functions<\/td><td>Withdrawn (03.13.03)<\/td><td>Addressed by the access control requirements 03.01.01 to 03.01.07.<\/td><\/tr><tr><th scope=\"row\">3.8.7<\/th><td>Control removable media<\/td><td>03.08.07, Media Use<\/td><td>Significant change. A new ODP names which kinds of removable media are restricted or banned.<\/td><\/tr><tr><th scope=\"row\">3.2.2<\/th><td>Role-based training<\/td><td>03.02.02, Role-Based Training<\/td><td>Significant change. New ODPs for how often to train and to update the training.<\/td><\/tr><tr><th scope=\"row\">3.10.3<\/th><td>Escort visitors and monitor visitor activity<\/td><td>Withdrawn (03.10.03)<\/td><td>Incorporated into 03.10.07, Physical Access Control, which is a new requirement.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Three questions to think about<\/h3>\n<p>These questions are for your own learning. You do not submit them.<\/p>\n<ul><li>Two of the 12 D3 requirements are withdrawn in Revision 3. If ThreadBridge fixed G-09 and G-12, where would an assessor look for them under Revision 3?<\/li><li>ThreadBridge&#x27;s 3.5.3 gap covers seven systems. Would the Revision 3 wording change how many accounts need MFA?<\/li><li>In D3 you score ThreadBridge with point values for 110 requirements. What would have to change before a company could be scored under Revision 3?<\/li><\/ul>\n<p><strong>[PAGE]   Sources for this handout<\/strong><\/p>\n<p><em>Links to every source used<\/em><\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"rev2_r.t3\"><thead><tr><th scope=\"col\"><strong>Source<\/strong><\/th><th scope=\"col\"><strong>Link<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">NIST SP 800-171 Revision 3 (May 2024)<\/th><td><a href=\"https://csrc.nist.gov/pubs/sp/800/171/r3/final\" target=\"_blank\" rel=\"noopener\">https://csrc.nist.gov/pubs/sp/800/171/r3/final<\/a><\/td><\/tr><tr><th scope=\"row\">NIST change analysis, Revision 2 to Revision 3 (spreadsheet)<\/th><td><a href=\"https://csrc.nist.gov/files/pubs/sp/800/171/r3/final/docs/sp800-171r2-to-r3-analysis.xlsx\" target=\"_blank\" rel=\"noopener\">https://csrc.nist.gov/files/pubs/sp/800/171/r3/final/docs/sp800-171r2-to-r3-analysis.xlsx<\/a><\/td><\/tr><tr><th scope=\"row\">NIST SP 800-171 Revision 3, HTML version<\/th><td><a href=\"https://nvlpubs.nist.gov/nistpubs/SpecialPublications/800-171r3/NIST.SP.800-171r3.html\" target=\"_blank\" rel=\"noopener\">https://nvlpubs.nist.gov/nistpubs/SpecialPublications/800-171r3/NIST.SP.800-171r3.html<\/a><\/td><\/tr><tr><th scope=\"row\">NIST SP 800-171 Revision 2<\/th><td><a href=\"https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final\" target=\"_blank\" rel=\"noopener\">https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final<\/a><\/td><\/tr><tr><th scope=\"row\">32 CFR 170.14, CMMC model<\/th><td><a href=\"https://www.ecfr.gov/current/title-32/subtitle-A/chapter-I/subchapter-G/part-170/subpart-D/section-170.14\" target=\"_blank\" rel=\"noopener\">https://www.ecfr.gov/current/title-32/subtitle-A/chapter-I/subchapter-G/part-170/subpart-D/section-170.14<\/a><\/td><\/tr><tr><th scope=\"row\">DoD class deviations (DFARS)<\/th><td><a href=\"https://www.acq.osd.mil/dpap/dars/class_deviations.html\" target=\"_blank\" rel=\"noopener\">https://www.acq.osd.mil/dpap/dars/class_deviations.html<\/a><\/td><\/tr><\/tbody><\/table><\/div>"]], "deliv": "Module 6 activities", "keys": ["m6b"]}, {"id": "d3", "group": "Module 6", "nav": "D3 Self-Assessment Workbook", "title": "D3 — Self-Assessment Workbook", "meta": "Individual. Workbook with Parts A, B, and C. Due at the end of Week 6", "tabs": [["Brief", "<h3>The task<\/h3>\n<p>ThreadBridge&#x27;s leaders want to know where the company stands before it bids on the new DLA contract. You complete the self-assessment workbook for the 12 guided requirements. Each requirement matches one gap in ThreadBridge&#x27;s gap list. Then you calculate the company&#x27;s score. All three parts are your own work.<\/p>\n<p>Most of D3 is written outside class. You started Part A in Module 5 Session B and finished it in the Module 5 online work. You start Part B in Session A this week. Plan on about 10 hours outside class across Weeks 5 and 6.<\/p>\n<h3>What to include<\/h3>\n<p>1. <strong>Part A, the evidence log.<\/strong> For each of the 12 requirements, list the evidence available. Say whether it is adequate and whether it is sufficient. Say what more would be needed. You started this in Module 5.<\/p>\n<p>2. <strong>Part B, the determinations.<\/strong> For each requirement, give MET or NOT MET. Give the reason, and cite the evidence from Part A. For each NOT MET, choose one root cause type: no policy, no owner, no schedule, no risk decision, or technical.<\/p>\n<p>3. <strong>Part C, the SPRS score.<\/strong> Use the gap list as ThreadBridge maps it. Fill in the point value and the deduction for each line. Complete the computation table. Answer the question about whether ThreadBridge could post the score.<\/p>\n<p>4. <strong>Plain language.<\/strong> A ThreadBridge manager with no security background should be able to read each reason and follow it.<\/p>\n<h3>Requirements<\/h3>\n<ul><li>Use the D3 template. The 12 requirements, the gap list, and the tables are in it.<\/li><li>Every reason in Part B names specific evidence. &quot;No evidence&quot; is a reason only if you say what you looked for.<\/li><li>If you think ThreadBridge mapped a gap to the wrong requirement, say so in Part C and explain. Score the gap list as the company maps it, then show the effect of your correction.<\/li><li>Show your arithmetic in Part C. A score with no work shown earns no points for score accuracy.<\/li><li>Do not recommend fixes. State what is missing.<\/li><li>Submit one Word file with Parts A, B, and C through Canvas. You may use the D3 page in the course lab, cmmc_lab.html.<\/li><li>Write every entry yourself. You may discuss ideas with a partner in class, but your workbook must be your own.<\/li><\/ul>\n<h3>Rubric<\/h3>\n<p>D3 is worth 100 points. Each criterion is worth 20 points. Exceeds earns 20 points, Mastery 18, Near 15, Below 11, and No Evidence 0. Work not submitted earns zero.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t1\"><thead><tr><th scope=\"col\"><strong>Criterion<\/strong><\/th><th scope=\"col\"><strong>No Evidence<\/strong><\/th><th scope=\"col\"><strong>Below<\/strong><\/th><th scope=\"col\"><strong>Near<\/strong><\/th><th scope=\"col\"><strong>Mastery<\/strong><\/th><th scope=\"col\"><strong>Exceeds<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Evidence identification (20 points)<\/th><td>Not addressed, or no evidence named<\/td><td>Evidence is missing for many requirements, or is a topic, not an item<\/td><td>A specific item, or a clear note of what is missing, for most requirements; a few entries are vague<\/td><td>A specific item of evidence, or a clear statement of what is missing, for all 12<\/td><td>Also notes which evidence covers only part of the scope, such as one system or one site<\/td><\/tr><tr><th scope=\"row\">Adequacy and sufficiency (20 points)<\/th><td>Not addressed, or no judgment given<\/td><td>Treats a document or an export as proof because it exists<\/td><td>Judges both tests for most items, but merges them in places or gives no reason<\/td><td>Judges adequacy and sufficiency separately for every item, with a reason<\/td><td>States exactly what more would make each item sufficient, as items someone could hand over<\/td><\/tr><tr><th scope=\"row\">Determinations (20 points)<\/th><td>Not addressed, or no determinations given<\/td><td>Determinations missing for several requirements, or partial credit given<\/td><td>Determinations for all 12, but several reasons do not cite evidence, or root cause types are missing<\/td><td>Correct determination for all 12, each with an evidence-based reason and a root cause type<\/td><td>Each reason names the part that fails; notes the G-08 mapping to 3.12.1 instead of 3.12.4<\/td><\/tr><tr><th scope=\"row\">Score accuracy (20 points)<\/th><td>No score given<\/td><td>Wrong method, or a score with no work shown<\/td><td>Right method and work shown, but one or two wrong point values or an arithmetic error<\/td><td>Correct point values, deductions, score, and ratio, with work shown<\/td><td>Also explains whether the score could be posted, and why the true score could be lower<\/td><\/tr><tr><th scope=\"row\">Communication (20 points)<\/th><td>Not addressed, or no reason a reader could follow<\/td><td>A manager could not follow it<\/td><td>Understandable, but has unexplained jargon in places<\/td><td>Clear and plain; terms defined<\/td><td>A manager could act on it without asking a follow-up question<\/td><\/tr><\/tbody><\/table><\/div>"], ["Your work", "<p class=\"docmeta\">Individual workbook: Parts A, B, and C are all your own work. Due at the end of Week 6.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>You work as a member of ThreadBridge&#x27;s compliance team. You complete this whole workbook yourself. It has three parts:<\/p><p>•  Part A, the evidence log. You start it in Module 5 Session B and finish it in the Module 5 online work.<\/p><p>•  Part B, the determinations. You start it in Module 6 Session A and finish it in the Module 6 online work.<\/p><p>•  Part C, the SPRS score. You complete it outside class, after Module 6 Session B. Do not share your work on Part C.<\/p><p>You may talk about ideas with a partner in class. Every entry in this workbook must be written by you.<\/p><p>Use the ThreadBridge case (threadbridge.html), the artifacts and the Technical Evidence Lab exports from Module 5, and the official sources. The case has an SPRS Score Calculator. It does not give you the point values. You look up each value in Annex A and type it in, and the calculator adds up your deductions. It does not tell you whether your values are right.<\/p><p>Type your answers into the empty cells. You can add rows if you need them. The rubric is on the D3 assignment page in Canvas.<\/p><\/aside>\n<h3>Your name<\/h3>\n<div class=\"tbl-wrap\"><table data-tid=\"d3.t1\"><thead><tr><th scope=\"col\"><strong>Name<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d3.t1.r1.c0\" rows=\"2\" aria-label=\"row 1, Name\"><\/textarea><div class=\"pm\" data-m=\"d3.t1.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>The 12 guided requirements<\/h3>\n<p>Each requirement matches one gap in ThreadBridge&#x27;s gap list. The requirement text is quoted from NIST SP 800-171 Rev 2. The gap description is in ThreadBridge&#x27;s own words. The exact assessment objectives for each requirement are in NIST SP 800-171A and in the CMMC Assessment Guide for Level 2.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d3.t2\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>Requirement text (NIST SP 800-171 Rev 2)<\/strong><\/th><th scope=\"col\"><strong>ThreadBridge&#x27;s gap description<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">3.5.3<\/th><td>G-01<\/td><td>Use multifactor authentication for local and network access to privileged accounts and for network access to non-privileged accounts.<\/td><td>MFA on Microsoft 365 only; ERP, file server, DC RDP, VPN, QuickBooks, NAS all single-factor<\/td><\/tr><tr><th scope=\"row\">3.1.1<\/th><td>G-02<\/td><td>Limit system access to authorized users, processes acting on behalf of authorized users, and devices (including other systems).<\/td><td>No access control matrix; access managed from memory; orphaned admin account 14 months<\/td><\/tr><tr><th scope=\"row\">3.3.1<\/th><td>G-03<\/td><td>Create and retain system audit logs and records to the extent needed to enable the monitoring, analysis, investigation, and reporting of unlawful or unauthorized system activity.<\/td><td>Logs enabled, never reviewed; no retention policy; no SIEM<\/td><\/tr><tr><th scope=\"row\">3.11.2<\/th><td>G-04<\/td><td>Scan for vulnerabilities in organizational systems and applications periodically and when new vulnerabilities affecting those systems and applications are identified.<\/td><td>Last vulnerability scan June 2025; no schedule; no remediation tracking<\/td><\/tr><tr><th scope=\"row\">3.6.1<\/th><td>G-05<\/td><td>Establish an operational incident-handling capability for organizational systems that includes preparation, detection, analysis, containment, recovery, and user response activities.<\/td><td>No written incident response plan; two incidents handled informally; neither reported<\/td><\/tr><tr><th scope=\"row\">3.4.1<\/th><td>G-06<\/td><td>Establish and maintain baseline configurations and inventories of organizational systems (including hardware, software, firmware, and documentation) throughout the respective system development life cycles.<\/td><td>No baseline configurations; no change management; software installed on request<\/td><\/tr><tr><th scope=\"row\">3.7.5<\/th><td>G-07<\/td><td>Require multifactor authentication to establish nonlocal maintenance sessions via external network connections and terminate such connections when nonlocal maintenance is complete.<\/td><td>Vendor has ERP access with no CUI clause, no escort, no sanitization requirement<\/td><\/tr><tr><th scope=\"row\">3.12.4<\/th><td>G-08<\/td><td>Develop, document, and periodically update system security plans that describe system boundaries, system environments of operation, how security requirements are implemented, and the relationships with or connections to other systems.<\/td><td>No System Security Plan exists<\/td><\/tr><tr><th scope=\"row\">3.13.3<\/th><td>G-09<\/td><td>Separate user functionality from system management functionality.<\/td><td>One VLAN for all devices; unmanaged tablets on the same LAN as the ERP and file server<\/td><\/tr><tr><th scope=\"row\">3.8.7<\/th><td>G-10<\/td><td>Control the use of removable media on system components.<\/td><td>No removable media policy; no sanitization procedure; USB drives used freely<\/td><\/tr><tr><th scope=\"row\">3.2.2<\/th><td>G-11<\/td><td>Ensure that personnel are trained to carry out their assigned information security-related duties and responsibilities.<\/td><td>60% training completion; no role-based training for CUI handlers<\/td><\/tr><tr><th scope=\"row\">3.10.3<\/th><td>G-12<\/td><td>Escort visitors and monitor visitor activity.<\/td><td>No visitor log for the server room; no badge access at the second site<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Some terms in the gap descriptions: MFA is multifactor authentication. ERP is the company&#x27;s enterprise resource planning system. DC RDP is remote desktop access to the domain controller, the server that manages user accounts. VPN is the virtual private network used for remote access. NAS is the backup storage device. SIEM is a tool that collects and reviews logs in one place. A VLAN is a separate section of a network.<\/p>\n<h3>Part A — Evidence log<\/h3>\n<p>For each requirement, list the evidence ThreadBridge has. Name a specific item, such as a document, a setting, a record, or an interview answer. Then judge it.<\/p>\n<ul><li>Adequate: does the evidence exist and match what the requirement intends? Write Yes, No, or Partly, with a short reason.<\/li><li>Sufficient: is there enough to show the control is in place, followed, and working across the whole scope? Write Yes, No, or Partly, with a short reason.<\/li><li>What more is needed: name the evidence that would be needed to show the requirement is met. Do not say how to fix the gap.<\/li><\/ul>\n<p>If there is no evidence, write &quot;None found&quot; and say what you looked for.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d3.t3\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>Evidence available<\/strong><\/th><th scope=\"col\"><strong>Adequate?<\/strong><\/th><th scope=\"col\"><strong>Sufficient?<\/strong><\/th><th scope=\"col\"><strong>What more is needed<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">3.5.3<\/th><td>G-01<\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r1.c2\" rows=\"2\" aria-label=\"3.5.3, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r1.c3\" rows=\"2\" aria-label=\"3.5.3, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r1.c4\" rows=\"2\" aria-label=\"3.5.3, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r1.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r1.c5\" rows=\"2\" aria-label=\"3.5.3, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r1.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">3.1.1<\/th><td>G-02<\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r2.c2\" rows=\"2\" aria-label=\"3.1.1, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r2.c3\" rows=\"2\" aria-label=\"3.1.1, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r2.c4\" rows=\"2\" aria-label=\"3.1.1, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r2.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r2.c5\" rows=\"2\" aria-label=\"3.1.1, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r2.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">3.3.1<\/th><td>G-03<\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r3.c2\" rows=\"2\" aria-label=\"3.3.1, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r3.c3\" rows=\"2\" aria-label=\"3.3.1, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r3.c4\" rows=\"2\" aria-label=\"3.3.1, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"d3.t3.r3.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t3.r3. ss=\"fld \" data-f=\"d3.t6.r3.c1\" rows=\"2\" aria-label=\"Score (110 minus total deductions), Value\"><\/textarea><div class=\"pm\" data-m=\"d3.t6.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Score ÷ 110<\/th><td><textarea class=\"fld \" data-f=\"d3.t6.r4.c1\" rows=\"2\" aria-label=\"Score ÷ 110, Value\"><\/textarea><div class=\"pm\" data-m=\"d3.t6.r4.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d3.t6\" data-cols=\"2\">+ Add row<\/button>\n<p><strong>Mapping notes.<\/strong> Use this table for any line with a deduction of 0, and for any mapping you think is wrong. Name the requirement you would use, explain why, and show how the score would change.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d3.t7\"><thead><tr><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>What you noticed<\/strong><\/th><th scope=\"col\"><strong>The requirement you would use, and why<\/strong><\/th><th scope=\"col\"><strong>Effect on the score<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d3.t7.r1.c0\" rows=\"2\" aria-label=\"row 1, Gap\"><\/textarea><div class=\"pm\" data-m=\"d3.t7.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t7.r1.c1\" rows=\"2\" aria-label=\"row 1, What you noticed\"><\/textarea><div class=\"pm\" data-m=\"d3.t7.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t7.r1.c2\" rows=\"2\" aria-label=\"row 1, The requirement you would use, and why\"><\/textarea><div class=\"pm\" data-m=\"d3.t7.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t7.r1.c3\" rows=\"2\" aria-label=\"row 1, Effect on the score\"><\/textarea><div class=\"pm\" data-m=\"d3.t7.r1.c3\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"d3.t7.r2.c0\" rows=\"2\" aria-label=\"row 2, Gap\"><\/textarea><div class=\"pm\" data-m=\"d3.t7.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d3.t7.r2.c1\" rows=\"2\" aria-label=\"row 2, What you noti
