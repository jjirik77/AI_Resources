rea><div class=\"pm\" data-m=\"m2b.t5.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Step 4. Obligations that already apply.<\/strong> List the obligations that bind ThreadBridge even if the contract had no CMMC clause. Name the clause for each one.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m2b.t6\"><thead><tr><th scope=\"col\"><strong>Obligation<\/strong><\/th><th scope=\"col\"><strong>Clause or source<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m2b.t6.r1.c0\" rows=\"2\" aria-label=\"row 1, Obligation\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t6.r1.c1\" rows=\"2\" aria-label=\"row 1, Clause or source\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r1.c1\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m2b.t6.r2.c0\" rows=\"2\" aria-label=\"row 2, Obligation\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t6.r2.c1\" rows=\"2\" aria-label=\"row 2, Clause or source\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r2.c1\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m2b.t6.r3.c0\" rows=\"2\" aria-label=\"row 3, Obligation\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r3.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t6.r3.c1\" rows=\"2\" aria-label=\"row 3, Clause or source\"><\/textarea><div class=\"pm\" data-m=\"m2b.t6.r3.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m2b.t6\" data-cols=\"2\">+ Add row<\/button>\n<p>Before you leave, check one thing: can you point to the exact clause or source for every claim? If not, add it.<\/p>"]], "deliv": "Module 2 activities", "keys": ["m2b"]}, {"id": "d1", "group": "Module 2", "nav": "D1 How CMMC Applies", "title": "D1 — How CMMC Applies to ThreadBridge", "meta": "Individual. About 2 pages. Due at the end of Week 2", "tabs": [["Brief", "<h3>The task<\/h3>\n<p>Margaret Holloway, ThreadBridge&#x27;s chief executive officer (CEO), must decide how to prepare for the new DLA solicitation. She is not a compliance specialist. Write a memo to her that explains how CMMC applies to ThreadBridge. Use the D1 attachment, the official sources, and your work from both sessions. You start D1 in the last 20 minutes of Session B. You write most of it outside class, as part of your online work.<\/p>\n<h3>What to include<\/h3>\n<p>1. <strong>The contract chain.<\/strong> Trace the steps from the solicitation excerpt to the clause that makes CMMC binding. Name each regulation and clause by number.<\/p>\n<p>2. <strong>FCI and CUI determinations.<\/strong> Give a determination for each of the six inventory items in a table. For each item, give the determination (CUI, FCI, or neither), the Registry category if it is CUI, and a one-line reason. If an item cannot be settled, say so and say what would settle it.<\/p>\n<p>3. <strong>The CMMC level.<\/strong> State the level ThreadBridge needs for the new contract, and explain why.<\/p>\n<p>4. <strong>Obligations that already apply.<\/strong> Explain what ThreadBridge must already do even if the contract carried no CMMC clause, and why those rules apply today.<\/p>\n<p>5. <strong>Plain language.<\/strong> Write for an executive. Define each term and spell out each acronym the first time you use it.<\/p>\n<h3>Requirements<\/h3>\n<ul><li>About 2 pages. A table plus short paragraphs works well. Long blocks of text do not.<\/li><li>Cite official sources only: the CFR, the FAR, the DFARS, the NARA CUI Registry, or an official CMMC document. Name the part, section, or clause.<\/li><li>The company&#x27;s own classifications are claims. Do not repeat them as facts. Test each one.<\/li><li>Do not recommend fixes. Your job is to state what applies.<\/li><li>Submit as a Word file through Canvas. You may use the D1 template in the course lab, cmmc_lab.html.<\/li><\/ul>\n<h3>Rubric<\/h3>\n<p>D1 is worth 100 points. Each criterion is worth 20 points. Exceeds earns 20 points, Mastery 18, Near 15, Below 11, and No Evidence 0. Work not submitted earns zero.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t1\"><thead><tr><th scope=\"col\"><strong>Criterion<\/strong><\/th><th scope=\"col\"><strong>No Evidence<\/strong><\/th><th scope=\"col\"><strong>Below<\/strong><\/th><th scope=\"col\"><strong>Near<\/strong><\/th><th scope=\"col\"><strong>Mastery<\/strong><\/th><th scope=\"col\"><strong>Exceeds<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Regulatory chain (20 points)<\/th><td>Not addressed; no chain is given<\/td><td>The chain is wrong, or it names CMMC but not the clause that makes it binding<\/td><td>Names DFARS 252.204-7021, but skips a step or leaves a step without a citation<\/td><td>Traces the chain from the solicitation to DFARS 252.204-7021, with each step cited<\/td><td>Also notes that Section C.4.1 passes the requirements to subcontractors<\/td><\/tr><tr><th scope=\"row\">FCI/CUI determinations (20 points)<\/th><td>Not addressed, or no determinations given<\/td><td>Copies the company&#x27;s classifications, or misses items<\/td><td>Gives a determination for all six items, but one or two are wrong, or the reasons rest on how sensitive the data seems<\/td><td>Gives a correct determination, Registry category, and reason for all six items<\/td><td>Also names each company error and states what would settle the open item<\/td><\/tr><tr><th scope=\"row\">Level and basis (20 points)<\/th><td>No level is stated<\/td><td>States the wrong level, or a level with no reason<\/td><td>States Level 2 with a reason, but does not link it to the technical data in Section C.3.2<\/td><td>States Level 2 and links it to the technical data in Section C.3.2<\/td><td>Also explains that Level 1 still applies to FCI and states what must be in SPRS before award<\/td><\/tr><tr><th scope=\"row\">Pre-existing obligations (20 points)<\/th><td>Not addressed<\/td><td>Says nothing applies until a CMMC assessment<\/td><td>Names earlier clauses, but does not say what one or more of them require<\/td><td>Explains what DFARS 252.204-7012, 7019/7020, and FAR 52.204-21 require<\/td><td>Also explains why these bind ThreadBridge today under its current contract<\/td><\/tr><tr><th scope=\"row\">Communication (20 points)<\/th><td>Not written as a memo to the executive, or no terms are explained<\/td><td>The executive could not use it<\/td><td>Understandable, but has unexplained jargon or is much too long<\/td><td>Clear, plain, and about 2 pages; terms defined<\/td><td>The executive could act on it without asking a follow-up question<\/td><\/tr><\/tbody><\/table><\/div>"], ["Solicitation and data inventory", "<p class=\"docmeta\">D1 Attachment — ThreadBridge Solutions: Solicitation and Data Inventory<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this attachment<\/p><p>This attachment has everything you need for D1. It has five parts:<\/p><p>•  Part 1: an excerpt from a new DoD solicitation. A solicitation is the Government&#x27;s request for companies to bid on a contract.<\/p><p>•  Part 2: facts about ThreadBridge and its two current contracts.<\/p><p>•  Part 3: ThreadBridge&#x27;s own data inventory, with the company&#x27;s own classifications.<\/p><p>•  Part 4: what the current DLA contract requires, and what exists at ThreadBridge today.<\/p><p>•  Part 5: two events the company has already had.<\/p><p>The company and the solicitation are fictional. The format is real.<\/p><\/aside>\n<h3>Part 1 — The solicitation excerpt<\/h3>\n<p>Read the excerpt below. It does not state the CMMC level in plain words. You must reason to the level from the information the contractor will receive and handle.<\/p>\n<pre class=\"scenario\">— BEGIN EXCERPT —\n \nSolicitation Number: SPE1C1-26-R-0187\nIssuing Activity:    Defense Logistics Agency (DLA) Troop Support,\n                     Clothing &amp; Textiles Supply Chain, Philadelphia, PA\nTitle:               Flame-Resistant Combat Uniform Coat, Improved\n                     Pattern — Production and Delivery\nType:                Request for Proposal (RFP) — Indefinite Delivery /\n                     Indefinite Quantity, Firm Fixed Price\nSet-Aside:           Total Small Business Set-Aside\nEstimated Value:     $12,400,000 over a five-year ordering period\nIncumbent Contract:  SPE1C1-25-D-0014 (expiring)\nProposal Due:        Reference Section L\nNAICS:               315250 — Cut and Sew Apparel Contractors<\/pre>\n<pre class=\"scenario\">SECTION C — STATEMENT OF WORK (extract)\n \nC.3.2  Government-Furnished Technical Data.\nUpon award, the Government will furnish the Contractor with the\ncomplete Technical Data Package (TDP) for the Improved Pattern coat,\ncomprising engineering drawings, pattern grading specifications, seam\nand stitch construction standards, flame-resistance test protocols,\nand the approved materials list. Portions of the TDP bear Distribution\nStatement D and are subject to the export control provisions cited in\nSection I. The Contractor shall not reproduce, transmit, or disclose\nany element of the TDP outside the performance of this contract\nwithout prior written authorization of the Contracting Officer.\n \nC.3.3  Production Data and Reporting.\nThe Contractor shall maintain and transmit to the Government, via the\nDLA-designated portal, monthly production status reports, first-article\ntest results, lot traceability records, and any deviation or waiver\nrequests. Reports shall reference the applicable drawing numbers and\nrevision levels from the TDP.\n \nC.4.1  Subcontracting.\nThe Contractor may subcontract cutting, sewing, or finishing\noperations. Any subcontractor that will receive, store, process, or\ntransmit any portion of the Technical Data Package shall be identified\nto the Contracting Officer prior to release of that data, and the\nContractor shall include the applicable safeguarding and certification\nrequirements of Section I in any such subcontract.<\/pre>\n<pre class=\"scenario\">SECTION I — CONTRACT CLAUSES (partial listing)\nThe following clauses are incorporated by reference unless otherwise\nindicated:\n \nFAR 52.204-21      Basic Safeguarding of Covered Contractor\n                   Information Systems\nDFARS 252.204-7008 Compliance with Safeguarding Covered Defense\n                   Information Controls\nDFARS 252.204-7012 Safeguarding Covered Defense Information and\n                   Cyber Incident Reporting\nDFARS 252.204-7019 Notice of NIST SP 800-171 DoD Assessment\n                   Requirements\nDFARS 252.204-7020 NIST SP 800-171 DoD Assessment Requirements\nDFARS 252.204-7021 Cybersecurity Maturity Model Certification\n                   Requirements\n                   Required CMMC Status: ______ (see Section L.5)\nDFARS 252.225-7048 Export-Controlled Items\nDFARS 252.247-7023 Transportation of Supplies by Sea<\/pre>\n<pre class=\"scenario\">SECTION L — INSTRUCTIONS TO OFFERORS (extract)\n \nL.5  Cybersecurity Representations.\nOfferors shall, at the time of proposal submission, have a current\nassessment of record posted in the Supplier Performance Risk System\n(SPRS) covering all information systems that will process, store, or\ntransmit information furnished under Section C.3.2. The Contracting\nOfficer will verify the offeror&#x27;s status in SPRS prior to award. An\nofferor without a current assessment of record covering the applicable\nsystems will be ineligible for award.\n \nThe CMMC status required by DFARS 252.204-7021 shall be that which\ncorresponds to the categories of information identified in Section C,\ndetermined in accordance with 32 CFR Part 170.\n \n— END EXCERPT —<\/pre>\n<p>A few terms in the excerpt need a plain definition:<\/p>\n<ul><li>An Indefinite Delivery / Indefinite Quantity (IDIQ) contract lets the Government place orders over a set period, without fixing the exact amount at the start.<\/li><li>Firm Fixed Price means the price is set and does not change with the company&#x27;s costs.<\/li><li>The incumbent is the company that holds the current contract. Here, that is ThreadBridge.<\/li><li>A Technical Data Package (TDP) is the full set of drawings, specifications, and standards needed to make the item.<\/li><li>A Distribution Statement is a marking on a technical document that limits who may receive it.<\/li><li>An offeror is a company that submits a proposal.<\/li><\/ul>\n<h3>Part 2 — ThreadBridge and its two contracts<\/h3>\n<p>This solicitation will replace ThreadBridge&#x27;s current DLA contract. ThreadBridge must win it to stay in business.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d1x.t1\"><thead><tr><th scope=\"col\"><strong>Field<\/strong><\/th><th scope=\"col\"><strong>Value<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Legal name<\/th><td>ThreadBridge Solutions, LLC<\/td><\/tr><tr><th scope=\"row\">CAGE Code<\/th><td>7T4X2<\/td><\/tr><tr><th scope=\"row\">Location<\/th><td>Cumberland, Maryland (headquarters). Warehouse in Frostburg, 12 miles away.<\/td><\/tr><tr><th scope=\"row\">Founded and ownership<\/th><td>2004; privately held; Woman-Owned Small Business<\/td><\/tr><tr><th scope=\"row\">Employees<\/th><td>82<\/td><\/tr><tr><th scope=\"row\">Annual DoD revenue<\/th><td>About $14.2M<\/td><\/tr><tr><th scope=\"row\">Business<\/th><td>Combat utility uniforms made under a DLA Troop Support IDIQ contract. Also, commercial office supplies sold to federal agencies through a GSA Schedule.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A Commercial and Government Entity (CAGE) Code is the ID number the Government gives each contractor.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d1x.t2\"><thead><tr><th scope=\"col\"><strong>Contract<\/strong><\/th><th scope=\"col\"><strong>Agency and contract type<\/strong><\/th><th scope=\"col\"><strong>Value<\/strong><\/th><th scope=\"col\"><strong>What ThreadBridge handles under it<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">SPE1C1-25-D-0014<\/th><td>DLA Troop Support, IDIQ, firm fixed price<\/td><td>$11.2M over 5 years<\/td><td>Technical specifications for uniforms, provided by the Government. They include fabric content and camouflage pattern tolerances. Delivery sites. Production and delivery schedules. Pricing, and contract letters and emails.<\/td><\/tr><tr><th scope=\"row\">GS-02F-8847X<\/th><td>GSA Multiple Award Schedule (MAS)<\/td><td>$3.2M each year<\/td><td>Office supply orders, billing codes, and delivery data for federal agency customers. No technical data.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A General Services Administration (GSA) Schedule, formally the Multiple Award Schedule, is a long-term contract that lets any federal agency buy products at prices set in advance.<\/p>\n<p>Both sets of contract information live on the same file server, in the same Microsoft 365 account, and are handled by the same people.<\/p>\n<h3>Part 3 — ThreadBridge&#x27;s data inventory<\/h3>\n<p>These are the six entries in the company&#x27;s data inventory. The &quot;Company classification&quot; line is ThreadBridge&#x27;s own classification, copied exactly. Treat each one as a claim to test, not as a fact.<\/p>\n<h4>Item 1 — Uniform technical specifications<\/h4>\n<p>Material makeup sheets, camouflage pattern data, and Army and Air Force OCP color and weave tolerances. DLA provides them after award.<\/p>\n<ul><li>Company classification: CUI, &quot;Critical Technology&quot;<\/li><li>Where it is stored: /CUI/Contracts/DLA/Specs on the file server, and copied to a SharePoint folder.<\/li><li>Who uses it: Robert Chen (Production), Dennis Park (IT), Sandra Ybarra (Contracts).<\/li><\/ul>\n<h4>Item 2 — Delivery destination data<\/h4>\n<p>Military unit locations and base shipping addresses for each delivery order. They are kept in the delivery module of the Enterprise Resource Planning (ERP) system and exported to the file server for the shipping staff. An ERP system is business software that tracks orders, production, and inventory.<\/p>\n<ul><li>Company classification: CUI, &quot;CTI&quot;<\/li><li>Where it is stored: the ERP delivery module (SRV-001) and the file server.<\/li><li>Who uses it: Ybarra, Chen, and Marcus Webb (Warehouse).<\/li><\/ul>\n<h4>Item 3 — Employee clearance submissions<\/h4>\n<p>SF-86 data and personnel security questionnaire answers for the few staff who needed a security clearance decision. They were collected on behalf of the Government.<\/p>\n<ul><li>Company classification: CUI, &quot;Privacy—Personnel&quot;<\/li><li>Where it is stored: /HR/Clearances on the file server, and a SharePoint HR folder.<\/li><li>Who uses it: Lisa Nguyen (HR) and Margaret Holloway (CEO).<\/li><\/ul>\n<h4>Item 4 — Synthetic fabric data<\/h4>\n<p>Specifications for an export-controlled synthetic material used in one uniform line. It is subject to the Export Administration Regulations (EAR). It is not under the International Traffic in Arms Regulations (ITAR).<\/p>\n<ul><li>Company classification: CUI, &quot;Export Controlled (EAR)&quot;<\/li><li>Where it is stored: /CUI/Materials/EAR on the file server; also sent by encrypted email.<\/li><li>Who uses it: Chen and Park.<\/li><\/ul>\n<h4>Item 5 — Employee payroll, labor hours, and vendor invoices<\/h4>\n<p>Payroll and benefits records for all 82 employees, production labor hours by lot, and invoices from commercial raw-material suppliers. ThreadBridge collected and created them as an employer and as a business, at its own cost.<\/p>\n<ul><li>Company classification: not consistent. See the note below.<\/li><li>Where it is stored: payroll in ADP (cloud) and QuickBooks; labor hours in the ERP; invoices on the file server and in email.<\/li><li>Who uses it: Nguyen, Holloway, and accounting staff.<\/li><\/ul>\n<h4>Item 6 — Contract pricing and cost data<\/h4>\n<p>Unit prices submitted to the DLA contracting officer, cost proposals, and negotiated rates. Also indirect cost data and the calculations behind it.<\/p>\n<ul><li>Company classification: FCI<\/li><li>Where it is stored: the file server and the SharePoint contracts folder; also in email.<\/li><li>Who uses it: Holloway and Ybarra.<\/li><\/ul>\n<aside class=\"callout warn\"><p class=\"callout-h\">The company&#x27;s records disagree about Item 5<\/p><p>ThreadBridge&#x27;s data classification page says some data does not meet the CUI definition. It names production labor hours, employee payroll, and commercial vendor invoices. It calls them sensitive business data.<\/p><p>The company&#x27;s list of outside providers, three screens away, lists ADP as processing &quot;Employee PII = CUI-Privacy.&quot;<\/p><p>Both cannot be right. Part of your work is to decide which is right, and to say what makes Item 5 different from Item 3, since both are about employees.<\/p><\/aside>\n<h3>Part 4 — What the DLA contract requires, and what exists today<\/h3>\n<div class=\"tbl-wrap\"><table data-tid=\"d1x.t3\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Status at ThreadBridge<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">DFARS 252.204-7012, safeguarding and 72-hour reporting<\/th><td>The clause is in SPE1C1-25-D-0014. No incident response plan exists. Neither event in Part 5 was assessed against the clause.<\/td><\/tr><tr><th scope=\"row\">DFARS 252.204-7019 / -7020, SPRS score<\/th><td>Never calculated and never submitted. The DLA contract requires it.<\/td><\/tr><tr><th scope=\"row\">DFARS 252.204-7021, CMMC<\/th><td>Not in the current contract. It is in the new DLA solicitation (Part 1).<\/td><\/tr><tr><th scope=\"row\">FAR 52.204-21, basic safeguarding of FCI<\/th><td>Applies through the GSA Schedule contract and the DLA contract.<\/td><\/tr><tr><th scope=\"row\">System Security Plan<\/th><td>None exists. The system boundary, data flows, and how each control is met have never been written down.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Part 5 — Two events the company has already had<\/h3>\n<p>Neither event was reported.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d1x.t4\"><thead><tr><th scope=\"col\"><strong>Event<\/strong><\/th><th scope=\"col\"><strong>What happened<\/strong><\/th><th scope=\"col\"><strong>What the company did<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">INC-001<\/th><td>An accounting staff member clicked a phishing link, and her password was exposed. The company has no multi-factor authentication (MFA) outside Microsoft 365 and no log review.<\/td><td>The IT Manager reset her password, and a reminder was emailed to all staff. The Contracts Manager decided it did not &quot;rise to that level,&quot; and no report was filed. There was no investigation, timeline, or root cause.<\/td><\/tr><tr><th scope=\"row\">INC-002<\/th><td>A laptop was lost.<\/td><td>Handled by informal email. No formal investigation, and no check against the reporting clause.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Phishing is a fake message that tricks a person into giving away a password or other information.<\/p>"], ["Your work", "<div class=\"memo-head\"><label><span>To<\/span><input class=\"fld\" data-f=\"d1.h.to\" aria-label=\"To\"><span class=\"pm\" data-m=\"d1.h.to\"><\/span><\/label><label><span>From<\/span><input class=\"fld\" data-f=\"d1.h.from\" aria-label=\"From\"><span class=\"pm\" data-m=\"d1.h.from\"><\/span><\/label><label><span>Date<\/span><input class=\"fld\" data-f=\"d1.h.date\" aria-label=\"Date\"><span class=\"pm\" data-m=\"d1.h.date\"><\/span><\/label><label><span>Subject<\/span><input class=\"fld\" data-f=\"d1.h.subject\" aria-label=\"Subject\"><span class=\"pm\" data-m=\"d1.h.subject\"><\/span><\/label><\/div><section class=\"msec\"><h4>1. The contract chain<\/h4><p class=\"prompt\">From the solicitation excerpt to the clause. Name the exact document or clause for each link.<\/p><textarea class=\"fld long\" data-f=\"d1.s1\" rows=\"7\" aria-label=\"The contract chain\"><\/textarea><div class=\"pm\" data-m=\"d1.s1\"><\/div><\/section><section class=\"msec\"><h4>2. FCI and CUI determinations<\/h4><p class=\"prompt\">Use the determination table below for all six inventory items.<\/p><textarea class=\"fld long\" data-f=\"d1.s2\" rows=\"7\" aria-label=\"FCI and CUI determinations\"><\/textarea><div class=\"pm\" data-m=\"d1.s2\"><\/div><\/section><section class=\"msec\"><h4>3. The CMMC level ThreadBridge needs<\/h4><p class=\"prompt\">State the level and the reason, with the clause or source.<\/p><textarea class=\"fld long\" data-f=\"d1.s3\" rows=\"7\" aria-label=\"The CMMC level ThreadBridge needs\"><\/textarea><div class=\"pm\" data-m=\"d1.s3\"><\/div><\/section><section class=\"msec\"><h4>4. Obligations that apply even with no CMMC clause<\/h4><p class=\"prompt\">Name each obligation and the clause it comes from.<\/p><textarea class=\"fld long\" data-f=\"d1.s4\" rows=\"7\" aria-label=\"Obligations that apply even with no CMMC clause\"><\/textarea><div class=\"pm\" data-m=\"d1.s4\"><\/div><\/section><section class=\"msec\"><h4>Determination table<\/h4><div class=\"tbl-wrap\"><table data-tid=\"d1.determinatio\"><thead><tr><th scope=\"col\">Item<\/th><th scope=\"col\">ThreadBridge said<\/th><th scope=\"col\">CUI, FCI, or neither<\/th><th scope=\"col\">Registry category and marking (if CUI)<\/th><th scope=\"col\">One-line reason<\/th><\/tr><\/thead><tbody><tr><td>Item 1<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r1.c1\" rows=\"2\" aria-label=\"Item 1 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r1.c2\" rows=\"2\" aria-label=\"Item 1 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r1.c3\" rows=\"2\" aria-label=\"Item 1 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r1.c4\" rows=\"2\" aria-label=\"Item 1 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r1.c4\"><\/div><\/td><\/tr><tr><td>Item 2<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r2.c1\" rows=\"2\" aria-label=\"Item 2 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r2.c2\" rows=\"2\" aria-label=\"Item 2 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r2.c3\" rows=\"2\" aria-label=\"Item 2 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r2.c4\" rows=\"2\" aria-label=\"Item 2 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r2.c4\"><\/div><\/td><\/tr><tr><td>Item 3<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r3.c1\" rows=\"2\" aria-label=\"Item 3 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r3.c2\" rows=\"2\" aria-label=\"Item 3 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r3.c3\" rows=\"2\" aria-label=\"Item 3 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r3.c4\" rows=\"2\" aria-label=\"Item 3 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r3.c4\"><\/div><\/td><\/tr><tr><td>Item 4<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r4.c1\" rows=\"2\" aria-label=\"Item 4 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r4.c2\" rows=\"2\" aria-label=\"Item 4 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r4.c3\" rows=\"2\" aria-label=\"Item 4 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r4.c4\" rows=\"2\" aria-label=\"Item 4 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r4.c4\"><\/div><\/td><\/tr><tr><td>Item 5<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r5.c1\" rows=\"2\" aria-label=\"Item 5 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r5.c2\" rows=\"2\" aria-label=\"Item 5 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r5.c3\" rows=\"2\" aria-label=\"Item 5 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r5.c4\" rows=\"2\" aria-label=\"Item 5 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r5.c4\"><\/div><\/td><\/tr><tr><td>Item 6<\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r6.c1\" rows=\"2\" aria-label=\"Item 6 ThreadBridge said\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r6.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r6.c2\" rows=\"2\" aria-label=\"Item 6 CUI, FCI, or neither\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r6.c3\" rows=\"2\" aria-label=\"Item 6 Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r6.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d1.determinatio.r6.c4\" rows=\"2\" aria-label=\"Item 6 One-line reason\"><\/textarea><div class=\"pm\" data-m=\"d1.determinatio.r6.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d1.determinatio\" data-cols=\"5\">+ Add row<\/button><\/section><p class=\"wc\" data-wc=\"d1\">Words: 0<\/p>"]], "deliv": "D1", "keys": ["d1x"]}, {"id": "m3a", "group": "Module 3", "nav": "Module 3 activities", "title": "Module 3 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 3 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activity 1.<\/p><p>These activities are practice and are not graded. This week you take the assessor&#x27;s view.<\/p><\/aside>\n<h3>How to fill in a ruling sheet<\/h3>\n<p>Activity 1 (Session A) and Activity 2 (Session B) use the same ruling sheet. For each scenario, fill in five things.<\/p>\n<ul><li><strong>Principle.<\/strong> Which of the eight principles of the Code of Professional Conduct (CoPC) applies? The eight are Professionalism, Impartiality, Confidentiality, Information Integrity, Lawful and Ethical Behavior, Equal Opportunity, Proper Use of CMMC Methods, and Proper Use of Technology and AI.<\/li><li><strong>Threat.<\/strong> Which of the five threats to independence is present: self-interest, self-review, advocacy, familiarity, or intimidation? A scenario can have two. If none fits, write &quot;none&quot; and say what kind of problem it is.<\/li><li><strong>What should happen.<\/strong> Disclose (report it in writing), mitigate (reduce it, for example by removing a person), avoid (decline the work), or another action. Say which.<\/li><li><strong>Who decides.<\/strong> The assessor, the C3PAO (the assessment firm), or someone else?<\/li><li><strong>Reason.<\/strong> One line.<\/li><\/ul>\n<p>Some short definitions for the scenarios. A Certified CMMC Assessor (CCA) is a person certified to assess companies. The Organization Seeking Certification (OSC) is the company being assessed. A C3PAO is a CMMC Third-Party Assessment Organization, the firm that does the assessment. A Registered Provider Organization (RPO) is a consulting firm that helps companies prepare.<\/p>\n<h3>Activity 1 — Ethics scenarios 1 to 4<\/h3>\n<p>Session A. Work with a partner for 20 minutes. Each of you fills in your own ruling sheet.<\/p>\n<p>Read each scenario. Then complete the ruling sheet below. One of these four scenarios is not mainly about independence.<\/p>\n<p><strong>Scenario 1 — The former employer.<\/strong> You are a CCA. Four years ago you spent three years as a systems administrator at the company your C3PAO has just been hired to assess. You built the file-share permission structure, and it is still in place. You left on good terms. You have never given CMMC consulting to anyone.<\/p>\n<p><strong>Scenario 2 — The spouse.<\/strong> Your spouse is a program manager at the OSC. Your spouse works on client delivery and has no IT, security, or CMMC duties. You have not told anyone at your C3PAO about the relationship. You think it has nothing to do with the systems being assessed.<\/p>\n<p><strong>Scenario 3 — The templates.<\/strong> Your C3PAO has a sister company that is an RPO. Eighteen months ago that RPO sold the OSC a package of CMMC policy templates and a gap-analysis workbook. A gap analysis compares current practices to the requirements and lists the gaps. No person from the RPO advised the OSC directly. The OSC bought the materials and used them on its own. The OSC now wants your C3PAO to do its Level 2 certification assessment.<\/p>\n<p><strong>Scenario 4 — The drafted finding.<\/strong> A team member wants to save time on a long evidence review. They paste several paragraphs of the OSC&#x27;s System Security Plan and a screenshot of its access settings into a public AI assistant on the web. They ask it to write the finding. They read the output, edit it, and enter it as their own determination.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3a.t1\"><thead><tr><th scope=\"col\"><strong>Scenario<\/strong><\/th><th scope=\"col\"><strong>Principle<\/strong><\/th><th scope=\"col\"><strong>Threat<\/strong><\/th><th scope=\"col\"><strong>What should happen<\/strong><\/th><th scope=\"col\"><strong>Who decides<\/strong><\/th><th scope=\"col\"><strong>Reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1 The former employer<\/th><td><textarea class=\"fld \" data-f=\"m3a.t1.r1.c1\" rows=\"2\" aria-label=\"1 The former employer, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r1.c2\" rows=\"2\" aria-label=\"1 The former employer, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r1.c3\" rows=\"2\" aria-label=\"1 The former employer, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r1.c4\" rows=\"2\" aria-label=\"1 The former employer, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r1.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r1.c5\" rows=\"2\" aria-label=\"1 The former employer, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r1.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">2 The spouse<\/th><td><textarea class=\"fld \" data-f=\"m3a.t1.r2.c1\" rows=\"2\" aria-label=\"2 The spouse, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r2.c2\" rows=\"2\" aria-label=\"2 The spouse, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r2.c3\" rows=\"2\" aria-label=\"2 The spouse, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r2.c4\" rows=\"2\" aria-label=\"2 The spouse, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r2.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r2.c5\" rows=\"2\" aria-label=\"2 The spouse, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r2.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">3 The templates<\/th><td><textarea class=\"fld \" data-f=\"m3a.t1.r3.c1\" rows=\"2\" aria-label=\"3 The templates, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r3.c2\" rows=\"2\" aria-label=\"3 The templates, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r3.c3\" rows=\"2\" aria-label=\"3 The templates, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r3.c4\" rows=\"2\" aria-label=\"3 The templates, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r3.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r3.c5\" rows=\"2\" aria-label=\"3 The templates, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r3.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">4 The drafted finding<\/th><td><textarea class=\"fld \" data-f=\"m3a.t1.r4.c1\" rows=\"2\" aria-label=\"4 The drafted finding, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r4.c2\" rows=\"2\" aria-label=\"4 The drafted finding, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r4.c3\" rows=\"2\" aria-label=\"4 The drafted finding, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r4.c4\" rows=\"2\" aria-label=\"4 The drafted finding, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r4.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3a.t1.r4.c5\" rows=\"2\" aria-label=\"4 The drafted finding, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3a.t1.r4.c5\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3a.t1\" data-cols=\"6\">+ Add row<\/button>\n<p>Does the three-year consulting rule apply to Scenario 1? Explain in one or two sentences.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3a.t2\"><thead><tr><th scope=\"col\"><strong>Does the three-year rule apply to Scenario 1, and why?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3a.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, Does the three-year rule apply to Scenario 1, and why?\"><\/textarea><div class=\"pm\" data-m=\"m3a.t2.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 3 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 2 and 4. Online, outside class: Activities 3 and 5.<\/p><p>These activities are practice and are not graded. This week you take the assessor&#x27;s view.<\/p><\/aside>\n<h3>How to fill in a ruling sheet<\/h3>\n<p>Activity 1 (Session A) and Activity 2 (Session B) use the same ruling sheet. For each scenario, fill in five things.<\/p>\n<ul><li><strong>Principle.<\/strong> Which of the eight principles of the Code of Professional Conduct (CoPC) applies? The eight are Professionalism, Impartiality, Confidentiality, Information Integrity, Lawful and Ethical Behavior, Equal Opportunity, Proper Use of CMMC Methods, and Proper Use of Technology and AI.<\/li><li><strong>Threat.<\/strong> Which of the five threats to independence is present: self-interest, self-review, advocacy, familiarity, or intimidation? A scenario can have two. If none fits, write &quot;none&quot; and say what kind of problem it is.<\/li><li><strong>What should happen.<\/strong> Disclose (report it in writing), mitigate (reduce it, for example by removing a person), avoid (decline the work), or another action. Say which.<\/li><li><strong>Who decides.<\/strong> The assessor, the C3PAO (the assessment firm), or someone else?<\/li><li><strong>Reason.<\/strong> One line.<\/li><\/ul>\n<p>Some short definitions for the scenarios. A Certified CMMC Assessor (CCA) is a person certified to assess companies. The Organization Seeking Certification (OSC) is the company being assessed. A C3PAO is a CMMC Third-Party Assessment Organization, the firm that does the assessment. A Registered Provider Organization (RPO) is a consulting firm that helps companies prepare.<\/p>\n<h3>Activity 2 — Ethics scenarios 5 to 8<\/h3>\n<p>Session B. Work with a new partner for about 18 minutes. Each of you fills in your own ruling sheet.<\/p>\n<p>Use the same ruling sheet. The Code has no written rule for one of these four scenarios. If you decide that, say so. Then reason from the principles and the threats.<\/p>\n<p><strong>Scenario 5 — The portfolio.<\/strong> On the last day of on-site work, the OSC&#x27;s chief executive gives each member of the assessment team a leather portfolio with the company logo. Each one is worth about $150. She says it is a thank-you for the team&#x27;s professional work, with no expectation, whatever the outcome. The team has not yet issued its determination.<\/p>\n<p><strong>Scenario 6 — The marginal control.<\/strong> One security requirement is truly borderline. The evidence is limited, and a reasonable assessor could decide either way. The OSC&#x27;s contact person mentions that a $4 million contract award depends on the certificate, and the award decision closes in three weeks. Separately, your C3PAO&#x27;s project manager says the engagement is over budget and asks if the team can finish the remaining items quickly.<\/p>\n<p><strong>Scenario 7 — The referral.<\/strong> At the out-brief, the closing meeting where the team presents its results, the OSC asks who could help fix the gaps the team found. A team member names a specific firm. He says it is excellent and that he knows its owner well. Two months later, that firm pays him a referral fee. He does not tell the C3PAO.<\/p>\n<p><strong>Scenario 8 — The chapter board.<\/strong> You and the OSC&#x27;s IT Director have both been board members of your local professional association chapter for two years. You see each other at monthly meetings. Sometimes you have dinner with the wider board afterward. There is no financial tie and no family tie, and you have never advised the company.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t1\"><thead><tr><th scope=\"col\"><strong>Scenario<\/strong><\/th><th scope=\"col\"><strong>Principle<\/strong><\/th><th scope=\"col\"><strong>Threat<\/strong><\/th><th scope=\"col\"><strong>What should happen<\/strong><\/th><th scope=\"col\"><strong>Who decides<\/strong><\/th><th scope=\"col\"><strong>Reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">5 The portfolio<\/th><td><textarea class=\"fld \" data-f=\"m3b.t1.r1.c1\" rows=\"2\" aria-label=\"5 The portfolio, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r1.c2\" rows=\"2\" aria-label=\"5 The portfolio, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r1.c3\" rows=\"2\" aria-label=\"5 The portfolio, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r1.c4\" rows=\"2\" aria-label=\"5 The portfolio, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r1.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r1.c5\" rows=\"2\" aria-label=\"5 The portfolio, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r1.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">6 The marginal control<\/th><td><textarea class=\"fld \" data-f=\"m3b.t1.r2.c1\" rows=\"2\" aria-label=\"6 The marginal control, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r2.c2\" rows=\"2\" aria-label=\"6 The marginal control, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r2.c3\" rows=\"2\" aria-label=\"6 The marginal control, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r2.c4\" rows=\"2\" aria-label=\"6 The marginal control, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r2.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r2.c5\" rows=\"2\" aria-label=\"6 The marginal control, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r2.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">7 The referral<\/th><td><textarea class=\"fld \" data-f=\"m3b.t1.r3.c1\" rows=\"2\" aria-label=\"7 The referral, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r3.c2\" rows=\"2\" aria-label=\"7 The referral, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r3.c3\" rows=\"2\" aria-label=\"7 The referral, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r3.c4\" rows=\"2\" aria-label=\"7 The referral, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r3.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r3.c5\" rows=\"2\" aria-label=\"7 The referral, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r3.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">8 The chapter board<\/th><td><textarea class=\"fld \" data-f=\"m3b.t1.r4.c1\" rows=\"2\" aria-label=\"8 The chapter board, Principle\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r4.c2\" rows=\"2\" aria-label=\"8 The chapter board, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r4.c3\" rows=\"2\" aria-label=\"8 The chapter board, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r4.c4\" rows=\"2\" aria-label=\"8 The chapter board, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r4.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t1.r4.c5\" rows=\"2\" aria-label=\"8 The chapter board, Reason\"><\/textarea><div class=\"pm\" data-m=\"m3b.t1.r4.c5\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3b.t1\" data-cols=\"6\">+ Add row<\/button>\n<p>Compare Scenario 8 with Scenario 2. Both are familiarity. Why is one weaker than the other?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t2\"><thead><tr><th scope=\"col\"><strong>Why is the tie in Scenario 8 weaker than the tie in Scenario 2?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3b.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, Why is the tie in Scenario 8 weaker than the tie in Scenario 2?\"><\/textarea><div class=\"pm\" data-m=\"m3b.t2.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 3 — What each phase produces<\/h3>\n<p>Online work, after Session B. Work alone. About 30 minutes.<\/p>\n<p>Each item below comes from one step of the CMMC Assessment Process (CAP). For each item, write the step that produces it: Before Phase 1, Phase 1, Phase 2, Phase 3, or Phase 4.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t3\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>Step<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1<\/th><td>A signed contract with no bonus or refund tied to the result<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r1.c2\" rows=\"2\" aria-label=\"1, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r1.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">2<\/th><td>A check for conflicts of interest, with a written plan to reduce any that are found<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r2.c2\" rows=\"2\" aria-label=\"2, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r2.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">3<\/th><td>The Lead CCA&#x27;s decision on whether the company is ready<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r3.c2\" rows=\"2\" aria-label=\"3, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r3.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">4<\/th><td>A Pre-Assessment Form, reviewed by quality assurance and uploaded<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r4.c2\" rows=\"2\" aria-label=\"4, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r4.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">5<\/th><td>A finding of MET, NOT MET, or NOT APPLICABLE (N/A) for each requirement<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r5.c2\" rows=\"2\" aria-label=\"5, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r5.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">6<\/th><td>Results presented to the company at the out-brief<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r6.c2\" rows=\"2\" aria-label=\"6, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r6.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">7<\/th><td>A certificate issued<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r7.c2\" rows=\"2\" aria-label=\"7, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r7.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">8<\/th><td>Open plan of action items closed, so a Conditional status becomes Final<\/td><td><textarea class=\"fld \" data-f=\"m3b.t3.r8.c2\" rows=\"2\" aria-label=\"8, Step\"><\/textarea><div class=\"pm\" data-m=\"m3b.t3.r8.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3b.t3\" data-cols=\"3\">+ Add row<\/button>\n<p>Which step would end the assessment before it starts if a firm could not reduce a conflict enough?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t4\"><thead><tr><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3b.t4.r1.c0\" rows=\"2\" aria-label=\"row 1, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m3b.t4.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 4 — Conflicts in a proposed assessment team<\/h3>\n<p>Session B. Work with your partner for 25 minutes. Each of you fills in your own table.<\/p>\n<p>ThreadBridge Solutions, LLC has asked Tidewater Assurance Group, LLC, an accredited C3PAO, for a Level 2 certification assessment. You are Tidewater. Read all of the facts below before you fill in the table. Some conflicts are in the team list. At least one is not. None is labeled.<\/p>\n<h4>The engagement packet: facts<\/h4>\n<p><strong>The request.<\/strong> Margaret Holloway, ThreadBridge&#x27;s chief executive officer, contacted Tidewater directly. ThreadBridge&#x27;s DLA contract is ending, and the new solicitation requires a current CMMC assessment. Holloway wants fieldwork within 120 days and has asked twice if it can be done sooner.<\/p>\n<p><strong>Earlier work between the two firms.<\/strong> Ten months ago, ThreadBridge hired Tidewater for a gap assessment against NIST SP 800-171 Rev 2. A gap assessment is not a certification assessment. It ran three days on site. Two of the assessors proposed now took part in it. Tidewater&#x27;s 26-page report included:<\/p>\n<ul><li>Section 4: thirteen gaps, each rated critical, high, or medium.<\/li><li>Appendix C, &quot;Recommended Remediation Sequence&quot;: a ranked plan for closing the thirteen gaps, with suggested tools for five of them, a timeline, and a cost range.<\/li><\/ul>\n<p>ThreadBridge built its Plan of Action and Milestones (POA&amp;M) directly from Section 4. It has worked partway through Appendix C. The IT Manager calls the report &quot;the most useful thing anyone has given us.&quot;<\/p>\n<p><strong>The draft engagement letter.<\/strong> It has not been signed yet. Two terms:<\/p>\n<ul><li>&quot;In the event a Certificate of CMMC Status is not issued, thirty percent (30%) of the fee shall be credited against a subsequent assessment conducted by Tidewater within twelve months.&quot;<\/li><li>&quot;Tidewater will make its assessors available to answer implementation questions arising from the assessment for a period of 60 days following the out-brief.&quot;<\/li><\/ul>\n<p><strong>The proposed team.<\/strong><\/p>\n<ul><li><strong>Dana Whitfield, proposed Lead CCA.<\/strong> Eight years in defense cybersecurity. Led eleven Level 2 certification assessments. No prior relationship with ThreadBridge. Did not take part in the gap assessment.<\/li><li><strong>Marcus Reyes, CCA.<\/strong> Worked at ThreadBridge as an IT specialist from 2019 to 2022. Built the Active Directory group structure and the file server permission model that are still in use, including on the folder that holds CUI. Left on good terms. Has given no services to the company since. Took part in the gap assessment.<\/li><li><strong>Priya Raghunathan, Certified CMMC Professional (CCP).<\/strong> Has served for two years with ThreadBridge&#x27;s IT Manager, Dennis Park, as board members of their local professional association chapter. They see each other monthly. No financial or family tie. Took part in the gap assessment.<\/li><li><strong>Thomas Blalock, CCA.<\/strong> No relationship with ThreadBridge. Owns about $30,000 of stock in Cardinal Industrial Group. Cardinal is the parent company of TechServ LLC, the vendor that maintains ThreadBridge&#x27;s business software (ERP) and has remote access to it. That system holds CUI. He told Tidewater about the stock when he joined.<\/li><li><strong>Nadia Farhat, quality assurance.<\/strong> Tidewater&#x27;s quality assurance person. Not on the assessment team. She reviews and uploads the Pre-Assessment Form. No relationship with ThreadBridge.<\/li><\/ul>\n<p><strong>One more request.<\/strong> Holloway has asked whether Tidewater can &quot;help us get the SSP written first, so we are not wasting your time.&quot; ThreadBridge has no System Security Plan (SSP).<\/p>\n<h4>The conflict table<\/h4>\n<p>For each row, write the fact that matters, the threat (or &quot;none&quot;), what should happen, and who decides.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t5\"><thead><tr><th scope=\"col\"><strong>Person or item<\/strong><\/th><th scope=\"col\"><strong>The fact that matters<\/strong><\/th><th scope=\"col\"><strong>Threat<\/strong><\/th><th scope=\"col\"><strong>What should happen<\/strong><\/th><th scope=\"col\"><strong>Who decides<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Tidewater as a firm<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r1.c1\" rows=\"2\" aria-label=\"Tidewater as a firm, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r1.c2\" rows=\"2\" aria-label=\"Tidewater as a firm, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r1.c3\" rows=\"2\" aria-label=\"Tidewater as a firm, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r1.c4\" rows=\"2\" aria-label=\"Tidewater as a firm, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Dana Whitfield<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r2.c1\" rows=\"2\" aria-label=\"Dana Whitfield, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r2.c2\" rows=\"2\" aria-label=\"Dana Whitfield, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r2.c3\" rows=\"2\" aria-label=\"Dana Whitfield, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r2.c4\" rows=\"2\" aria-label=\"Dana Whitfield, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Marcus Reyes<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r3.c1\" rows=\"2\" aria-label=\"Marcus Reyes, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r3.c2\" rows=\"2\" aria-label=\"Marcus Reyes, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r3.c3\" rows=\"2\" aria-label=\"Marcus Reyes, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r3.c4\" rows=\"2\" aria-label=\"Marcus Reyes, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Priya Raghunathan<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r4.c1\" rows=\"2\" aria-label=\"Priya Raghunathan, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r4.c2\" rows=\"2\" aria-label=\"Priya Raghunathan, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r4.c3\" rows=\"2\" aria-label=\"Priya Raghunathan, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r4.c4\" rows=\"2\" aria-label=\"Priya Raghunathan, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r4.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Thomas Blalock<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r5.c1\" rows=\"2\" aria-label=\"Thomas Blalock, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r5.c2\" rows=\"2\" aria-label=\"Thomas Blalock, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r5.c3\" rows=\"2\" aria-label=\"Thomas Blalock, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r5.c4\" rows=\"2\" aria-label=\"Thomas Blalock, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r5.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Nadia Farhat<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r6.c1\" rows=\"2\" aria-label=\"Nadia Farhat, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r6.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r6.c2\" rows=\"2\" aria-label=\"Nadia Farhat, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r6.c3\" rows=\"2\" aria-label=\"Nadia Farhat, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r6.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r6.c4\" rows=\"2\" aria-label=\"Nadia Farhat, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r6.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Engagement letter: the 30% fee credit<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r7.c1\" rows=\"2\" aria-label=\"Engagement letter: the 30% fee credit, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r7.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r7.c2\" rows=\"2\" aria-label=\"Engagement letter: the 30% fee credit, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r7.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r7.c3\" rows=\"2\" aria-label=\"Engagement letter: the 30% fee credit, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r7.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r7.c4\" rows=\"2\" aria-label=\"Engagement letter: the 30% fee credit, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r7.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Engagement letter: 60 days of answers<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r8.c1\" rows=\"2\" aria-label=\"Engagement letter: 60 days of answers, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r8.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r8.c2\" rows=\"2\" aria-label=\"Engagement letter: 60 days of answers, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r8.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r8.c3\" rows=\"2\" aria-label=\"Engagement letter: 60 days of answers, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r8.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r8.c4\" rows=\"2\" aria-label=\"Engagement letter: 60 days of answers, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r8.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">Holloway&#x27;s request to help write the SSP<\/th><td><textarea class=\"fld \" data-f=\"m3b.t5.r9.c1\" rows=\"2\" aria-label=\"Holloway&amp;#x27;s request to help write the SSP, The fact that matters\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r9.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r9.c2\" rows=\"2\" aria-label=\"Holloway&amp;#x27;s request to help write the SSP, Threat\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r9.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r9.c3\" rows=\"2\" aria-label=\"Holloway&amp;#x27;s request to help write the SSP, What should happen\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r9.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t5.r9.c4\" rows=\"2\" aria-label=\"Holloway&amp;#x27;s request to help write the SSP, Who decides\"><\/textarea><div class=\"pm\" data-m=\"m3b.t5.r9.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3b.t5\" data-cols=\"5\">+ Add row<\/button>\n<h4>The final question<\/h4>\n<p>May Tidewater do this assessment at all? Give your answer, the fact that decides it, and the rule it rests on. If it may not, say what ThreadBridge should be told about finding another C3PAO. Do not suggest how ThreadBridge should fix its gaps.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t6\"><thead><tr><th scope=\"col\"><strong>May Tidewater do this assessment? The deciding fact and the rule<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3b.t6.r1.c0\" rows=\"2\" aria-label=\"row 1, May Tidewater do this assessment? The deciding fact and the rule\"><\/textarea><div class=\"pm\" data-m=\"m3b.t6.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 5 — Two rulings in full<\/h3>\n<p>Online work, after Session B. Work alone. About 1.5 hours.<\/p>\n<p>In class you wrote short rulings in a table. Now write two of them in full, the way an assessor would explain a ruling to the C3PAO. Choose one scenario from Activity 1 (Scenarios 1 to 4, in your Session A workbook) and one from Activity 2 (Scenarios 5 to 8).<\/p>\n<p>For each ruling, write one paragraph of about 120 to 180 words. Your paragraph must do five things:<\/p>\n<p>1. State the fact in the scenario that creates the problem.<\/p>\n<p>2. Name the principle of the Code of Professional Conduct, and quote or closely restate the words in the Code that apply. If the Code has no written rule for the case, say so.<\/p>\n<p>3. Name the threat to independence, or say &quot;none&quot; and name the kind of problem.<\/p>\n<p>4. Say what should happen: disclose, mitigate, avoid, or another action.<\/p>\n<p>5. Say who decides, and why it is not the assessor.<\/p>\n<p>Then add one sentence: what one fact, if it were different, would change your ruling?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t7\"><thead><tr><th scope=\"col\"><strong>Scenario number and name<\/strong><\/th><th scope=\"col\"><strong>My ruling, in one paragraph<\/strong><\/th><th scope=\"col\"><strong>The fact that would change my ruling<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3b.t7.r1.c0\" rows=\"2\" aria-label=\"row 1, Scenario number and name\"><\/textarea><div class=\"pm\" data-m=\"m3b.t7.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t7.r1.c1\" rows=\"2\" aria-label=\"row 1, My ruling, in one paragraph\"><\/textarea><div class=\"pm\" data-m=\"m3b.t7.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t7.r1.c2\" rows=\"2\" aria-label=\"row 1, The fact that would change my ruling\"><\/textarea><div class=\"pm\" data-m=\"m3b.t7.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3b.t7\" data-cols=\"3\">+ Add row<\/button>\n<div class=\"tbl-wrap\"><table data-tid=\"m3b.t8\"><thead><tr><th scope=\"col\"><strong>Scenario number and name<\/strong><\/th><th scope=\"col\"><strong>My ruling, in one paragraph<\/strong><\/th><th scope=\"col\"><strong>The fact that would change my ruling<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m3b.t8.r1.c0\" rows=\"2\" aria-label=\"row 1, Scenario number and name\"><\/textarea><div class=\"pm\" data-m=\"m3b.t8.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t8.r1.c1\" rows=\"2\" aria-label=\"row 1, My ruling, in one paragraph\"><\/textarea><div class=\"pm\" data-m=\"m3b.t8.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m3b.t8.r1.c2\" rows=\"2\" aria-label=\"row 1, The fact that would change my ruling\"><\/textarea><div class=\"pm\" data-m=\"m3b.t8.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m3b.t8\" data-cols=\"3\">+ Add row<\/button>"]], "deliv": "Module 3 activities", "keys": ["m3b"]}, {"id": "m4a", "group": "Module 4", "nav": "Module 4 activities", "title": "Module 4 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 4 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1 and 2.<\/p><\/aside>\n<h3>Activity 1 — The guided asset sort<\/h3>\n<p>Session A. Work with a partner.<\/p>\n<p>Ridgeline Machine Works is a practice company. It makes metal parts for the Department of Defense (DoD) and receives drawings that are Controlled Unclassified Information (CUI). Ridgeline has a written System Security Plan (SSP), a network diagram, an asset inventory, and written security policies.<\/p>\n<p>For each asset, choose one of the five categories. Then write a one-line reason that uses the test.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4a.t1\"><thead><tr><th scope=\"col\"><strong>Category<\/strong><\/th><th scope=\"col\"><strong>The test<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">CUI Asset<\/th><td>Processes, stores, or transmits CUI<\/td><\/tr><tr><th scope=\"row\">Security Protection Asset<\/th><td>Provides security functions to the assets in scope, whether or not it touches CUI<\/td><\/tr><tr><th scope=\"row\">Contractor Risk Managed Asset<\/th><td>Can handle CUI, but policies, procedures, and practices in place keep CUI off it<\/td><\/tr><tr><th scope=\"row\">Specialized Asset<\/th><td>Can handle CUI but cannot be fully secured. Only five types: IoT and IIoT devices, Operational Technology, Government Furnished Equipment, Restricted Information Systems, Test Equipment<\/td><\/tr><tr><th scope=\"row\">Out-of-Scope Asset<\/th><td>Cannot process, store, or transmit CUI, and gives no security protection to CUI Assets<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table data-tid=\"m4a.t2\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Ridgeline asset<\/strong><\/th><th scope=\"col\"><strong>Category<\/strong><\/th><th scope=\"col\"><strong>One-line reason that uses the test<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">R1<\/th><td>Engineering workstations. Engineers open and edit the CUI drawings on them.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r1.c2\" rows=\"2\" aria-label=\"R1, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r1.c3\" rows=\"2\" aria-label=\"R1, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R2<\/th><td>A computer-controlled cutting machine on the shop floor. It loads part programs made from the CUI drawings. Its control software cannot be updated or run security software. It is listed in the SSP, shown on the network diagram, and managed under a written risk policy.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r2.c2\" rows=\"2\" aria-label=\"R2, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r2.c3\" rows=\"2\" aria-label=\"R2, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R3<\/th><td>A log server. It collects security logs from every system in scope. It holds no CUI.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r3.c2\" rows=\"2\" aria-label=\"R3, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r3.c3\" rows=\"2\" aria-label=\"R3, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R4<\/th><td>Human resources laptops. A written policy keeps CUI off them. Network settings block them from the CUI folders, and Ridgeline checks the settings every month. They are listed in the SSP and on the network diagram.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r4.c2\" rows=\"2\" aria-label=\"R4, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r4.c3\" rows=\"2\" aria-label=\"R4, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r4.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R5<\/th><td>The engineering printer. Engineers print the CUI drawings on it.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r5.c2\" rows=\"2\" aria-label=\"R5, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r5.c3\" rows=\"2\" aria-label=\"R5, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r5.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R6<\/th><td>A smart TV in the break room. It uses a separate guest internet line with no connection to the company network.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r6.c2\" rows=\"2\" aria-label=\"R6, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r6.c3\" rows=\"2\" aria-label=\"R6, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r6.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R7<\/th><td>A cloud file service where Ridgeline keeps a copy of the CUI drawings<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r7.c2\" rows=\"2\" aria-label=\"R7, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r7.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r7.c3\" rows=\"2\" aria-label=\"R7, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r7.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">R8<\/th><td>A backup drive. Every night it receives a full copy of the engineering file server.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r8.c2\" rows=\"2\" aria-label=\"R8, Category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r8.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t2.r8.c3\" rows=\"2\" aria-label=\"R8, One-line reason that uses the test\"><\/textarea><div class=\"pm\" data-m=\"m4a.t2.r8.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m4a.t2\" data-cols=\"4\">+ Add row<\/button>\n<p><strong>Follow-up.<\/strong> Now imagine that Ridgeline had no written policies, no SSP, and no network diagram. Everything else is the same. Which of your answers change? What is the new category, and why?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4a.t3\"><thead><tr><th scope=\"col\"><strong>Asset that changes<\/strong><\/th><th scope=\"col\"><strong>New category<\/strong><\/th><th scope=\"col\"><strong>Why it changes<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m4a.t3.r1.c0\" rows=\"2\" aria-label=\"row 1, Asset that changes\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t3.r1.c1\" rows=\"2\" aria-label=\"row 1, New category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t3.r1.c2\" rows=\"2\" aria-label=\"row 1, Why it changes\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r1.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4a.t3.r2.c0\" rows=\"2\" aria-label=\"row 2, Asset that changes\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t3.r2.c1\" rows=\"2\" aria-label=\"row 2, New category\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t3.r2.c2\" rows=\"2\" aria-label=\"row 2, Why it changes\"><\/textarea><div class=\"pm\" data-m=\"m4a.t3.r2.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m4a.t3\" data-cols=\"3\">+ Add row<\/button>\n<h3>Activity 2 — Outside providers<\/h3>\n<p>Session A. Work with a partner.<\/p>\n<p>For each Ridgeline provider, decide whether it is an External Service Provider (ESP), a Cloud Service Provider (CSP), or neither. Then write what that requires.<\/p>\n<ul><li>An ESP matters when it processes, stores, or transmits CUI, or when it handles Security Protection Data, such as settings, logs, and passwords. It requires a description in the SSP and a Customer Responsibility Matrix, and it is assessed as part of the company&#x27;s assessment.<\/li><li>A CSP is a kind of ESP, and the same rule applies. If it processes, stores, or transmits CUI, it must also meet the FedRAMP Moderate baseline, or a documented equal standard, under DFARS 252.204-7012. If it handles only Security Protection Data, it is assessed as a Security Protection Asset.<\/li><li>If a provider is neither, write what you checked.<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m4a.t4\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Ridgeline provider<\/strong><\/th><th scope=\"col\"><strong>ESP, CSP, or neither<\/strong><\/th><th scope=\"col\"><strong>Reason<\/strong><\/th><th scope=\"col\"><strong>What this requires<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">V1<\/th><td>A cloud email service. Engineers use it to send CUI drawings to the DoD customer.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r1.c2\" rows=\"2\" aria-label=\"V1, ESP, CSP, or neither\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r1.c3\" rows=\"2\" aria-label=\"V1, Reason\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r1.c4\" rows=\"2\" aria-label=\"V1, What this requires\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">V2<\/th><td>An IT support company. Its staff log in remotely to fix the engineering workstations and servers.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r2.c2\" rows=\"2\" aria-label=\"V2, ESP, CSP, or neither\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r2.c3\" rows=\"2\" aria-label=\"V2, Reason\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r2.c4\" rows=\"2\" aria-label=\"V2, What this requires\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">V3<\/th><td>A security company that manages Ridgeline&#x27;s firewall and reviews its logs<\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r3.c2\" rows=\"2\" aria-label=\"V3, ESP, CSP, or neither\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r3.c3\" rows=\"2\" aria-label=\"V3, Reason\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r3.c4\" rows=\"2\" aria-label=\"V3, What this requires\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">V4<\/th><td>A web design firm that hosts Ridgeline&#x27;s public marketing website. The site holds no CUI and has no connection to the company network.<\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r4.c2\" rows=\"2\" aria-label=\"V4, ESP, CSP, or neither\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r4.c3\" rows=\"2\" aria-label=\"V4, Reason\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4a.t4.r4.c4\" rows=\"2\" aria-label=\"V4, What this requires\"><\/textarea><div class=\"pm\" data-m=\"m4a.t4.r4.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m4a.t4\" data-cols=\"5\">+ Add row<\/button>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 4 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 3 and 4.<\/p><\/aside>\n<h3>Activity 3 — ThreadBridge matrix planning sheet<\/h3>\n<p>Session B. Work with a partner. Talk through each row together, but fill in your own sheet.<\/p>\n<p>Use the ThreadBridge environment fact sheet in Session B Part 1 of Module 4.<\/p>\n<p>1. Fill in &quot;What it is&quot;, &quot;Where&quot;, and &quot;What it can reach&quot; for every row first. Do not choose any category yet.<\/p>\n<p>2. Then choose the category and write a one-line reason that uses the test.<\/p>\n<p>3. In the last column, write &quot;yes&quot; if you and your partner disagreed about the row.<\/p>\n<p>Before you choose Contractor Risk Managed Asset or Specialized Asset, ask: what would ThreadBridge show to prove the condition? If the answer is nothing, the category is not available.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4b.t1\"><thead><tr><th scope=\"col\"><strong>Asset<\/strong><\/th><th scope=\"col\"><strong>What it is<\/strong><\/th><th scope=\"col\"><strong>Where<\/strong><\/th><th scope=\"col\"><strong>What it can reach<\/strong><\/th><th scope=\"col\"><strong>Category<\/strong><\/th><th scope=\"col\"><strong>One-line reason<\/strong><\/th><th scope=\"col\"><strong>My partner and I disagreed?<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">SRV-001<\/th><td><textarea class=\"fld \" data-f=\"m4b.t1.r1.c1\" rows=\"2\" aria-label=\"SRV-001, What it is\"><\/textarea><div class=\"pm\" data-m=\"m4b.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t1.r1.c2\" rows=\"2\" aria-label=\"SRV-001, Where\"><\/textarea><div class=\"pm\" data-m=\"m4b.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t1.r1.c3\" rows=\"2\" aria-label=\"SRV-001, What it can reach\"><\/textarea><div class=\"pm\" data-m=\"m4b.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t1.r1.c4\" rows=\"2\" aria-label=\"SRV-001, Category\"><\/textarea><div class=\"pm\" data-m=\"m4b.t1.r1.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t1.r1.c5\" rows=\"2\" aria-label=\"SRV
