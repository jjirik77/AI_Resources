ow<\/button>\n<p>Now list the facts the case does not give you. You need at least two for D2 Part 4.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4b.t3\"><thead><tr><th scope=\"col\"><strong>What I do not know<\/strong><\/th><th scope=\"col\"><strong>Why it could change the scope<\/strong><\/th><th scope=\"col\"><strong>Whom at ThreadBridge I would ask<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m4b.t3.r1.c0\" rows=\"2\" aria-label=\"row 1, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r1.c1\" rows=\"2\" aria-label=\"row 1, Why it could change the scope\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r1.c2\" rows=\"2\" aria-label=\"row 1, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r1.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4b.t3.r2.c0\" rows=\"2\" aria-label=\"row 2, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r2.c1\" rows=\"2\" aria-label=\"row 2, Why it could change the scope\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r2.c2\" rows=\"2\" aria-label=\"row 2, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r2.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4b.t3.r3.c0\" rows=\"2\" aria-label=\"row 3, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r3.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r3.c1\" rows=\"2\" aria-label=\"row 3, Why it could change the scope\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t3.r3.c2\" rows=\"2\" aria-label=\"row 3, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"m4b.t3.r3.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m4b.t3\" data-cols=\"3\">+ Add row<\/button>\n<h3>Activity 4 — Challenge record<\/h3>\n<p>Session B. Work on your own while two pairs present.<\/p>\n<p>Two pairs present their hardest call. Record each challenge. In the outcome column, write the decision and the words from the Scoping Guide or 32 CFR 170.19 that settled it.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4b.t4\"><thead><tr><th scope=\"col\"><strong>Asset<\/strong><\/th><th scope=\"col\"><strong>The presenting pair&#x27;s call<\/strong><\/th><th scope=\"col\"><strong>The challenge<\/strong><\/th><th scope=\"col\"><strong>Outcome, and the text that settled it<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m4b.t4.r1.c0\" rows=\"2\" aria-label=\"row 1, Asset\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r1.c1\" rows=\"2\" aria-label=\"row 1, The presenting pair&amp;#x27;s call\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r1.c2\" rows=\"2\" aria-label=\"row 1, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r1.c3\" rows=\"2\" aria-label=\"row 1, Outcome, and the text that settled it\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r1.c3\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4b.t4.r2.c0\" rows=\"2\" aria-label=\"row 2, Asset\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r2.c1\" rows=\"2\" aria-label=\"row 2, The presenting pair&amp;#x27;s call\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r2.c2\" rows=\"2\" aria-label=\"row 2, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r2.c3\" rows=\"2\" aria-label=\"row 2, Outcome, and the text that settled it\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r2.c3\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4b.t4.r3.c0\" rows=\"2\" aria-label=\"row 3, Asset\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r3.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r3.c1\" rows=\"2\" aria-label=\"row 3, The presenting pair&amp;#x27;s call\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r3.c2\" rows=\"2\" aria-label=\"row 3, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r3.c3\" rows=\"2\" aria-label=\"row 3, Outcome, and the text that settled it\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r3.c3\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m4b.t4.r4.c0\" rows=\"2\" aria-label=\"row 4, Asset\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r4.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r4.c1\" rows=\"2\" aria-label=\"row 4, The presenting pair&amp;#x27;s call\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r4.c2\" rows=\"2\" aria-label=\"row 4, The challenge\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m4b.t4.r4.c3\" rows=\"2\" aria-label=\"row 4, Outcome, and the text that settled it\"><\/textarea><div class=\"pm\" data-m=\"m4b.t4.r4.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m4b.t4\" data-cols=\"4\">+ Add row<\/button>\n<p>After the round, write one call you will change in your own work, or one call you will now defend more strongly. Say why.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m4b.t5\"><thead><tr><th scope=\"col\"><strong>The call, and why I will change it or defend it<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m4b.t5.r1.c0\" rows=\"2\" aria-label=\"row 1, The call, and why I will change it or defend it\"><\/textarea><div class=\"pm\" data-m=\"m4b.t5.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>"], ["Handling CUI in practice", "<p class=\"docmeta\">Part of the Module 4 Online Work. About 1 hour, including the ThreadBridge table at the end.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this handout<\/p><p>Read the four sections in order: marking, storing and sharing, sending, and destroying. Then read the ThreadBridge section and fill in the table at the end. Type into the empty cells.<\/p><p>This handout is practice and is not graded. It helps you see where ThreadBridge&#x27;s CUI sits, which you need for D2.<\/p><\/aside>\n<h3>Why handling matters<\/h3>\n<p>Controlled Unclassified Information (CUI) is information the Government creates or owns, or that a company creates or holds for the Government, that a law, regulation, or Government-wide policy says must or may be protected with special controls. You learned to identify CUI in Module 2. In Module 4 you learned that every asset that processes, stores, or transmits CUI is in scope.<\/p>\n<p>This handout answers a practical question: what do people at a company actually do with CUI each day? There are four steps in the life of a CUI document. It is marked, stored and shared, sent, and finally destroyed. Each step has rules. A mistake at any step can put CUI on a system that is not protected.<\/p>\n<h3>Step 1 — Marking<\/h3>\n<p>A marking is a label on a document or device that tells the reader it holds CUI. The rules for marking are in 32 CFR Part 2002, the federal CUI rule, at section 2002.20. The National Archives (NARA) runs the CUI program and explains the rules in its CUI Marking Handbook.<\/p>\n<h4>The banner marking<\/h4>\n<p>The banner marking is the main CUI marking. It appears at the top of each page of any document that contains CUI. It is required. The banner must be the same on every page, and it must cover all the CUI in the whole document. The banner always starts with &quot;CUI&quot; or &quot;CONTROLLED&quot;. It can also list the category of CUI and any limits on who may receive it.<\/p>\n<h4>The CUI Registry<\/h4>\n<p>The CUI Registry is NARA&#x27;s official online list of CUI categories and their markings. Only the markings listed in the Registry are allowed. When you want to know what a category marking means, or how to write one, the Registry is the place to check.<\/p>\n<h4>Portion markings<\/h4>\n<p>A portion is a part of a document, such as a paragraph, a table, or a picture. A portion marking is a short label in front of one portion that says whether it holds CUI. Portion marking is permitted and encouraged, but it is not required. If a document uses portion markings, every portion must be marked, including the portions that hold no CUI.<\/p>\n<h4>The designation indicator<\/h4>\n<p>The designation indicator shows who decided that the information is CUI. Every document that contains CUI must have one. It may appear only on the first page or the cover. It can be a &quot;Controlled by&quot; line, the agency&#x27;s letterhead, or a signature block that names the agency.<\/p>\n<h4>Marking devices<\/h4>\n<p>CUI also lives on devices, such as USB drives and hard drives. Requirement 3.8.4 in NIST SP 800-171 says to mark media with the CUI markings and distribution limits it needs. NARA says that, at a minimum, a device should show &quot;CUI&quot; or &quot;CONTROLLED&quot; and the agency that designated the CUI.<\/p>\n<p>At a contractor, most CUI arrives already marked by the Government. The company&#x27;s job is to keep the markings in place, and to mark copies and new documents made from CUI. If you find information that seems to be CUI but has no marking, do not guess. Ask the person who sent it, or the contracting officer.<\/p>\n<h3>Step 2 — Storing and sharing<\/h3>\n<h4>Keep CUI on in-scope systems only<\/h4>\n<p>CUI may be stored only on systems that are in scope and protected. If someone copies a CUI file to a laptop, a phone, or a cloud folder outside the scope, that device or service is now holding CUI. It then belongs in scope, or the CUI must be removed from it.<\/p>\n<h4>A separate enclave<\/h4>\n<p>An enclave is a separate, protected part of a company&#x27;s network that holds the CUI and the people and systems that need it. Other devices cannot reach it. An enclave is one way to make scope smaller, by a real change, as you learned in Module 4. The assets outside the enclave cannot reach CUI, so they may fall out of scope. This works only if the separation is real and can be shown. A plan or a label does not create an enclave.<\/p>\n<h4>Cloud services<\/h4>\n<p>Many companies keep files and email in a commercial cloud service. Commercial means a plan sold to any business, not one built for Government work.<\/p>\n<p>DFARS 252.204-7012 sets a rule for the cloud. In paragraph (b)(2)(ii)(D), it says that if a contractor uses an outside cloud service to store, process, or transmit covered defense information, the contractor must make sure the service meets security requirements equal to the FedRAMP Moderate baseline. FedRAMP is the federal program that checks the security of cloud services. The cloud service must also follow the clause&#x27;s rules on incident reporting, malicious software, keeping images of affected systems, and giving DoD access for review.<\/p>\n<p>What does &quot;equal to FedRAMP Moderate&quot; mean? In a memo dated December 21, 2023, the DoD Chief Information Officer explained it. A service that is not FedRAMP authorized must meet 100 percent of the FedRAMP Moderate baseline. A third-party assessment organization recognized by FedRAMP must check it. The provider&#x27;s own claim is not enough.<\/p>\n<p>A standard commercial plan does not meet this rule just because the provider is large or well known. The company must check the evidence for the exact service it uses.<\/p>\n<h4>What GCC High is<\/h4>\n<p>You will hear the name GCC High at many defense suppliers. GCC High is a separate Microsoft 365 environment for the DoD and for contractors that hold DoD CUI or export-controlled data. Microsoft says it is assessed against NIST SP 800-53 controls at the High level. A company must pass an eligibility check before it can buy it.<\/p>\n<p>This course does not recommend any product. Other providers also offer services for CUI. Using any one service does not make a company compliant by itself. The company still has its own share of the requirements, which the Customer Responsibility Matrix spells out, and it must keep the evidence.<\/p>\n<h3>Step 3 — Sending<\/h3>\n<h4>Encrypt CUI when you send it<\/h4>\n<p>Encryption scrambles data so that only someone with the right key can read it. Requirement 3.13.8 in NIST SP 800-171 says to use encryption to prevent CUI from being disclosed while it is sent, unless other physical safeguards protect it. This covers email, file transfers, and remote connections such as a virtual private network (VPN).<\/p>\n<h4>Never send CUI to a personal account<\/h4>\n<p>Do not send CUI to a personal email account, and do not upload it to a personal cloud folder. A personal account is outside the company&#x27;s scope. No one at the company controls it, and no one checks it. The same is true for a printer or scanner that can send a scan to any email address. One scan to the wrong address puts CUI outside the scope.<\/p>\n<h4>Paper and packages<\/h4>\n<p>The CUI rule allows the U.S. Postal Service or a commercial delivery service. Use tracking. Address the package to a specific person. Do not mark the outside of the package to show it contains CUI.<\/p>\n<h3>Step 4 — Destroying<\/h3>\n<p>Requirement 3.8.3 in NIST SP 800-171 says: &quot;Sanitize or destroy system media containing CUI before disposal or release for reuse.&quot; Media means anything that holds data: hard drives, USB drives, phones, printer storage, and paper. The CUI rule says CUI must be destroyed so that it is unreadable, indecipherable, and irrecoverable.<\/p>\n<p>NIST SP 800-88, Guidelines for Media Sanitization, explains how. Revision 2 was published in September 2025. It describes three methods.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"cui_ha.t1\"><thead><tr><th scope=\"col\"><strong>Method<\/strong><\/th><th scope=\"col\"><strong>What it does<\/strong><\/th><th scope=\"col\"><strong>Example<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Clear<\/th><td>Removes data by using the device&#x27;s normal controls, so simple tools cannot recover it<\/td><td>Resetting a device so ordinary software cannot read the old data<\/td><\/tr><tr><th scope=\"row\">Purge<\/th><td>Makes recovery not possible even with laboratory methods. The device can still be used.<\/td><td>A special erase command built into a drive<\/td><\/tr><tr><th scope=\"row\">Destroy<\/th><td>Makes recovery not possible even with laboratory methods. The device can no longer store data.<\/td><td>Shredding a drive or shredding paper<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Paper copies of CUI must be destroyed. Clear and purge do not apply to paper. Before an old computer, printer, or drive leaves the company, someone must sanitize it and keep a record.<\/p>\n<h3>ThreadBridge: where its CUI sits today<\/h3>\n<p>You are still on ThreadBridge&#x27;s compliance team. The facts below come only from the Module 4 fact sheet and the D1 attachment. Use them to see where ThreadBridge&#x27;s CUI sits today. Do not write fixes. As in D2, describe what is true now.<\/p>\n<ul><li><strong>The file server (SRV-002)<\/strong> holds the CUI folder. The uniform technical specifications are in /CUI/Contracts/DLA/Specs. The export-controlled fabric data is in /CUI/Materials/EAR. The company also classifies employee clearance submissions as CUI. They are in /HR/Clearances.<\/li><li><strong>The ERP server (SRV-001)<\/strong> holds delivery destination data. Staff also export it to the file server for the shipping team.<\/li><li><strong>Microsoft 365 (CLO-001)<\/strong> holds CUI in email and SharePoint folders. The specifications are copied to a SharePoint folder. The account is a commercial Business Premium plan. The company&#x27;s own provider list marks Microsoft &quot;FedRAMP Moderate&quot;. Treat that mark as a claim to check.<\/li><li><strong>The backup device (SRV-004)<\/strong> receives nightly backups of the servers, so it holds copies of CUI. No copy is kept off site.<\/li><li><strong>Sending.<\/strong> The fabric data is &quot;sent by encrypted email.&quot; The three printers can scan to any email address. The VPN carries CUI and has no multi-factor authentication.<\/li><li><strong>The network<\/strong> is flat. Every device is on one VLAN, so there is no enclave today.<\/li><li><strong>Destroying.<\/strong> The case says nothing about how ThreadBridge disposes of old drives or paper. It does record one lost laptop (INC-002), which shows that devices can leave the company&#x27;s control.<\/li><li><strong>Marking.<\/strong> Some folders have &quot;CUI&quot; in their names. A folder name is not a marking. The new solicitation says portions of the Technical Data Package will bear Distribution Statement D, so marked documents will arrive after award.<\/li><\/ul>\n<h3>Your turn: the ThreadBridge handling table<\/h3>\n<p>For each step, write what the rule asks, in your own words. Then write what the ThreadBridge case shows today, and what the case does not tell you. Use only facts from this handout, the Module 4 fact sheet, and the D1 attachment.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"cui_ha.t2\"><thead><tr><th scope=\"col\"><strong>Step<\/strong><\/th><th scope=\"col\"><strong>What the rule asks<\/strong><\/th><th scope=\"col\"><strong>What the ThreadBridge case shows today<\/strong><\/th><th scope=\"col\"><strong>What the case does not tell you<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Mark<\/th><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r1.c1\" rows=\"2\" aria-label=\"Mark, What the rule asks\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r1.c2\" rows=\"2\" aria-label=\"Mark, What the ThreadBridge case shows today\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r1.c3\" rows=\"2\" aria-label=\"Mark, What the case does not tell you\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Store and share<\/th><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r2.c1\" rows=\"2\" aria-label=\"Store and share, What the rule asks\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r2.c2\" rows=\"2\" aria-label=\"Store and share, What the ThreadBridge case shows today\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r2.c3\" rows=\"2\" aria-label=\"Store and share, What the case does not tell you\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Send<\/th><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r3.c1\" rows=\"2\" aria-label=\"Send, What the rule asks\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r3.c2\" rows=\"2\" aria-label=\"Send, What the ThreadBridge case shows today\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r3.c3\" rows=\"2\" aria-label=\"Send, What the case does not tell you\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Destroy<\/th><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r4.c1\" rows=\"2\" aria-label=\"Destroy, What the rule asks\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r4.c2\" rows=\"2\" aria-label=\"Destroy, What the ThreadBridge case shows today\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"cui_ha.t2.r4.c3\" rows=\"2\" aria-label=\"Destroy, What the case does not tell you\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t2.r4.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"cui_ha.t2\" data-cols=\"4\">+ Add row<\/button>\n<p>Last question: which step worries you most for ThreadBridge, and why? Answer in two or three sentences.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"cui_ha.t3\"><thead><tr><th scope=\"col\"><strong>The step, and why<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"cui_ha.t3.r1.c0\" rows=\"2\" aria-label=\"row 1, The step, and why\"><\/textarea><div class=\"pm\" data-m=\"cui_ha.t3.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Sources<\/h3>\n<div class=\"tbl-wrap\"><table data-tid=\"cui_ha.t4\"><thead><tr><th scope=\"col\"><strong>Source<\/strong><\/th><th scope=\"col\"><strong>Link<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">32 CFR 2002.20, CUI marking<\/th><td><a href=\"https://www.ecfr.gov/current/title-32/subtitle-B/chapter-XX/part-2002/subpart-B/section-2002.20\" target=\"_blank\" rel=\"noopener\">https://www.ecfr.gov/current/title-32/subtitle-B/chapter-XX/part-2002/subpart-B/section-2002.20<\/a><\/td><\/tr><tr><th scope=\"row\">32 CFR 2002.14, safeguarding and destroying CUI<\/th><td><a href=\"https://www.ecfr.gov/current/title-32/subtitle-B/chapter-XX/part-2002/subpart-B/section-2002.14\" target=\"_blank\" rel=\"noopener\">https://www.ecfr.gov/current/title-32/subtitle-B/chapter-XX/part-2002/subpart-B/section-2002.14<\/a><\/td><\/tr><tr><th scope=\"row\">NARA CUI Marking Handbook<\/th><td><a href=\"https://www.archives.gov/files/cui/20161206-cui-marking-handbook-v1-1.pdf\" target=\"_blank\" rel=\"noopener\">https://www.archives.gov/files/cui/20161206-cui-marking-handbook-v1-1.pdf<\/a><\/td><\/tr><tr><th scope=\"row\">NARA CUI Registry, categories and markings<\/th><td><a href=\"https://www.archives.gov/cui/registry/category-marking-list\" target=\"_blank\" rel=\"noopener\">https://www.archives.gov/cui/registry/category-marking-list<\/a><\/td><\/tr><tr><th scope=\"row\">DFARS 252.204-7012<\/th><td><a href=\"https://www.ecfr.gov/current/title-48/chapter-2/subchapter-H/part-252/subpart-252.2/section-252.204-7012\" target=\"_blank\" rel=\"noopener\">https://www.ecfr.gov/current/title-48/chapter-2/subchapter-H/part-252/subpart-252.2/section-252.204-7012<\/a><\/td><\/tr><tr><th scope=\"row\">DoD CIO memo, FedRAMP Moderate Equivalency, December 21, 2023<\/th><td><a href=\"https://dodcio.defense.gov/Portals/0/Documents/Library/FEDRAMP-EquivalencyCloudServiceProviders.pdf\" target=\"_blank\" rel=\"noopener\">https://dodcio.defense.gov/Portals/0/Documents/Library/FEDRAMP-EquivalencyCloudServiceProviders.pdf<\/a><\/td><\/tr><tr><th scope=\"row\">Microsoft, Office 365 GCC High and DoD service description<\/th><td><a href=\"https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-platform-service-description/office-365-us-government/gcc-high-and-dod\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-platform-service-description/office-365-us-government/gcc-high-and-dod<\/a><\/td><\/tr><tr><th scope=\"row\">NIST SP 800-171 Rev 2 (requirements 3.8.3, 3.8.4, 3.13.8)<\/th><td><a href=\"https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final\" target=\"_blank\" rel=\"noopener\">https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final<\/a><\/td><\/tr><tr><th scope=\"row\">NIST SP 800-88 Rev. 2, Guidelines for Media Sanitization<\/th><td><a href=\"https://csrc.nist.gov/pubs/sp/800/88/r2/final\" target=\"_blank\" rel=\"noopener\">https://csrc.nist.gov/pubs/sp/800/88/r2/final<\/a><\/td><\/tr><\/tbody><\/table><\/div>"]], "deliv": "Module 4 activities", "keys": ["m4b"]}, {"id": "d2", "group": "Module 4", "nav": "D2 Scope Package", "title": "D2 — Scope Package: ThreadBridge Solutions", "meta": "Individual. Canvas quiz, 40 points, one attempt. Due at the end of Week 4", "tabs": [["Brief", "<h3>D2 has two parts<\/h3>\n<p>D2 is worth 100 points in total. It has two parts, and each one is a separate item in Canvas.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t1\"><thead><tr><th scope=\"col\"><strong>Part<\/strong><\/th><th scope=\"col\"><strong>What you do<\/strong><\/th><th scope=\"col\"><strong>How it is scored<\/strong><\/th><th scope=\"col\"><strong>Points<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">D2 Answer Sheet<\/th><td>Enter your category for 12 ThreadBridge assets and 5 outside providers, and answer two questions about conditions and the boundary<\/td><td>Canvas scores it. Correct answers appear after the due date.<\/td><td>40<\/td><\/tr><tr><th scope=\"row\">D2 Scope Package<\/th><td>Upload your matrix with a reason for every row, the CUI boundary, the two hardest calls, and the unknowns<\/td><td>Your instructor scores it with the rubric below<\/td><td>60<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Finish your matrix in the D2 template first. Then open the D2 Answer Sheet in Canvas and enter your choices. You have one attempt, so check your matrix before you start.<\/p>\n<p>Three assets are not on the answer sheet, because more than one answer can be defended: the domain controller (SRV-003), the VPN (VPN-001), and QuickBooks (CLO-002). Decide them in your matrix and argue them with the test. They count in the Scope Package.<\/p>\n<p><em>Individual. Asset matrix plus a one-page narrative, uploaded as a Word file, 60 points. Due at the end of Week 4<\/em><\/p>\n<h3>The task<\/h3>\n<p>ThreadBridge&#x27;s leaders need to know what their CMMC Level 2 assessment will cover before they plan any work. As a member of the compliance team, you prepare the scope package. Use the D2 template, D2_scope_package.docx, the environment fact sheet in Session B, and your work from both sessions. You start D2 in Session B and write most of it outside class.<\/p>\n<h3>What to include<\/h3>\n<p>1. <strong>The asset matrix.<\/strong> List every ThreadBridge asset and outside provider. For each one, give what it is, where it is, what it can reach, its category, and a one-line reason that uses the test. Include the three assets that are not on the answer sheet.<\/p>\n<p>2. <strong>The CUI boundary.<\/strong> In words, describe what is inside the scope and what is outside it, and what places each asset there. If almost nothing is outside, say so and explain why.<\/p>\n<p>3. <strong>The two hardest calls.<\/strong> Explain the two assets you found hardest to categorize. Say which category you chose, which other category you considered, and why that other category does not fit.<\/p>\n<p>4. <strong>Unknowns.<\/strong> List the facts the case does not give you that could change the scope. For each one, say why it matters and whom at ThreadBridge you would ask.<\/p>\n<h3>Requirements<\/h3>\n<ul><li>This is individual work. Submit your own D2. You may talk about the case with a partner in class, but the matrix and the narrative must be your own work, in your own words.<\/li><li>The matrix is a table. Parts 2 to 4 together are about one page.<\/li><li>Every category has its own reason. A category with no reason is not complete.<\/li><li>Cite the CMMC Assessment Scope, Level 2 guide or 32 CFR 170.19 for any conditional or contested call.<\/li><li>Where a category is not available to ThreadBridge because a condition is not met, say so and name the condition.<\/li><li>Describe the scope as it is today. Do not write fixes. Fixing gaps is the subject of Module 8.<\/li><li>The categories in your matrix should match what you entered on the answer sheet. If you change your mind after the answer sheet, explain the change in your matrix.<\/li><li>Submit as a Word file through Canvas. You may also use the D2 template in the course lab, cmmc_lab.html.<\/li><\/ul>\n<h3>Rubric<\/h3>\n<p>The D2 Scope Package is worth 60 points. Each criterion is worth 20 points. Exceeds earns 20 points, Mastery 18, Near 15, Below 11, and No Evidence 0. Work not submitted earns zero.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t2\"><thead><tr><th scope=\"col\"><strong>Criterion<\/strong><\/th><th scope=\"col\"><strong>No Evidence<\/strong><\/th><th scope=\"col\"><strong>Below<\/strong><\/th><th scope=\"col\"><strong>Near<\/strong><\/th><th scope=\"col\"><strong>Mastery<\/strong><\/th><th scope=\"col\"><strong>Exceeds<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Matrix and reasons (20 points)<\/th><td>No matrix, or no reasons given<\/td><td>Many assets or providers are missing, or most reasons say what the asset is used for instead of using the test<\/td><td>Every asset is listed, but some rows leave &quot;what it can reach&quot; blank, some reasons only restate the asset, or one of the three arguable assets is not argued<\/td><td>Every asset and provider is listed with what it is, where it is, and what it can reach, and every row has a one-line reason that uses the test, including SRV-003, VPN-001, and CLO-002<\/td><td>Also lists assets the case only implies, such as the security cameras or the remote laptops, and names the condition ThreadBridge does not meet for each category it rejects<\/td><\/tr><tr><th scope=\"row\">Boundary (20 points)<\/th><td>No boundary is stated<\/td><td>A boundary is stated but not explained, or it does not match the matrix<\/td><td>States the boundary with some reasons, but one part is not explained or does not match the matrix<\/td><td>States what is inside and outside, with reasons, and matches the matrix<\/td><td>Explains why the boundary is as wide as it is, so a reader who wanted it smaller could not move it<\/td><\/tr><tr><th scope=\"row\">Hard calls and unknowns (20 points)<\/th><td>No hard calls and no unknowns<\/td><td>Names hard calls but argues from how the asset is used, or lists no unknowns<\/td><td>Explains two hard calls against the test, but for one does not say why the other category fails; or lists unknowns without whom to ask<\/td><td>Explains two hard calls against the test and why the other category fails; lists unknowns with why each matters and whom to ask<\/td><td>Also names the fact that would change each call, and says how each unknown could change the scope<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Check yourself before you submit<\/h3>\n<p>Use this list. Each line matches a rubric criterion at the Mastery level.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t3\"><thead><tr><th scope=\"col\"><strong>Criterion<\/strong><\/th><th scope=\"col\"><strong>Question to ask yourself<\/strong><\/th><th scope=\"col\"><strong>Yes or no<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Matrix and reasons<\/th><td>Does every row say what the asset can reach, not only what it is used for?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Matrix and reasons<\/th><td>Does every reason name the test it uses, such as &quot;processes CUI&quot; or &quot;provides a security function&quot;?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Matrix and reasons<\/th><td>Did I argue SRV-003, VPN-001, and CLO-002?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Boundary<\/th><td>Does my boundary match my matrix, asset by asset?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Boundary<\/th><td>Did I say why the boundary is as wide as it is?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Hard calls and unknowns<\/th><td>For each hard call, did I say why the other category does not fit?<\/td><td><\/td><\/tr><tr><th scope=\"row\">Hard calls and unknowns<\/th><td>Does each unknown say why it matters and whom at ThreadBridge I would ask?<\/td><td><\/td><\/tr><tr><th scope=\"row\">All<\/th><td>Did I leave out every fix?<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>"], ["Your work", "<p class=\"docmeta\">Individual work. Complete it and submit it as a Word file through Canvas. Due at the end of Week 4.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this template<\/p><p>D2 has four parts. Complete them in order. The boundary in Part 2 must follow from the matrix in Part 1.<\/p><p>The rows below list the assets and providers named in the ThreadBridge case. They are a starting point, not a complete list. Add a row for every asset you find that is not listed.<\/p><p>Type into the empty cells. Every category needs a one-line reason that uses the test. The reference card at the end gives the five tests.<\/p><p>Parts 2 to 4 together should be about one page.<\/p><p>D2 is your own work. You may talk about the case with a partner in class, but write every part yourself.<\/p><\/aside>\n<h3>Your name<\/h3>\n<div class=\"tbl-wrap\"><table data-tid=\"d2.t1\"><thead><tr><th scope=\"col\"><strong>Name<\/strong><\/th><th scope=\"col\"><strong>Date submitted<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d2.t1.r1.c0\" rows=\"2\" aria-label=\"row 1, Name\"><\/textarea><div class=\"pm\" data-m=\"d2.t1.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t1.r1.c1\" rows=\"2\" aria-label=\"row 1, Date submitted\"><\/textarea><div class=\"pm\" data-m=\"d2.t1.r1.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d2.t1\" data-cols=\"2\">+ Add row<\/button>\n<h3>Part 1 — The asset matrix<\/h3>\n<p>When your matrix is finished, enter your categories in the D2 Answer Sheet in Canvas (40 points, one attempt). Then upload this file as the D2 Scope Package (60 points).<\/p>\n<p>One row per asset. Fill in &quot;What it can reach&quot; before you choose th ria-label=\"row 1, What fact would change my call\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r1.c4\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"d2.t10.r2.c0\" rows=\"2\" aria-label=\"row 2, Asset\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t10.r2.c1\" rows=\"2\" aria-label=\"row 2, My category\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t10.r2.c2\" rows=\"2\" aria-label=\"row 2, The other category I considered\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t10.r2.c3\" rows=\"2\" aria-label=\"row 2, Why the other category does not fit\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t10.r2.c4\" rows=\"2\" aria-label=\"row 2, What fact would change my call\"><\/textarea><div class=\"pm\" data-m=\"d2.t10.r2.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d2.t10\" data-cols=\"5\">+ Add row<\/button>\n<h3>Part 4 — Unknowns to ask ThreadBridge about<\/h3>\n<p>List the facts the case does not give you that could change the scope. List at least two.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d2.t11\"><thead><tr><th scope=\"col\"><strong>What I do not know<\/strong><\/th><th scope=\"col\"><strong>How the answer could change the scope<\/strong><\/th><th scope=\"col\"><strong>Whom at ThreadBridge I would ask<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d2.t11.r1.c0\" rows=\"2\" aria-label=\"row 1, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r1.c1\" rows=\"2\" aria-label=\"row 1, How the answer could change the scope\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r1.c2\" rows=\"2\" aria-label=\"row 1, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r1.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"d2.t11.r2.c0\" rows=\"2\" aria-label=\"row 2, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r2.c1\" rows=\"2\" aria-label=\"row 2, How the answer could change the scope\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r2.c2\" rows=\"2\" aria-label=\"row 2, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r2.c2\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"d2.t11.r3.c0\" rows=\"2\" aria-label=\"row 3, What I do not know\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r3.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r3.c1\" rows=\"2\" aria-label=\"row 3, How the answer could change the scope\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d2.t11.r3.c2\" rows=\"2\" aria-label=\"row 3, Whom at ThreadBridge I would ask\"><\/textarea><div class=\"pm\" data-m=\"d2.t11.r3.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d2.t11\" data-cols=\"3\">+ Add row<\/button>\n<h3>Reference card — the five categories<\/h3>\n<p>From 32 CFR 170.19 and the CMMC Assessment Scope, Level 2 guide. Use the test, not what the asset is used for.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d2.t12\"><thead><tr><th scope=\"col\"><strong>Category<\/strong><\/th><th scope=\"col\"><strong>The test<\/strong><\/th><th scope=\"col\"><strong>What the company must do<\/strong><\/th><th scope=\"col\"><strong>How it is assessed<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">CUI Asset<\/th><td>Processes, stores, or transmits CUI<\/td><td>List it in the asset inventory and the System Security Plan (SSP)<\/td><td>Against all Level 2 requirements<\/td><\/tr><tr><th scope=\"row\">Security Protection Asset<\/th><td>Provides security functions to the assets in scope, whether or not it touches CUI<\/td><td>Inventory, SSP, and network diagram<\/td><td>Against the requirements for the security function it provides<\/td><\/tr><tr><th scope=\"row\">Contractor Risk Managed Asset<\/th><td>Can, but is not meant to, process, store, or transmit CUI, because security policies, procedures, and practices are in place<\/td><td>Inventory, SSP, and network diagram<\/td><td>Mainly by SSP review; more checks if the documents raise a concern<\/td><\/tr><tr><th scope=\"row\">Specialized Asset<\/th><td>Can process, store, or transmit CUI but cannot be fully secured. Only five types: IoT and IIoT devices, Operational Technology, Government Furnished Equipment, Restricted Information Systems, Test Equipment<\/td><td>Inventory, SSP, network diagram, and proof of management through risk-based security policies<\/td><td>By SSP review only<\/td><\/tr><tr><th scope=\"row\">Out-of-Scope Asset<\/th><td>Cannot process, store, or transmit CUI, and gives no security protection to CUI Assets<\/td><td>Be ready to explain why it cannot handle CUI<\/td><td>Not assessed<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Two categories have conditions. Before you place an asset in the Contractor Risk Managed or Specialized category, ask what ThreadBridge would show to prove the condition. If the answer is nothing, the category is not available, and the asset is sorted by what it can do.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d2.t13\"><thead><tr><th scope=\"col\"><strong>Provider<\/strong><\/th><th scope=\"col\"><strong>When the rule applies<\/strong><\/th><th scope=\"col\"><strong>What is required<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">External Service Provider (ESP), not cloud<\/th><td>It processes, stores, or transmits CUI, or handles Security Protection Data such as settings, logs, and passwords<\/td><td>Described in the SSP, with a Customer Responsibility Matrix. Assessed as part of the company&#x27;s assessment.<\/td><\/tr><tr><th scope=\"row\">Cloud Service Provider (CSP), a kind of ESP<\/th><td>It processes, stores, or transmits CUI, or handles Security Protection Data<\/td><td>Described in the SSP, with a Customer Responsibility Matrix. If it handles CUI: FedRAMP Moderate, or a documented equal standard, under DFARS 252.204-7012. If it handles only Security Protection Data: assessed as a Security Protection Asset.<\/td><\/tr><tr><th scope=\"row\">Neither<\/th><td>It touches neither CUI nor Security Protection Data<\/td><td>Say what you checked before you conclude this<\/td><\/tr><\/tbody><\/table><\/div>"]], "deliv": "D2", "keys": []}, {"id": "m5a", "group": "Module 5", "nav": "Module 5 activities", "title": "Module 5 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 5 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1, 2 and 3.<\/p><p>The five ThreadBridge artifacts come first. Read Artifacts 1 to 3 before Session A. You use all five during the week.<\/p><p>The Technical Evidence Lab is a separate handout, technical_evidence_lab.docx.<\/p><\/aside>\n<h3>The five ThreadBridge artifacts<\/h3>\n<p>An artifact is a specific piece of evidence a company supplies. Each one below is shown as Dennis Park, ThreadBridge&#x27;s IT Manager, supplied it, with where it came from. Nothing has been changed to make it look better or worse.<\/p>\n<h4>Artifact 1 — Policy excerpt<\/h4>\n<p>Supplied by Dennis Park as a PDF. The file properties show it was created on March 14, 2021, and last changed on March 14, 2021.<\/p>\n<pre class=\"scenario\">THREADBRIDGE SOLUTIONS, LLC - INFORMATION SECURITY POLICY\nSection 4: Access Control\n4.1  Access to Company information systems shall be granted on the basis\n     of business need-to-know and shall be limited to the minimum access\n     necessary for an employee to perform their assigned duties.\n4.2  User accounts shall be created upon hire and disabled upon separation.\n4.3  Administrative privileges shall be restricted to authorized IT personnel.\n4.4  Access rights shall be reviewed periodically by the IT Manager.\nApproved:  M. Holloway, CEO          Date: March 14, 2021<\/pre>\n<h4>Artifact 2 — Settings screenshot<\/h4>\n<p>Supplied by Dennis Park as a screenshot taken during a walkthrough. The tenant name shown matches ThreadBridge&#x27;s Microsoft 365 account. It was taken four days before it was supplied.<\/p>\n<pre class=\"scenario\">Microsoft 365 admin center - Conditional Access\nPolicy name:   Require MFA for all users\nState:         On\nAssignments\n  Users:       All users  (82)\n  Cloud apps:  All cloud apps\n  Conditions:  Any location\nAccess controls\n  Grant:       Require multifactor authentication\nModified:      11 months ago<\/pre>\n<h4>Artifact 3 — Email<\/h4>\n<p>Supplied by Dennis Park by email, in reply to a request for records of audit log reviews.<\/p>\n<pre class=\"scenario\">From:    Dennis Park\nTo:      Compliance Team\nSubject: RE: Evidence request - audit logging\n \nLogging is turned on everywhere - Windows event logs on all the\nservers and the Sophos firewall logs everything. I check them regularly\nand we have not seen anything unusual. If something looked wrong I would\nknow about it. I have been doing this here for nine years.\n \nLet me know if you need anything else.\nDennis<\/pre>\n<h4>Artifact 4 — Third-party report<\/h4>\n<p>Supplied by Dennis Park as a one-page PDF. He says this is everything he received. The full report was never delivered. Cascade Networks, which wrote it, also manages ThreadBridge&#x27;s firewall.<\/p>\n<pre class=\"scenario\">CASCADE NETWORKS - SECURITY ASSESSMENT SUMMARY\nClient:   ThreadBridge Solutions, LLC\nDate:     June 2025\nScope:    External and internal vulnerability scan\n \nFINDINGS BY SEVERITY\n  Critical ......  3\n  High ..........  11\n  Medium ........  27\n  Low ...........  44\n \nOverall risk rating: ELEVATED\nA detailed findings register is available on request.\nThis summary is provided for management information purposes.<\/pre>\n<h4>Artifact 5 — Asset list<\/h4>\n<p>Supplied by Dennis Park as a spreadsheet. Asked how he made it, he said he &quot;went round and wrote down what we have.&quot; The file has no date.<\/p>\n<pre class=\"scenario\">ThreadBridge asset list\nItem                      Qty   Notes\nLaptops / desktops         41   Windows 10 and 11\nService accounts            3   for backups and the ERP\n(end of file)<\/pre>\n<h3>Activity 1 — Scoping warm-up<\/h3>\n<p>Session A. Work with a partner for 7 minutes.<\/p>\n<p>Use the five scoping categories from Module 4: CUI Assets, Security Protection Assets, Contractor Risk Managed Assets, Specialized Assets, and Out-of-Scope Assets. Place each ThreadBridge asset below in one category. Give a one-line reason that uses the test for that category.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5a.t1\"><thead><tr><th scope=\"col\"><strong>Asset<\/strong><\/th><th scope=\"col\"><strong>What the case says about it<\/strong><\/th><th scope=\"col\"><strong>Category<\/strong><\/th><th scope=\"col\"><strong>One-line reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">SRV-004, backup NAS (Synology)<\/th><td>The Veeam backup target for the servers, in the Cumberland server room. No offsite copy.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r1.c2\" rows=\"2\" aria-label=\"SRV-004, backup NAS (Synology), Category\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r1.c3\" rows=\"2\" aria-label=\"SRV-004, backup NAS (Synology), One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">NET-001, Sophos XG 310 firewall<\/th><td>Perimeter firewall, VPN gateway, and intrusion detection and prevention, in the Cumberland server room<\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r2.c2\" rows=\"2\" aria-label=\"NET-001, Sophos XG 310 firewall, Category\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r2.c3\" rows=\"2\" aria-label=\"NET-001, Sophos XG 310 firewall, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">PRN-001 to PRN-003, Ricoh printers (3)<\/th><td>Print, scan to email, and copy. Two at Cumberland, one at Frostburg. They can scan to any email address.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r3.c2\" rows=\"2\" aria-label=\"PRN-001 to PRN-003, Ricoh printers (3), Category\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t1.r3.c3\" rows=\"2\" aria-label=\"PRN-001 to PRN-003, Ricoh printers (3), One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m5a.t1.r3.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5a.t1\" data-cols=\"4\">+ Add row<\/button>\n<p>Now look ahead. If an asset is in scope, its evidence must be in scope too. Which of these three assets would need evidence for the MFA requirement, 3.5.3?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5a.t2\"><thead><tr><th scope=\"col\"><strong>Which assets need MFA evidence, and why?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m5a.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, Which assets need MFA evidence, and why?\"><\/textarea><div class=\"pm\" data-m=\"m5a.t2.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 2 — Objectives for MFA<\/h3>\n<p>Session A. Work with a partner for 8 minutes.<\/p>\n<p>Requirement IA.L2-3.5.3 says: use multifactor authentication for local and network access to privileged accounts and for network access to non-privileged accounts. Multifactor authentication (MFA) means a second proof of identity, such as a code on a phone, in addition to a password. A privileged account is an account with administrator rights.<\/p>\n<p>The CMMC Assessment Guide splits 3.5.3 into the four objectives below. For each one, write one kind of evidence that could show it is true. Then say whether Artifact 2 shows it.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5a.t3\"><thead><tr><th scope=\"col\"><strong>Objective<\/strong><\/th><th scope=\"col\"><strong>The statement that must be true<\/strong><\/th><th scope=\"col\"><strong>One kind of evidence that could show it<\/strong><\/th><th scope=\"col\"><strong>Does Artifact 2 show it? (Yes, No, or Partly)<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">[a]<\/th><td>Privileged accounts are identified<\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r1.c2\" rows=\"2\" aria-label=\"[a], One kind of evidence that could show it\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r1.c3\" rows=\"2\" aria-label=\"[a], Does Artifact 2 show it? (Yes, No, or Partly)\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">[b]<\/th><td>MFA is used for local access to privileged accounts<\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r2.c2\" rows=\"2\" aria-label=\"[b], One kind of evidence that could show it\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r2.c3\" rows=\"2\" aria-label=\"[b], Does Artifact 2 show it? (Yes, No, or Partly)\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">[c]<\/th><td>MFA is used for network access to privileged accounts<\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r3.c2\" rows=\"2\" aria-label=\"[c], One kind of evidence that could show it\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r3.c3\" rows=\"2\" aria-label=\"[c], Does Artifact 2 show it? (Yes, No, or Partly)\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">[d]<\/th><td>MFA is used for network access to non-privileged accounts<\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r4.c2\" rows=\"2\" aria-label=\"[d], One kind of evidence that could show it\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t3.r4.c3\" rows=\"2\" aria-label=\"[d], Does Artifact 2 show it? (Yes, No, or Partly)\"><\/textarea><div class=\"pm\" data-m=\"m5a.t3.r4.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5a.t3\" data-cols=\"4\">+ Add row<\/button>\n<h3>Activity 3 — Adequacy and sufficiency sheet<\/h3>\n<p>Session A. Work with a partner for 20 minutes. Each of you writes your own answers.<\/p>\n<p>The first column is worked for you as a model. Fill in the columns for Artifact 2 and Artifact 3. Use the guide question in each row.<\/p>\n<p>Remember the two tests:<\/p>\n<ul><li><strong>Adequate:<\/strong> the evidence exists and matches what the requirement intends.<\/li><li><strong>Sufficient:<\/strong> there is enough evidence to show the control is in place, followed, and working across the whole scope.<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m5a.t4\"><thead><tr><th scope=\"col\"><strong>Guide question<\/strong><\/th><th scope=\"col\"><strong>Artifact 1 (worked)<\/strong><\/th><th scope=\"col\"><strong>Artifact 2<\/strong><\/th><th scope=\"col\"><strong>Artifact 3<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Which requirement is it offered for?<\/th><td>AC.L2-3.1.1, limit access to authorized users. It also touches 3.1.2 and 3.1.5.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r1.c2\" rows=\"2\" aria-label=\"Which requirement is it offered for?, Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r1.c3\" rows=\"2\" aria-label=\"Which requirement is it offered for?, Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">What type of evidence is it?<\/th><td>An organizational document: a policy<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r2.c2\" rows=\"2\" aria-label=\"What type of evidence is it?, Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r2.c3\" rows=\"2\" aria-label=\"What type of evidence is it?, Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">What does it actually show?<\/th><td>That the company intends to grant access by need-to-know, disable accounts at separation, limit admin rights, and review access &quot;periodically&quot;. Approved in 2021 and never changed.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r3.c2\" rows=\"2\" aria-label=\"What does it actually show?, Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r3.c3\" rows=\"2\" aria-label=\"What does it actually show?, Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Adequate? Yes or no, and one reason<\/th><td>Yes. It exists, it is approved by the CEO, and clauses 4.1 and 4.3 match the intent of the requirement.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r4.c2\" rows=\"2\" aria-label=\"Adequate? Yes or no, and one reason, Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r4.c3\" rows=\"2\" aria-label=\"Adequate? Yes or no, and one reason, Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r4.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Sufficient? Yes or no, and one reason<\/th><td>No. It shows intent, not practice. There is no access matrix, a former employee&#x27;s admin account stayed active for 14 months, and no review record exists for clause 4.4.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r5.c2\" rows=\"2\" aria-label=\"Sufficient? Yes or no, and one reason, Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r5.c3\" rows=\"2\" aria-label=\"Sufficient? Yes or no, and one reason, Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r5.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">What more is needed? Name specific items.<\/th><td>An access control matrix; a current account listing compared with it; dated access review records naming the reviewer; records of accounts disabled when people left.<\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r6.c2\" rows=\"2\" aria-label=\"What more is needed? Name specific items., Artifact 2\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5a.t4.r6.c3\" rows=\"2\" aria-label=\"What more is needed? Name specific items., Artifact 3\"><\/textarea><div class=\"pm\" data-m=\"m5a.t4.r6.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5a.t4\" data-cols=\"4\">+ Add row<\/button>\n<p>Guide prompts for Artifact 2:<\/p>\n<ul><li>How many systems does the screenshot cover? How many in-scope systems need MFA? Use the MFA status list in the ThreadBridge case.<\/li><li>A screenshot shows a policy is on. Does it show any exclusions, which are users or apps left out of the policy?<\/li><\/ul>\n<p>Guide prompts for Artifact 3:<\/p>\n<ul><li>Is the email a record of something done, on a date, by a named person? Or is it a statement?<\/li><li>&quot;We have not seen anything unusual.&quot; Could ThreadBridge have seen anything unusual if no one reviews the logs on a schedule?<\/li><\/ul>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 5 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 4 and 5.<\/p><p>The five ThreadBridge artifacts come first. Read Artifacts 1 to 3 before Session A. You use all five during the week.<\/p><p>The Technical Evidence Lab is a separate handout, technical_evidence_lab.docx.<\/p><\/aside>\n<h3>The five ThreadBridge artifacts<\/h3>\n<p>An artifact is a specific piece of evidence a company supplies. Each one below is shown as Dennis Park, ThreadBridge&#x27;s IT Manager, supplied it, with where it came from. Nothing has been changed to make it look better or worse.<\/p>\n<h4>Artifact 1 — Policy excerpt<\/h4>\n<p>Supplied by Dennis Park as a PDF. The file properties show it was created on March 14, 2021, and last changed on March 14, 2021.<\/p>\n<pre class=\"scenario\">THREADBRIDGE SOLUTIONS, LLC - INFORMATION SECURITY POLICY\nSection 4: Access Control\n4.1  Access to Company information systems shall be granted on the basis\n     of business need-to-know and shall be limited to the minimum access\n     necessary for an employee to perform their assigned duties.\n4.2  User accounts shall be created upon hire and disabled upon separation.\n4.3  Administrative privileges shall be restricted to authorized IT personnel.\n4.4  Access rights shall be reviewed periodically by the IT Manager.\nApproved:  M. Holloway, CEO          Date: March 14, 2021<\/pre>\n<h4>Artifact 2 — Settings screenshot<\/h4>\n<p>Supplied by Dennis Park as a screenshot taken during a walkthrough. The tenant name shown matches ThreadBridge&#x27;s Microsoft 365 account. It was taken four days before it was supplied.<\/p>\n<pre class=\"scenario\">Microsoft 365 admin center - Conditional Access\nPolicy name:   Require MFA for all users\nState:         On\nAssignments\n  Users:       All users  (82)\n  Cloud apps:  All cloud apps\n  Conditions:  Any location\nAccess controls\n  Grant:       Require multifactor authentication\nModified:      11 months ago<\/pre>\n<h4>Artifact 3 — Email<\/h4>\n<p>Supplied by Dennis Park by email, in reply to a request for records of audit log reviews.<\/p>\n<pre class=\"scenario\">From:    Dennis Park\nTo:      Compliance Team\nSubject: RE: Evidence request - audit logging\n \nLogging is turned on everywhere - Windows event logs on all the\nservers and the Sophos firewall logs everything. I check them regularly\nand we have not seen anything unusual. If something looked wrong I would\nknow about it. I have been doing this here for nine years.\n \nLet me know if you need anything else.\nDennis<\/pre>\n<h4>Artifact 4 — Third-party report<\/h4>\n<p>Supplied by Dennis Park as a one-page PDF. He says this is everything he received. The full report was never delivered. Cascade Networks, which wrote it, also manages ThreadBridge&#x27;s firewall.<\/p>\n<pre class=\"scenario\">CASCADE NETWORKS - SECURITY ASSESSMENT SUMMARY\nClient:   ThreadBridge Solutions, LLC\nDate:     June 2025\nScope:    External and internal vulnerability scan\n \nFINDINGS BY SEVERITY\n  Critical ......  3\n  High ..........  11\n  Medium ........  27\n  Low ...........  44\n \nOverall risk rating: ELEVATED\nA detailed findings register is available on request.\nThis summary is provided for management information purposes.<\/pre>\n<h4>Artifact 5 — Asset list<\/h4>\n<p>Supplied by Dennis Park as a spreadsheet. Asked how he made it, he said he &quot;went round and wrote down what we have.&quot; The file has no date.<\/p>\n<pre class=\"scenario\">ThreadBridge asset list\nItem                      Qty   Notes\nLaptops / desktops         41   Windows 10 and 11\nService accounts            3   for backups and the ERP\n(end of file)<\/pre>\n<h3>Activity 4 — Matching methods<\/h3>\n<p>Session B. Work with a partner for 15 minutes.<\/p>\n<p><strong>Part 1.<\/strong> Each row is one way to check a ThreadBridge control. Choose the method: examine, interview, or test. Then write what this check can show and what it cannot show.<\/p>\n<p>Hint: watching an activity, such as a visitor signing in, is a form of examine. The object is the activity.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t1\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>The check<\/strong><\/th><th scope=\"col\"><strong>Method<\/strong><\/th><th scope=\"col\"><strong>What it can show<\/strong><\/th><th scope=\"col\"><strong>What it cannot show<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">M1<\/th><td>Read the Conditional Access policy export from Microsoft 365, including exclusions<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r1.c2\" rows=\"2\" aria-label=\"M1, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r1.c3\" rows=\"2\" aria-label=\"M1, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r1.c4\" rows=\"2\" aria-label=\"M1, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M2<\/th><td>Sign in to the VPN with a sample account and see whether a second factor is asked for<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r2.c2\" rows=\"2\" aria-label=\"M2, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r2.c3\" rows=\"2\" aria-label=\"M2, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r2.c4\" rows=\"2\" aria-label=\"M2, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M3<\/th><td>Ask Sandra Ybarra, the Contracts Manager, how she decided not to report incident INC-001<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r3.c2\" rows=\"2\" aria-label=\"M3, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r3.c3\" rows=\"2\" aria-label=\"M3, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r3.c4\" rows=\"2\" aria-label=\"M3, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M4<\/th><td>Read the KnowBe4 training completion report<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r4.c2\" rows=\"2\" aria-label=\"M4, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r4.c3\" rows=\"2\" aria-label=\"M4, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r4.c4\" rows=\"2\" aria-label=\"M4, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r4.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M5<\/th><td>Ask Dennis Park how often he reviews the server and firewall logs<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r5.c2\" rows=\"2\" aria-label=\"M5, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r5.c3\" rows=\"2\" aria-label=\"M5, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r5.c4\" rows=\"2\" aria-label=\"M5, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r5.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M6<\/th><td>Insert a USB drive into a workstation that handles CUI and see whether it is blocked<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r6.c2\" rows=\"2\" aria-label=\"M6, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r6.c3\" rows=\"2\" aria-label=\"M6, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r6.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r6.c4\" rows=\"2\" aria-label=\"M6, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r6.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M7<\/th><td>Read the TechServ master services agreement<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r7.c2\" rows=\"2\" aria-label=\"M7, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r7.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r7.c3\" rows=\"2\" aria-label=\"M7, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r7.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r7.c4\" rows=\"2\" aria-label=\"M7, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r7.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">M8<\/th><td>Watch a printer technician arrive at the Cumberland server room and see whether anyone escorts or logs the visit<\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r8.c2\" rows=\"2\" aria-label=\"M8, Method\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r8.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r8.c3\" rows=\"2\" aria-label=\"M8, What it can show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r8.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t1.r8.c4\" rows=\"2\" aria-label=\"M8, What it cannot show\"><\/textarea><div class=\"pm\" data-m=\"m5b.t1.r8.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5b.t1\" data-cols=\"5\">+ Add row<\/button>\n<p><strong>Part 2.<\/strong> Online work, after Session B. Work alone for about 20 minutes. For each requirement, choose two checks that would confirm each other. Use two different methods. Say why the pair is stronger than either check alone.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t2\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>First check (method and object)<\/strong><\/th><th scope=\"col\"><strong>Second check (method and object)<\/strong><\/th><th scope=\"col\"><strong>Why the pair is stronger<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">AU.L2-3.3.1, audit logs<\/th><td><textarea class=\"fld \" data-f=\"m5b.t2.r1.c1\" rows=\"2\" aria-label=\"AU.L2-3.3.1, audit logs, First check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r1.c2\" rows=\"2\" aria-label=\"AU.L2-3.3.1, audit logs, Second check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r1.c3\" rows=\"2\" aria-label=\"AU.L2-3.3.1, audit logs, Why the pair is stronger\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">IA.L2-3.5.3, MFA<\/th><td><textarea class=\"fld \" data-f=\"m5b.t2.r2.c1\" rows=\"2\" aria-label=\"IA.L2-3.5.3, MFA, First check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r2.c2\" rows=\"2\" aria-label=\"IA.L2-3.5.3, MFA, Second check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r2.c3\" rows=\"2\" aria-label=\"IA.L2-3.5.3, MFA, Why the pair is stronger\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">PE.L2-3.10.3, visitors<\/th><td><textarea class=\"fld \" data-f=\"m5b.t2.r3.c1\" rows=\"2\" aria-label=\"PE.L2-3.10.3, visitors, First check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r3.c2\" rows=\"2\" aria-label=\"PE.L2-3.10.3, visitors, Second check (method and object)\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t2.r3.c3\" rows=\"2\" aria-label=\"PE.L2-3.10.3, visitors, Why the pair is stronger\"><\/textarea><div class=\"pm\" data-m=\"m5b.t2.r3.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m5b.t2\" data-cols=\"4\">+ Add row<\/button>\n<h3>Activity 5 — Start the D3 evidence log (Part A)<\/h3>\n<p>Session B. Work alone for 30 minutes. Aim to finish at least the first four rows. Finish the rest in the online work, after Session B.<\/p>\n<p>This is your own copy of D3 Part A. It is graded work, so write every entry yourself. You carry it into the D3 file in Module 6.<\/p>\n<p><strong>Your sources.<\/strong> Use the five artifacts at the start of this workbook, the five exports in the Technical Evidence Lab, the ThreadBridge case (threadbridge.html), and the D1 attachment.<\/p>\n<p><strong>The gap list.<\/strong> These are ThreadBridge&#x27;s 12 gaps as the company describes them. The descriptions are the company&#x27;s own words, shortened. The third column is the requirement the company&#x27;s documents name. The last column is the requirement D3 uses.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t3\"><thead><tr><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>What the company&#x27;s gap list says<\/strong><\/th><th scope=\"col\"><strong>Company maps it to<\/strong><\/th><th scope=\"col\"><strong>D3 requirement<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">G-01<\/th><td>MFA on Microsoft 365 only. ERP, file server, domain controller remote desktop, VPN, QuickBooks, and backup NAS all use one factor.<\/td><td>3.5.3<\/td><td>3.5.3<\/td><\/tr><tr><th scope=\"row\">G-02<\/th><td>No access control matrix. Access managed from memory. Orphaned admin account active for 14 months.<\/td><td>3.1.1, 3.1.2<\/td><td>3.1.1<\/td><\/tr><tr><th scope=\"row\">G-03<\/th><td>Logs turned on, never reviewed. No retention policy. No log collection tool.<\/td><td>3.3.1, 3.3.2<\/td><td>3.3.1<\/td><\/tr><tr><th scope=\"row\">G-04<\/th><td>Last vulnerability scan June 2025. No schedule. No tracking of fixes.<\/td><td>3.11.2<\/td><td>3.11.2<\/td><\/tr><tr><th scope=\"row\">G-05<\/th><td>No written incident response plan. Two incidents handled informally. Neither reported.<\/td><td>3.6.1, 3.6.2<\/td><td>3.6.1<\/td><\/tr><tr><th scope=\"row\">G-06<\/th><td>No baseline configurations. No change management. Software installed on request.<\/td><td>3.4.1, 3.4.3<\/td><td>3.4.1<\/td><\/tr><tr><th scope=\"row\">G-07<\/th><td>Vendor has ERP access with no CUI clause, no escort, and no sanitization requirement.<\/td><td>3.7.5<\/td><td>3.7.5<\/td><\/tr><tr><th scope=\"row\">G-08<\/th><td>No System Security Plan exists.<\/td><td>3.12.1<\/td><td>3.12.4<\/td><\/tr><tr><th scope=\"row\">G-09<\/th><td>One VLAN for all devices. Unmanaged tablets on the same network as the ERP and file server.<\/td><td>3.13.3<\/td><td>3.13.3<\/td><\/tr><tr><th scope=\"row\">G-10<\/th><td>No removable media policy. No sanitization procedure. USB drives used freely.<\/td><td>3.8.7<\/td><td>3.8.7<\/td><\/tr><tr><th scope=\"row\">G-11<\/th><td>60% training completion. No role-based training for people who handle CUI.<\/td><td>3.2.2<\/td><td>3.2.2<\/td><\/tr><tr><th scope=\"row\">G-12<\/th><td>No visitor log for the server room. No badge access at the second site.<\/td><td>3.10.3<\/td><td>3.10.3<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>How to fill in the log.<\/strong><\/p>\n<p>1. Evidence available: name the artifact or the case fact. If nothing exists, write &quot;None found&quot; and say what you looked for.<\/p>\n<p>2. Adequate? and Sufficient?: write Yes, No, or Partly, with a short reason. Ask whether the evidence would show the requirement is met.<\/p>\n<p>3. What more is needed: name specific items someone could find and hand over. Add the custodian, the person who holds it, if you know.<\/p>\n<p>4. Do not write how to fix the gap. Name what is missing only.<\/p>\n<p>The first row is worked for you.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m5b.t4\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Gap<\/strong><\/th><th scope=\"col\"><strong>Evidence available<\/strong><\/th><th scope=\"col\"><strong>Adequate?<\/strong><\/th><th scope=\"col\"><strong>Sufficient?<\/strong><\/th><th scope=\"col\"><strong>What more is needed<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">IA.L2-3.5.3<\/th><td>G-01<\/td><td>Artifact 2, the Microsoft 365 Conditional Access screenshot. The case&#x27;s MFA status list.<\/td><td>Yes, for Microsoft 365. It is a current setting that requires MFA.<\/td><td>No. It covers one system. Six other in-scope systems accept a password alone.<\/td><td>MFA settings for the ERP, file server, domain controller remote desktop, VPN, QuickBooks, and backup NAS; the full policy export with exclusions; a test login with a sample account. Custodian: Dennis Park.<\/td><\/tr><tr><th scope=\"row\">AC.L2-3.1.1<\/th><td>G-02<\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r2.c2\" rows=\"2\" aria-label=\"AC.L2-3.1.1, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r2.c3\" rows=\"2\" aria-label=\"AC.L2-3.1.1, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r2.c4\" rows=\"2\" aria-label=\"AC.L2-3.1.1, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r2.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r2.c5\" rows=\"2\" aria-label=\"AC.L2-3.1.1, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r2.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">AU.L2-3.3.1<\/th><td>G-03<\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r3.c2\" rows=\"2\" aria-label=\"AU.L2-3.3.1, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r3.c3\" rows=\"2\" aria-label=\"AU.L2-3.3.1, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r3.c4\" rows=\"2\" aria-label=\"AU.L2-3.3.1, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r3.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r3.c5\" rows=\"2\" aria-label=\"AU.L2-3.3.1, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r3.c5\"><\/div><\/td><\/tr><tr><th scope=\"row\">RA.L2-3.11.2<\/th><td>G-04<\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r4.c2\" rows=\"2\" aria-label=\"RA.L2-3.11.2, Evidence available\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r4.c3\" rows=\"2\" aria-label=\"RA.L2-3.11.2, Adequate?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r4.c4\" rows=\"2\" aria-label=\"RA.L2-3.11.2, Sufficient?\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r4.c4\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m5b.t4.r4.c5\" rows=\"2\" aria-label=\"RA.L2-3.11.2, What more is needed\"><\/textarea><div class=\"pm\" data-m=\"m5b.t4.r4.c5\"><\/d
