with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1, 2, 3 and 4. Online, outside class: Activity 6.<\/p><p>All work here is your own. You work alone, except at the checkpoint and the out-brief, where a classmate plays the point of contact. If you miss a mock day, use the make-up record at the end of the Session B (Day 2) workbook.<\/p><\/aside>\n<aside class=\"callout warn\"><p class=\"callout-h\">Two rules of conduct for both days<\/p><p>•  No advice on fixes. Do not tell ThreadBridge how to fix anything, even when someone asks you directly.<\/p><p>•  No predicting the result. Do not say &quot;this looks good&quot; or &quot;you are close.&quot;<\/p><p>You may say what you found and what evidence you still need.<\/p><\/aside>\n<h3>Activity 1 — In-brief<\/h3>\n<p>Day 1. Work alone.<\/p>\n<p><strong>Step 1. Your requirement set.<\/strong> Your set (A, B, C, or D) is posted in Canvas. Fill this in before the in-brief starts.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m7a.t1\"><thead><tr><th scope=\"col\"><strong>Your name<\/strong><\/th><th scope=\"col\"><strong>Set<\/strong><\/th><th scope=\"col\"><strong>Your three requirements<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m7a.t1.r1.c0\" rows=\"2\" aria-label=\"row 1, Your name\"><\/textarea><div class=\"pm\" data-m=\"m7a.t1.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m7a.t1.r1.c1\" rows=\"2\" aria-label=\"row 1, Set\"><\/textarea><div class=\"pm\" data-m=\"m7a.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m7a.t1.r1.c2\" rows=\"2\" aria-label=\"row 1, Your three requirements\"><\/textarea><div class=\"pm\" data-m=\"m7a.t1.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m7a.t1\" data-cols=\"3\">+ Add s a different requirement set. Your partner plays the point of contact from role card 7. Then you switch. Your own notes are your own work.<\/p>\n<p><strong>Step 1. Before the checkpoint.<\/strong> Write the three sentences you will say. Keep them to facts. Do not predict the result.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m7a.t8\"><thead><tr><th scope=\"col\"><strong>Topic<\/strong><\/th><th scope=\"col\"><strong>What you will say<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Progress: what you reviewed today<\/th><td><textarea class=\"fld \" data-f=\"m7a.t8.r1.c1\" rows=\"2\" aria-label=\"Progress: what you reviewed today, What you will say\"><\/textarea><div class=\"pm\" data-m=\"m7a.t8.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Problems: what you could not settle from the documents<\/th><td><textarea class=\"fld \" data-f=\"m7a.t8.r2.c1\" rows=\"2\" aria-label=\"Problems: what you could not settle from the documents, What you will say\"><\/textarea><div class=\"pm\" data-m=\"m7a.t8.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Next: what you need to see on Day 2<\/th><td><textarea class=\"fld \" data-f=\"m7a.t8.r3.c1\" rows=\"2\" aria-label=\"Next: what you need to see on Day 2, What you will say\"><\/textarea><div class=\"pm\" data-m=\"m7a.t8.r3.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m7a.t8\" data-cols=\"2\">+ Add row<\/button>\n<p><strong>Step 2. During the checkpoint.<\/strong> Record the challenge from the point of contact.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m7a.t9\"><thead><tr><th scope=\"col\"><strong>Question<\/strong><\/th><th scope=\"col\"><strong>Notes<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Which determination was challenged?<\/th><td><textarea class=\"fld \" data-f=\"m7a.t9.r1.c1\" rows=\"2\" aria-label=\"Which determination was challenged?, Notes\"><\/textarea><div class=\"pm\" data-m=\"m7a.t9.r1.c1\"><\/div><\/td><\/tr><tr><th me through,&quot; or &quot;Tell me what happened when.&quot;<\/p>"], ["Day 2 (Session B)", "<p class=\"docmeta\">Download this file before Session B (Day 2). Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 7 activities for Session B (Day 2), and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 5, 7, 8, 9 and 10. Online, outside class: Activity 11.<\/p><p>All work here is your own. You work alone, except at the checkpoint and the out-brief, where a classmate plays the point of contact. If you miss a mock day, use the make-up record at the end.<\/p><\/aside>\n<aside class=\"callout warn\"><p class=\"callout-h\">Two rules of conduct for both days<\/p><p>•  No advice on fixes. Do not tell ThreadBridge how to fix anything, even when someone asks you directly.<\/p><p>•  No predicting the result. Do not say &quot;this looks good&quot; or &quot;you are close.&quot;<\/p><p>You may say what you found and what evidence you still need.<\/p><\/aside>\n<h3>Activity 5 — Supplemental evidence log<\/h3>\n<p>Day 2. Work alone for 7 minutes.<\/p>\n<p>List every item from your evidence request. Record what arrived and the outcome. Choose one outcome: received and responsive, received and not responsive, or not provided. &quot;Not provided&quot; is a result. It belongs in your findings.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m7b.t1\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Item you asked for<\/strong><\/th><th scope=\"col\"><strong>What you received<\/strong><\/th><th scope=\"col\"><strong>Outcome<\/strong><\/th><th scope=\"col\"><strong>Does it change a determinat iv><\/td><\/tr><tr><th scope=\"row\">Next step for the company: the final report and, if the company has conditional status, the POA&amp;M closeout (no advice)<\/th><td><textarea class=\"fld \" data-f=\"m7b.t7.r5.c1\" rows=\"2\" aria-label=\"Next step for the company: the final report and, if the company has conditional status, the POA&amp;amp;M closeout (no advice), What you will say\"><\/textarea><div class=\"pm\" data-m=\"m7b.t7.r5.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m7b.t7\" data-cols=\"2\">+ Add row<\/button>\n<p><strong>Step 2. The challenge.<\/strong> Record it after the out-brief.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m7b.t8\"><thead><tr><th scope=\"col\"><strong>Question<\/strong><\/th><th scope=\"col\"><strong>Notes<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">What finding was challenged?<\/th><td><textarea class=\"fld \" data-f=\"m7b.t8.r1.c1\" rows=\"2\" aria-label=\"What finding was challenged?, Notes\"><\/textarea><div class=\"pm\" data-m=\"m7b.t8.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">What did the point of contact say?<\/th><td><textarea class=\"fld \" data-f=\"m7b.t8.r2.c1\" rows=\"2\" aria-label=\"What did the point of contact say?, Notes\"><\/textarea><div class=\"pm\" data-m=\"m7b.t8.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">How did you answer?<\/th><td><textarea class=\"fld \" data-f=\"m7b.t8.r3.c1\" rows=\"2\" aria-label=\"How did you answer?, Notes\"><\/textarea><div class=\"pm\" data-m=\"m7b.t8.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Did you concede anything? Was the reason a new fact?<\/th><td><textarea class=\"fld \" data-f=\"m7b.t8.r4.c1\" rows=\"2\" aria-label=\"Did you concede anything? Was the reason a new fact?, Notes\"><\/textarea><div class=\"pm\" data-m=\"m7b.t8.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Did you give advice or predict the result at any point?<\/th><td><textarea class=\"fld \" data-f=\"m7b.t8.r5.c1\ ss=\"tbl-wrap\"><table data-tid=\"m8b.t4\"><thead><tr><th scope=\"col\"><strong>Your two weakest skills<\/strong><\/th><th scope=\"col\"><strong>One step you will take for each, with a date<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m8b.t4.r1.c0\" rows=\"2\" aria-label=\"row 1, Your two weakest skills\"><\/textarea><div class=\"pm\" data-m=\"m8b.t4.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m8b.t4.r1.c1\" rows=\"2\" aria-label=\"row 1, One step you will take for each, with a date\"><\/textarea><div class=\"pm\" data-m=\"m8b.t4.r1.c1\"><\/div><\/td><\/tr><tr><td><textarea class=\"fld \" data-f=\"m8b.t4.r2.c0\" rows=\"2\" aria-label=\"row 2, Your two weakest skills\"><\/textarea><div class=\"pm\" data-m=\"m8b.t4.r2.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m8b.t4.r2.c1\" rows=\"2\" aria-label=\"row 2, One step you will take for each, with a date\"><\/textarea><div class=\"pm\" data-m=\"m8b.t4.r2.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m8b.t4\" data-cols=\"2\">+ Add row<\/button>\n<p>Keep this page. Your D4 career plan uses it.<\/p>"]], "deliv": "Module 8 activities", "keys": ["m8b"]}, {"id": "d4", "group": "Module 8", "nav": "D4 Findings, POA&M, Career Plan", "title": "D4 — Findings, POA&M, and Career Plan", "meta": "Individual. Findings and POA&M, about 2 pages, plus a career plan, 1 page. Due at the end of Week 8", "tabs": [["Brief", "<h3>The task<\/h3>\n<p>ThreadBridge&#x27;s leaders need to know what your Module 7 assessment found and what it means. Write D4 for Margaret Holloway, the CEO. Then write a one-page career plan. D4 is your own work. Use the D4 template, your Module 7 workbook, your D3 workbook, and your work from Session A. You start Part B in Session A. You write the rest outside class.<\/p>\n<h3>What to include<\/h3>\n<p>1. <strong>Part A, Findings.<\/strong> Write a finding for each requirement in your Module 7 set that you found NOT MET. Each finding gives the requirement, a clear finding statement, the evidence you examined, and what is missing. Also list any evidence you asked for and did not receive. Do not give advice on how to fix anything.<\/p>\n<p>2. <strong>Part B, POA&amp;M and eligibility.<\/strong> Build the POA&amp;M for every NOT MET item among the 12 guided requirements. Use your Module 7 determinations for your own set and your D3 determinations for the other nine. For each item, check the points and the named list, and say whether it may go on a POA&amp;M. Give a milestone, an owner, and a target date. Then use your D3 SPRS score to check the score threshold. Write an overall eligibility conclusion: is ThreadBridge eligible for a POA&amp;M, and what would have to change?<\/p>\n<p>3. <strong>Part C, Career plan.<\/strong> Name two target entry-level roles. List the skills you showed in this course, with where you showed them. List your next learning steps with dates. Say whether and when a credential might fit as a later step: CompTIA Security+, the CMMC Registered Practitioner (RP), or the Certified CMMC Professional (CCP).<\/p>\n<h3>Requirements<\/h3>\n<ul><li>Parts A and B about 2 pages. Career plan 1 page. Tables plus short paragraphs work well.<\/li><li>Every finding must point to evidence you actually examined. If you did not see it, you cannot cite it.<\/li><li>Every eligibility decision must cite the rule in 32 CFR 170.21 that decides it. &quot;Low risk&quot; or &quot;cheap to fix&quot; is not a reason.<\/li><li>A milestone states what must be true by a date. It does not design the technical fix.<\/li><li>Submit one Word file through Canvas, with your name on it. You may use the D4 template in the course lab, cmmc_lab.html.<\/li><\/ul>\n<h3>Rubric<\/h3>\n<p>D4 is worth 100 points. Each criterion is worth 20 points. Exceeds earns 20 points, Mastery 18, Near 15, Below 11, and No Evidence 0. Work not submitted earns zero.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"brief.t1\"><thead><tr><th scope=\"col\"><strong>Criterion<\/strong><\/th><th scope=\"col\"><strong>No Evidence<\/strong><\/th><th scope=\"col\"><strong>Below<\/strong><\/th><th scope=\"col\"><strong>Near<\/strong><\/th><th scope=\"col\"><strong>Mastery<\/strong><\/th><th scope=\"col\"><strong>Exceeds<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Findings quality (20 points)<\/th><td>Not addressed: no findings<\/td><td>Findings give no evidence, cite evidence not examined, or give advice<\/td><td>Names the requirement and the evidence, but what is missing is vague in at least one finding<\/td><td>Each finding gives the requirement, the evidence examined, and what is missing, with no advice<\/td><td>A reviewer could check or overturn each finding from what is written; evidence not provided is reported<\/td><\/tr><tr><th scope=\"row\">POA&amp;M eligibility (20 points)<\/th><td>Not addressed: no eligibility check<\/td><td>Places barred items on the POA&amp;M, or applies no rule correctly<\/td><td>Applies the score rule but misses the points rule or the named list<\/td><td>Applies all three rules to every item and concludes that ThreadBridge is not eligible<\/td><td>Also shows that each rule alone blocks a POA&amp;M, and states what would have to change<\/td><\/tr><tr><th scope=\"row\">POA&amp;M plan (20 points)<\/th><td>Not addressed: no POA&amp;M plan<\/td><td>Items missing, and no owners or dates<\/td><td>Most items listed; owners or dates incomplete<\/td><td>Every NOT MET item has a milestone, an owner, and a target date; barred items are marked as must be MET first<\/td><td>Also notes that the 180 days have no start date yet, and orders items that depend on each other<\/td><\/tr><tr><th scope=\"row\">Career plan (20 points)<\/th><td>Not addressed: no career plan<\/td><td>Generic, or no dates<\/td><td>Two roles named, but skills or dates are missing<\/td><td>Two roles, skills tied to course work, dated next steps, and any credential placed as a realistic later step<\/td><td>Each next step answers a weakness the student named honestly, in a realistic order<\/td><\/tr><tr><th scope=\"row\">Communication (20 points)<\/th><td>The CEO could not use it<\/td><td>Hard to follow; jargon unexplained throughout, or far over length<\/td><td>Understandable, but has unexplained jargon or is too long<\/td><td>Clear, plain, and within length; terms defined<\/td><td>The CEO could understand the result without asking a follow-up question<\/td><\/tr><\/tbody><\/table><\/div>"], ["Your work", "<p class=\"docmeta\">Individual. Findings and POA&amp;M (Parts A and B), about 2 pages. Career plan (Part C), 1 page. Due at the end of Week 8.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this template<\/p><p>D4 is your own work. Submit one Word file with all three parts and your name on it.<\/p><p>Work from your Module 7 workbook, your D3 workbook, and Activity 2 in the Module 8 workbook. You start Part B in Session A and write the rest outside class.<\/p><p>Write for Margaret Holloway, ThreadBridge&#x27;s chief executive officer (CEO). Define each term and spell out each acronym the first time you use it.<\/p><p>Do not give advice on how to fix anything. A finding states what is missing. A milestone states what must be true by a date. Neither one designs the fix.<\/p><\/aside>\n<div class=\"tbl-wrap\"><table data-tid=\"d4.t1\"><thead><tr><th scope=\"col\"><strong>Name<\/strong><\/th><th scope=\"col\"><strong>Your Module 7 requirement set (A, B, C, or D)<\/strong><\/th><th scope=\"col\"><strong>Your D3 SPRS score<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d4.t1.r1.c0\" rows=\"2\" aria-label=\"row 1, Name\"><\/textarea><div class=\"pm\" data-m=\"d4.t1.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d4.t1.r1.c1\" rows=\"2\" aria-label=\"row 1, Your Module 7 requirement set (A, B, C, or D)\"><\/textarea><div class=\"pm\" data-m=\"d4.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d4.t1.r1.c2\" rows=\"2\" aria-label=\"row 1, Your D3 SPRS score\"><\/textarea><div class=\"pm\" data-m=\"d4.t1.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d4.t1\" data-cols=\"3\">+ Add row<\/button>\n<h3>Part A — Findings<\/h3>\n<p>Write one finding for each requirement in your Module 7 set that you found NOT MET. A finding has four parts:<\/p>\n<ul><li><strong>Requirement:<\/strong> the NIST SP 800-171 number and short title.<\/li><li><strong>Finding statement:<\/strong> one or two sentences that say what is not met. Write it so a reviewer could check it.<\/li><li><strong>Evidence examined:<\/strong> the documents you read, the people you interviewed, and anything you tested. Cite only what you actually saw.<\/li><li><strong>What is missing:<\/strong> the specific thing the evidence did not show.<\/li><\/ul>\n<p>An example of the form, with an invented requirement and company:<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d4.t2\"><thead><tr><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Finding statement<\/strong><\/th><th scope=\"col\"><strong>Evidence examined<\/strong><\/th><th scope=\"col\"><strong>What is missing<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">3.x.x, lock screens after a period without use<\/th><td>Screens on the shop floor computers do not lock when no one is using them.<\/td><td>The screen settings on two shop floor computers; an interview with the shop lead<\/td><td>A screen lock setting on the shop floor computers<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table data-tid=\"d4.t3\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Requirement<\/strong><\/th><th scope=\"col\"><strong>Finding statement<\/strong><\/th><th scope=\"col\"><strong>Evidence examined<\/strong><\/th><th scope=\"col\"><strong>What is missing<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\" >\n<h4>4. A credential as a possible later step<\/h4>\n<p>None of these is required for an entry-level role. Pick the one that fits your two target roles best, or say why none fits yet.<\/p>\n<ul><li><strong>CompTIA Security+<\/strong> is a common entry-level security credential. It adds the technical base this course does not teach.<\/li><li><strong>The CMMC Registered Practitioner (RP)<\/strong>, from the Cyber AB, is for people who help companies get ready for CMMC. It requires registering with the Cyber AB, a commercial background check, the Cyber AB&#x27;s online RP training and course exams, and signing the Code of Professional Conduct and an RP agreement.<\/li><li><strong>The Certified CMMC Professional (CCP)<\/strong>, from ISACA, is the first assessor credential. It requires training from an approved training provider, a passing exam score, and a Tier 3 background determination.<\/li><\/ul>\n<p>Check the official page for current requirements before you choose dates.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"d4.t11\"><thead><tr><th scope=\"col\"><strong>Which credential, if any, fits your plan? Why?<\/strong><\/th><th scope=\"col\"><strong>What it would require of you<\/strong><\/th><th scope=\"col\"><strong>Roughly when<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"d4.t11.r1.c0\" rows=\"2\" aria-label=\"row 1, Which credential, if any, fits your plan? Why?\"><\/textarea><div class=\"pm\" data-m=\"d4.t11.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d4.t11.r1.c1\" rows=\"2\" aria-label=\"row 1, What it would require of you\"><\/textarea><div class=\"pm\" data-m=\"d4.t11.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"d4.t11.r1.c2\" rows=\"2\" aria-label=\"row 1, Roughly when\"><\/textarea><div class=\"pm\" data-m=\"d4.t11.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"d4.t11\" data-cols=\"3\">+ Add row<\/button>\n<h4>Before you submit<\/h4  var tb=$('table[data-tid="'+tid+'"] tbody');var c=+(sget(tid+".extra")||0);var idx=tb.rows.length+1;var tr=document.createElement("tr");
 for(var i=0;i<n;i++){var td=document.createElement("td"),id=tid+".x"+idx+".c"+i,ta=document.createElement("textarea");
  ta.className="fld";ta.rows=2;ta.setAttribute("data-f",id);ta.setAttribute("aria-label","Added row "+idx+", column "+(i+1));
  var pm=document.createElement("div");pm.className="pm";pm.setAttribute("data-m",id);td.appendChild(ta);td.appendChild(pm);tr.appendChild(td)}
 tb.appendChild(tr);if(!silent)sset(tid+".extra",String(c+1));bind(tr);if(!silent)tr.querySelector("textarea").focus()}
function restoreRows(root){$$(".addrow",root).forEach(function(b){if(b._r)return;b._r=1;var c=+(sget(b.getAttribute("data-tid")+".extra")||0);for(var i=0;i<c;i++)addRow(b,true);
 b.addEventListener("click",function(){addRow(b)})})}
/* ---- D7 arithmetic: sums the student's own Deduction column, nothing more ---- */
function calc(){$$(".calc").forEach(function(box){var t=$('table[data-tid="'+box.getAttribute("data-calc")+'"]');if(!t)return;
 var hd=$$("thead th",t).map(function(h){return h.textContent.trim().toLowerCase()}),col=hd.indexOf("deduction");if(col<0)return;
 var sum=0,n=0;$$("tbody tr",t).forEach(function(r){var c=r.cells[col];if(!c)return;var f=c.querySelector("textarea");var v=f?parseFloat(f.value):NaN;if(!isNaN(v)){sum+=v;n++}});
 var sc=110-sum;box.innerHTML="<strong>Arithmetic check.</strong> The Deduction column adds up to <strong>"+sum+"</strong> across "+n+" rows. 110 &minus; "+sum+" = <strong>"+sc+"</strong>, and "+sc+" &divide; 110 = <strong>"+(sc/110).toFixed(3)+"</strong>. The arithmetic is only as good as the point values entered. Whether this figure could be posted at all is a separate question."})}
function wc(){$$("[data-wc]").forEach(function(p){var k=p.getAttribute("data-wc"),w=0;$$('textarea[data-f^="'+k+'.s"]').forEach(function(t){w+=(t.value.match(/\S+/g)||[]).length});
 p.textContent="Words: "+w+" (about "+Math.max(1,Math.round(w/450*10)/10)+" pages)"})}
function progress(){PAGES.forEach(function(p,i){if(!p.tabs)return;var tot=0,done=0;var re=new RegExp("^("+p.id+"|"+(p.keys||[]).join("|")+")\\.");
 var all=allKeys();for(var k in all){if(re.test(k)&&!/\.extra$/.test(k)&&String(all[k]).trim())done++}
 var b=$('#navlist button[data-i="'+i+'"] .pct');if(b)b.textContent=done?done+" saved":""})}
function upd(){calc();wc();progress()}

/* ---- locked sections (AES-GCM, PBKDF2-SHA256) ---- */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function unseal(name,pass){var s=SEALED[name];if(!window.crypto||!crypto.subtle)return Promise.reject(new Error("nocrypto"));
 return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]).then(function(k){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(s.s),iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(key){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(s.i)},key,b64(s.c))}).then(function(buf){return new TextDecoder().decode(buf)})}
function lockUI(box){var name=box.getAttribute("data-lock");
 function open(htmlc){box.innerHTML=htmlc;bind(box);restoreRows(box);timer(box);upd()}
 var saved=sget("_unlock."+name);if(saved){unseal(name,saved).then(open,function(){draw()});return}
 draw();
 function draw(){box.innerHTML='<div class="lockbox"><p><strong>Locked until class.</strong> The instructor gives out the passphrase when this section is issued.</p>'+
  '<label for="pw-'+name+'">Passphrase</label><br><input id="pw-'+name+'" autocomplete="off"><button type="button">Unlock</button><p class="lockmsg" role="alert"></p></div>';
  var inp=box.querySelector("input"),btn=box.querySelector("button"),msg=box.querySelector(".lockmsg");
  function go(){var p=inp.value.trim().toLowerCase().replace(/\s+/g,"-");msg.textContent="Checking...";
   unseal(name,p).then(function(h){sset("_unlock."+name,p);open(h)},function(e){msg.textContent=e&&e.message==="nocrypto"?"This browser cannot open locked sections. Open the lab over https or in a current browser.":"That passphrase does not match."})}
  btn.addEventListener("click",go);inp.addEventListener("keydown",function(e){if(e.key==="Enter")go()})}}
function timer(root){var b=$("#tt-start",root),c=$("#tt-clock",root);if(!b)return;var t=null;
 b.addEventListener("click",function(){if(t){clearInterval(t);t=null;b.textContent="Restart the 30-minute timer"}
  var end=Date.now()+30*60000;b.textContent="Restart the 30-minute timer";
  t=setInterval(function(){var s=Math.max(0,Math.round((end-Date.now())/1000));c.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
   c.className=s<300?"low":"";if(!s){clearInterval(t);c.textContent="Time"}},500)})}

/* ---- rendering ---- */
function who(){return '<div class="who"><label>Name<input class="fld" data-f="_who.name" autocomplete="name"></label>'+
 '<label>Course section<input class="fld" data-f="_who.team"></label></div>'}
function show(i,focus){cur=i;var p=PAGES[i];$$("#navlist button").forEach(function(b){b.removeAttribute("aria-current")});
 var nb=$('#navlist button[data-i="'+i+'"]');nb.setAttribute("aria-current","page");
 var h='<p class="printhead"></p><h1 id="ptitle" tabindex="-1">'+p.title+'</h1><p class="meta">'+(p.meta||"")+'</p>';
 if(p.home){h+=p.home+who()+'<h2>Activities and deliverables</h2><div class="cards">'+PAGES.map(function(q,j){return q.tabs?'<button class="card" data-go="'+j+'"><div class="k">'+q.group+'</div><div class="n">'+q.nav+'</div></button>':""}).join("")+'</div>'+
  '<p>The full ThreadBridge case file opens separately: <a href="threadbridge.html" target="_blank" rel="noopener">threadbridge.html</a>.</p>'}
 else{h+='<div class="tabs" role="tablist">'+p.tabs.map(function(t,j){return '<button role="tab" id="tab'+j+'" aria-controls="pan'+j+'" aria-selected="false" tabindex="-1">'+t[0]+'</button>'}).join("")+'</div>'+
  p.tabs.map(function(t,j){return '<section class="panel'+(t[0]==="Your work"||t[2]?" work":"")+'" role="tabpanel" id="pan'+j+'" aria-labelledby="tab'+j+'" hidden>'+t[1]+
   (t[0]==="Your work"||t[2]?'<div class="actions"><button type="button" data-act="word">Download Word file</button><button type="button" class="sec" data-act="print">Print / Save PDF</button></div>':"")+'</section>'}).join("")}
 h+='<div class="pager"><button type="button" class="sec" data-pg="-1"'+(i?"":" disabled")+'>&larr; Previous</button>'+
  (i<PAGES.length-1?'<button type="button" data-pg="1">Next: '+PAGES[i+1].nav+' &rarr;</button>':'<button type="button" class="sec" data-pg="home">Back to Start here</button>')+'</div>';
 main.innerHTML=h;bind(main);restoreRows(main);$$(".locked",main).forEach(lockUI);
 $$(".card",main).forEach(function(c){c.addEventListener("click",function(){show(+c.getAttribute("data-go"),1)})});
 var tabs=$$('[role=tab]',main);function sel(j){tabs.forEach(function(t,k){t.setAttribute("aria-selected",k===j);t.tabIndex=k===j?0:-1;$("#pan"+k).hidden=k!==j});sset("_tab."+p.id,String(j))}
 tabs.forEach(function(t,j){t.addEventListener("click",function(){sel(j)});t.addEventListener("keydown",function(e){var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(d){var n=(j+d+tabs.length)%tabs.length;sel(n);tabs[n].focus()}})});
 if(tabs.length){var st=+(sget("_tab."+p.id)||0);sel(st<tabs.length?st:0)}
 $$("[data-pg]",main).forEach(function(b){b.addEventListener("click",function(){var v=b.getAttribute("data-pg");show(v==="home"?0:cur+(+v),1)})});
 $$("[data-act]",main).forEach(function(b){b.addEventListener("click",function(){b.getAttribute("data-act")==="print"?printWork():wordWork()})});
 sset("_page",String(i));try{history.replaceState(null,"","#"+p.id)}catch(e){}upd();document.querySelector("nav.side").classList.remove("open");if(focus){window.scrollTo(0,0);$("#ptitle").focus()}}
function stamp(){var p=PAGES[cur];return (sget("_who.name")||"[name]")+" | "+(sget("_who.team")||"")+" | "+p.deliv+" | "+new Date().toLocaleDateString()}
function printWork(){$(".printhead").textContent=stamp();document.body.classList.add("print-work");$$(".panel.work").forEach(function(x){x.hidden=false});
 window.print();setTimeout(function(){document.body.classList.remove("print-work");show(cur)},300)}
function wordWork(){var p=PAGES[cur],w=$(".panel.work").cloneNode(true);
 $$("textarea,input",w).forEach(function(el){var real=$('[data-f="'+el.getAttribute("data-f")+'"]',main);var d=document.createElement("div");
  d.style.whiteSpace="pre-wrap";d.textContent=real?real.value:"";el.parentNode.replaceChild(d,el)});
 $$(".pm,.actions,.addrow,.calc,.wc",w).forEach(function(e){e.remove()});$$("label",w).forEach(function(l){l.style.display="block"});
 var doc='<html><head><meta charset="utf-8"><title>'+p.deliv+'</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px;vertical-align:top}h1{font-size:16pt;color:#1E4E79}h3,h4{color:#1E4E79}.prompt{color:#555;font-style:italic}</style></head><body>'+
  '<p>'+stamp().replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</p><h1>'+p.title+'</h1>'+w.innerHTML+'</body></html>';
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
 a.download=(p.deliv+"_"+(sget("_who.name")||"student")).replace(/[^\w.-]+/g,"_")+".doc";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function backup(){var a=document.createElement("a"),data=JSON.stringify({lab:"grc-lab",v:1,saved:new Date().toISOString(),data:allKeys()},null,1);
 a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=("cmmc_lab_backup_"+(sget("_who.name")||"student")+"_"+new Date().toISOString().slice(0,10)).replace(/[^\w.-]+/g,"_")+".json";
 document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function restore(f){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(j.lab!=="grc-lab")throw 0;
  if(!confirm("Replace the work in this browser with the backup from "+(j.saved||"an earlier date")+"?"))return;for(var k in j.data)sset(k,j.data[k]);show(cur)}
 catch(e){alert("That file is not a CMMC lab backup.")}};r.readAsText(f)}
