</style></head><body><a class="skip" href="#content">Skip to content</a><div class="app"><nav class="side" aria-label="Lab sections"><div class="brand"><div class="k">CMMC Compliance Fundamentals</div><div class="t">ThreadBridge Lab</div></div><ul class="navlist" id="navlist"></ul><div class="side-foot"><span id="save-state" role="status"></span><button type="button" id="btn-backup">Download backup</button><label class="btn" for="file-restore">Restore backup</label><input type="file" id="file-restore" accept=".json,application/json" hidden></div></nav><div><button type="button" class="menu-toggle" aria-label="Open the lab menu">Menu</button><main id="content" tabindex="-1"></main></div></div><script>
(function(){"use strict";
var PAGES=[{"id": "home", "group": "Start here", "nav": "Start here", "title": "ThreadBridge Lab", "meta": "Hands-on work for CMMC Compliance Fundamentals", "home": "\n<h2>How the lab works<\/h2>\n<p>This lab holds the hands-on work of the course. Each module has an <strong>activities<\/strong> page with two tabs, one workbook for each session, ready to fill in. Each of the four deliverables has its own page with three parts: the <strong>Brief<\/strong> (the task and the rubric), any <strong>case material<\/strong>, and <strong>Your work<\/strong>. The case is the same all term: ThreadBridge Solutions, LLC.<\/p>\n<p>The lab helps you organize your work and does the arithmetic. It does not grade your work, and it does not hold the answers.<\/p>\n<h3>Saving and submitting<\/h3>\n<ul>\n<li>Your work saves in this browser, on this device. A different computer or browser starts empty.<\/li>\n<li>Use <strong>Download backup<\/strong> at the end of each session. <strong>Restore backup<\/strong> loads that file on any computer.<\/li>\n<li>To submit a deliverable, open its page and use <strong>Download Word file<\/strong> or <strong>Print / Save PDF<\/strong>. Then upload the file to the Canvas assignment.<\/li>\n<li>Clearing browser data or using a private window erases saved work. The backup file does not.<\/li>\n<\/ul>\n<h3>Locked sections<\/h3>\n<p>Two sections are locked: the Module 7 evidence package, which opens in class on Day 1 of the mock assessment, and the Module 8 transfer test, which opens online when the test window starts. The passphrase is given out at that time. After you enter it, the section stays open in this browser.<\/p>\n<h3>Before you start<\/h3>\n<p>Enter your name below. It appears on every file you download. All graded work in this course is your own.<\/p>\n"}, {"id": "m1a", "group": "Module 1", "nav": "Module 1 activities", "title": "Module 1 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 1 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1 and 2.<\/p><p>These activities are practice. They are not graded, but they prepare you for D1 in Module 2.<\/p><\/aside>\n<h3>Activity 1 — Policy, standard, procedure, or record?<\/h3>\n<p>Session A. Work with a partner.<\/p>\n<p>A company shows that it controls something through four kinds of documents:<\/p>\n<ul><li>A <strong>policy<\/strong> states what the company intends and who is accountable.<\/li><li>A <strong>standard<\/strong> sets a measurable target. The target is either met or not met.<\/li><li>A <strong>procedure<\/strong> gives the steps that meet the target, and says who does them.<\/li><li>A <strong>record<\/strong> is dated proof that the steps were done, by a named person.<\/li><\/ul>\n<p>For each statement, choose one of the four types. Then write the words in the statement that decided your choice.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1a.t1\"><thead><tr><th scope=\"col\"><strong>#<\/strong><\/th><th scope=\"col\"><strong>Statement<\/strong><\/th><th scope=\"col\"><strong>Type<\/strong><\/th><th scope=\"col\"><strong>Words that decided it<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1<\/th><td>&quot;The company protects customer and government information. The Operations Director is accountable for this policy.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r1.c2\" rows=\"2\" aria-label=\"1, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r1.c3\" rows=\"2\" aria-label=\"1, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">2<\/th><td>&quot;Passwords must be at least 12 characters long.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r2.c2\" rows=\"2\" aria-label=\"2, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r2.c3\" rows=\"2\" aria-label=\"2, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">3<\/th><td>&quot;To add a new user: get the manager&#x27;s signed request, create the account, then file the request.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r3.c2\" rows=\"2\" aria-label=\"3, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r3.c3\" rows=\"2\" aria-label=\"3, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">4<\/th><td>&quot;Backup log: full backup completed on March 10, checked by R. Diaz.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r4.c2\" rows=\"2\" aria-label=\"4, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r4.c3\" rows=\"2\" aria-label=\"4, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r4.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">5<\/th><td>&quot;Screens lock after 15 minutes without use.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r5.c2\" rows=\"2\" aria-label=\"5, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r5.c3\" rows=\"2\" aria-label=\"5, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r5.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">6<\/th><td>A sign-in sheet for the April security training, signed by each person who attended<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r6.c2\" rows=\"2\" aria-label=\"6, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r6.c3\" rows=\"2\" aria-label=\"6, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r6.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">7<\/th><td>&quot;When a staff member leaves, HR emails IT the same day. IT disables the account and logs the date.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r7.c2\" rows=\"2\" aria-label=\"7, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r7.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r7.c3\" rows=\"2\" aria-label=\"7, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r7.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">8<\/th><td>&quot;The company president approves all security policies and reviews them once a year.&quot;<\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r8.c2\" rows=\"2\" aria-label=\"8, Type\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r8.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t1.r8.c3\" rows=\"2\" aria-label=\"8, Words that decided it\"><\/textarea><div class=\"pm\" data-m=\"m1a.t1.r8.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1a.t1\" data-cols=\"4\">+ Add row<\/button>\n<p>Which statement was hardest to sort? Write one sentence that explains why.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1a.t2\"><thead><tr><th scope=\"col\"><strong>The hardest statement and why<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m1a.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, The hardest statement and why\"><\/textarea><div class=\"pm\" data-m=\"m1a.t2.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 2 — The four roles map<\/h3>\n<p>Session A. Work alone, then check with a partner.<\/p>\n<p>Every certification system uses the same four roles. Fill in what each role does. Then fill in who plays that role in CMMC and in ISO/IEC 27001. Use Part 4 of Session A to help you. If a cell does not apply, write &quot;none&quot;.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1a.t3\"><thead><tr><th scope=\"col\"><strong>Role<\/strong><\/th><th scope=\"col\"><strong>What it does<\/strong><\/th><th scope=\"col\"><strong>Who plays it in CMMC<\/strong><\/th><th scope=\"col\"><strong>Who plays it in ISO/IEC 27001<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Scheme owner<\/th><td><textarea class=\"fld \" data-f=\"m1a.t3.r1.c1\" rows=\"2\" aria-label=\"Scheme owner, What it does\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r1.c2\" rows=\"2\" aria-label=\"Scheme owner, Who plays it in CMMC\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r1.c3\" rows=\"2\" aria-label=\"Scheme owner, Who plays it in ISO/IEC 27001\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Accreditation body<\/th><td><textarea class=\"fld \" data-f=\"m1a.t3.r2.c1\" rows=\"2\" aria-label=\"Accreditation body, What it does\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r2.c2\" rows=\"2\" aria-label=\"Accreditation body, Who plays it in CMMC\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r2.c3\" rows=\"2\" aria-label=\"Accreditation body, Who plays it in ISO/IEC 27001\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Conformity-assessment body<\/th><td><textarea class=\"fld \" data-f=\"m1a.t3.r3.c1\" rows=\"2\" aria-label=\"Conformity-assessment body, What it does\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r3.c2\" rows=\"2\" aria-label=\"Conformity-assessment body, Who plays it in CMMC\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r3.c3\" rows=\"2\" aria-label=\"Conformity-assessment body, Who plays it in ISO/IEC 27001\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Personnel certification body<\/th><td><textarea class=\"fld \" data-f=\"m1a.t3.r4.c1\" rows=\"2\" aria-label=\"Personnel certification body, What it does\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r4.c2\" rows=\"2\" aria-label=\"Personnel certification body, Who plays it in CMMC\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1a.t3.r4.c3\" rows=\"2\" aria-label=\"Personnel certification body, Who plays it in ISO/IEC 27001\"><\/textarea><div class=\"pm\" data-m=\"m1a.t3.r4.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1a.t3\" data-cols=\"4\">+ Add row<\/button>\n<p>Keep this page. Session B uses it again.<\/p>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 1 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 4, 5 and 6. Online, outside class: Activities 3 and 7.<\/p><p>These activities are practice. They are not graded, but they prepare you for D1 in Module 2.<\/p><\/aside>\n<h3>Activity 3 — The compliance landscape grid (optional)<\/h3>\n<p>Optional. Online work after Session B. Work alone. Fill in what you know first. Then compare your answers with the completed grid on the Module 1 Online Work page.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t1\"><thead><tr><th scope=\"col\"><strong>Program<\/strong><\/th><th scope=\"col\"><strong>Where the rule comes from<\/strong><\/th><th scope=\"col\"><strong>Who checks<\/strong><\/th><th scope=\"col\"><strong>What the company gets<\/strong><\/th><th scope=\"col\"><strong>What happens if it fails<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">NIST CSF 2.0<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r1.c1\" rows=\"2\" aria-label=\"NIST CSF 2.0, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r1.c2\" rows=\"2\" aria-label=\"NIST CSF 2.0, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r1.c3\" rows=\"2\" aria-label=\"NIST CSF 2.0, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r1.c4\" rows=\"2\" aria-label=\"NIST CSF 2.0, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">ISO/IEC 27001<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r2.c1\" rows=\"2\" aria-label=\"ISO/IEC 27001, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r2.c2\" rows=\"2\" aria-label=\"ISO/IEC 27001, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r2.c3\" rows=\"2\" aria-label=\"ISO/IEC 27001, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r2.c4\" rows=\"2\" aria-label=\"ISO/IEC 27001, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">SOC 2<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r3.c1\" rows=\"2\" aria-label=\"SOC 2, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r3.c2\" rows=\"2\" aria-label=\"SOC 2, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r3.c3\" rows=\"2\" aria-label=\"SOC 2, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r3.c4\" rows=\"2\" aria-label=\"SOC 2, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">FedRAMP<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r4.c1\" rows=\"2\" aria-label=\"FedRAMP, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r4.c2\" rows=\"2\" aria-label=\"FedRAMP, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r4.c3\" rows=\"2\" aria-label=\"FedRAMP, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r4.c4\" rows=\"2\" aria-label=\"FedRAMP, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r4.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">HIPAA Security Rule<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r5.c1\" rows=\"2\" aria-label=\"HIPAA Security Rule, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r5.c2\" rows=\"2\" aria-label=\"HIPAA Security Rule, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r5.c3\" rows=\"2\" aria-label=\"HIPAA Security Rule, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r5.c4\" rows=\"2\" aria-label=\"HIPAA Security Rule, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r5.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">CMMC Level 2<\/th><td><textarea class=\"fld \" data-f=\"m1b.t1.r6.c1\" rows=\"2\" aria-label=\"CMMC Level 2, Where the rule comes from\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r6.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r6.c2\" rows=\"2\" aria-label=\"CMMC Level 2, Who checks\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r6.c3\" rows=\"2\" aria-label=\"CMMC Level 2, What the company gets\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r6.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t1.r6.c4\" rows=\"2\" aria-label=\"CMMC Level 2, What happens if it fails\"><\/textarea><div class=\"pm\" data-m=\"m1b.t1.r6.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t1\" data-cols=\"5\">+ Add row<\/button>\n<p>After you compare, mark one cell you got wrong. Write what you thought and what the grid says.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t2\"><thead><tr><th scope=\"col\"><strong>Cell I got wrong<\/strong><\/th><th scope=\"col\"><strong>What I thought<\/strong><\/th><th scope=\"col\"><strong>What the grid says<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m1b.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, Cell I got wrong\"><\/textarea><div class=\"pm\" data-m=\"m1b.t2.r1.c0\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t2.r1.c1\" rows=\"2\" aria-label=\"row 1, What I thought\"><\/textarea><div class=\"pm\" data-m=\"m1b.t2.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t2.r1.c2\" rows=\"2\" aria-label=\"row 1, What the grid says\"><\/textarea><div class=\"pm\" data-m=\"m1b.t2.r1.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t2\" data-cols=\"3\">+ Add row<\/button>\n<h3>Activity 4 — The placement grid<\/h3>\n<p>Session B. Work with a partner.<\/p>\n<p>Two ideas set up the grid:<\/p>\n<ul><li><strong>Voluntary or mandatory:<\/strong> does an organization choose to follow it, or must it?<\/li><li><strong>Outcome-based or prescriptive:<\/strong> an outcome-based framework states a goal and lets you choose how to reach it. A prescriptive one states exactly what you must do.<\/li><\/ul>\n<p>Place each framework in one box of the grid: NIST CSF 2.0, ISO/IEC 27001, NIST RMF, NIST SP 800-53, and CMMC Level 2. Type its name in the box.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t3\"><thead><tr><th scope=\"col\"><\/th><th scope=\"col\"><strong>Voluntary<\/strong><\/th><th scope=\"col\"><strong>Mandatory<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Prescriptive (states exactly what to do)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t3.r1.c1\" rows=\"2\" aria-label=\"Prescriptive (states exactly what to do), Voluntary\"><\/textarea><div class=\"pm\" data-m=\"m1b.t3.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t3.r1.c2\" rows=\"2\" aria-label=\"Prescriptive (states exactly what to do), Mandatory\"><\/textarea><div class=\"pm\" data-m=\"m1b.t3.r1.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Outcome-based (states a goal)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t3.r2.c1\" rows=\"2\" aria-label=\"Outcome-based (states a goal), Voluntary\"><\/textarea><div class=\"pm\" data-m=\"m1b.t3.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t3.r2.c2\" rows=\"2\" aria-label=\"Outcome-based (states a goal), Mandatory\"><\/textarea><div class=\"pm\" data-m=\"m1b.t3.r2.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t3\" data-cols=\"3\">+ Add row<\/button>\n<p>Then give a reason and a source for each placement.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t4\"><thead><tr><th scope=\"col\"><strong>Framework<\/strong><\/th><th scope=\"col\"><strong>Box you chose<\/strong><\/th><th scope=\"col\"><strong>Reason<\/strong><\/th><th scope=\"col\"><strong>Source that supports it<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">NIST CSF 2.0<\/th><td><textarea class=\"fld \" data-f=\"m1b.t4.r1.c1\" rows=\"2\" aria-label=\"NIST CSF 2.0, Box you chose\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r1.c2\" rows=\"2\" aria-label=\"NIST CSF 2.0, Reason\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r1.c3\" rows=\"2\" aria-label=\"NIST CSF 2.0, Source that supports it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">ISO/IEC 27001<\/th><td><textarea class=\"fld \" data-f=\"m1b.t4.r2.c1\" rows=\"2\" aria-label=\"ISO/IEC 27001, Box you chose\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r2.c2\" rows=\"2\" aria-label=\"ISO/IEC 27001, Reason\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r2.c3\" rows=\"2\" aria-label=\"ISO/IEC 27001, Source that supports it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">NIST RMF<\/th><td><textarea class=\"fld \" data-f=\"m1b.t4.r3.c1\" rows=\"2\" aria-label=\"NIST RMF, Box you chose\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r3.c2\" rows=\"2\" aria-label=\"NIST RMF, Reason\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r3.c3\" rows=\"2\" aria-label=\"NIST RMF, Source that supports it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">NIST SP 800-53<\/th><td><textarea class=\"fld \" data-f=\"m1b.t4.r4.c1\" rows=\"2\" aria-label=\"NIST SP 800-53, Box you chose\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r4.c2\" rows=\"2\" aria-label=\"NIST SP 800-53, Reason\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r4.c3\" rows=\"2\" aria-label=\"NIST SP 800-53, Source that supports it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r4.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">CMMC Level 2<\/th><td><textarea class=\"fld \" data-f=\"m1b.t4.r5.c1\" rows=\"2\" aria-label=\"CMMC Level 2, Box you chose\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r5.c2\" rows=\"2\" aria-label=\"CMMC Level 2, Reason\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t4.r5.c3\" rows=\"2\" aria-label=\"CMMC Level 2, Source that supports it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t4.r5.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t4\" data-cols=\"4\">+ Add row<\/button>\n<h3>Activity 5 — Find the Clause<\/h3>\n<p>Session B. Work alone.<\/p>\n<p>1. Go to SAM.gov, the System for Award Management. It is the official federal website for contract opportunities.<\/p>\n<p>2. Search current Department of Defense solicitations for the clause number &quot;252.204-7021&quot; or &quot;252.204-7012&quot;.<\/p>\n<p>3. Open one result and fill in the record below.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t5\"><thead><tr><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Solicitation number<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r1.c1\" rows=\"2\" aria-label=\"Solicitation number, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Agency or command that issued it<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r2.c1\" rows=\"2\" aria-label=\"Agency or command that issued it, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Clause or clauses you found<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r3.c1\" rows=\"2\" aria-label=\"Clause or clauses you found, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Where in the solicitation you found the clause<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r4.c1\" rows=\"2\" aria-label=\"Where in the solicitation you found the clause, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">CMMC level stated, if any (write &quot;not stated&quot; if there is none)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r5.c1\" rows=\"2\" aria-label=\"CMMC level stated, if any (write &amp;quot;not stated&amp;quot; if there is none), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r5.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">One other compliance program the agency or the bidder may face<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r6.c1\" rows=\"2\" aria-label=\"One other compliance program the agency or the bidder may face, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r6.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Who would check that program, and what the check produces<\/th><td><textarea class=\"fld \" data-f=\"m1b.t5.r7.c1\" rows=\"2\" aria-label=\"Who would check that program, and what the check produces, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t5.r7.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t5\" data-cols=\"2\">+ Add row<\/button>\n<p>If you could not find a solicitation with the clause, describe what you searched.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t6\"><thead><tr><th scope=\"col\"><strong>What I searched, and what I found<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m1b.t6.r1.c0\" rows=\"2\" aria-label=\"row 1, What I searched, and what I found\"><\/textarea><div class=\"pm\" data-m=\"m1b.t6.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 6 — Marketplace verification<\/h3>\n<p>Session B. Work alone or with a partner.<\/p>\n<p>1. Go to the CMMC Marketplace on the Cyber AB website.<\/p>\n<p>2. Choose one C3PAO from the list.<\/p>\n<p>3. Fill in the record below. Then open the firm&#x27;s own website and compare.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t7\"><thead><tr><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Firm name<\/th><td><textarea class=\"fld \" data-f=\"m1b.t7.r1.c1\" rows=\"2\" aria-label=\"Firm name, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t7.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Status shown on the Marketplace (for example, &quot;authorized&quot; or &quot;accredited&quot;)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t7.r2.c1\" rows=\"2\" aria-label=\"Status shown on the Marketplace (for example, &amp;quot;authorized&amp;quot; or &amp;quot;accredited&amp;quot;), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t7.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Date or other detail shown with the status<\/th><td><textarea class=\"fld \" data-f=\"m1b.t7.r3.c1\" rows=\"2\" aria-label=\"Date or other detail shown with the status, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t7.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">What the firm&#x27;s own website says about its status<\/th><td><textarea class=\"fld \" data-f=\"m1b.t7.r4.c1\" rows=\"2\" aria-label=\"What the firm&amp;#x27;s own website says about its status, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t7.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Do the two sources agree? If not, what is different?<\/th><td><textarea class=\"fld \" data-f=\"m1b.t7.r5.c1\" rows=\"2\" aria-label=\"Do the two sources agree? If not, what is different?, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m1b.t7.r5.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t7\" data-cols=\"2\">+ Add row<\/button>\n<p>Using your roles map from Activity 2 (in the Session A workbook), which role does this firm play? Which body approved it?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t8\"><thead><tr><th scope=\"col\"><strong>The firm&#x27;s role, and the body that approved it<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m1b.t8.r1.c0\" rows=\"2\" aria-label=\"row 1, The firm&amp;#x27;s role, and the body that approved it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t8.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 7 — The ecosystem in the rule<\/h3>\n<p>Online work after Session B. Work alone.<\/p>\n<p>Open 32 CFR Part 170, Subpart C, at ecfr.gov. It has one section for each body or role in the CMMC ecosystem. For each row, find the section number. Then copy one duty that the section gives that body, in the rule&#x27;s own words.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t9\"><thead><tr><th scope=\"col\"><strong>Body or role<\/strong><\/th><th scope=\"col\"><strong>Section number<\/strong><\/th><th scope=\"col\"><strong>One duty the section gives it<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Accreditation Body (the Cyber AB)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t9.r1.c1\" rows=\"2\" aria-label=\"Accreditation Body (the Cyber AB), Section number\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r1.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t9.r1.c2\" rows=\"2\" aria-label=\"Accreditation Body (the Cyber AB), One duty the section gives it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r1.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">C3PAO<\/th><td><textarea class=\"fld \" data-f=\"m1b.t9.r2.c1\" rows=\"2\" aria-label=\"C3PAO, Section number\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r2.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t9.r2.c2\" rows=\"2\" aria-label=\"C3PAO, One duty the section gives it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r2.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">CAICO (ISACA)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t9.r3.c1\" rows=\"2\" aria-label=\"CAICO (ISACA), Section number\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r3.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t9.r3.c2\" rows=\"2\" aria-label=\"CAICO (ISACA), One duty the section gives it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r3.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Certified CMMC Assessor (CCA)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t9.r4.c1\" rows=\"2\" aria-label=\"Certified CMMC Assessor (CCA), Section number\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r4.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t9.r4.c2\" rows=\"2\" aria-label=\"Certified CMMC Assessor (CCA), One duty the section gives it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r4.c2\"><\/div><\/td><\/tr><tr><th scope=\"row\">Certified CMMC Professional (CCP)<\/th><td><textarea class=\"fld \" data-f=\"m1b.t9.r5.c1\" rows=\"2\" aria-label=\"Certified CMMC Professional (CCP), Section number\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r5.c1\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m1b.t9.r5.c2\" rows=\"2\" aria-label=\"Certified CMMC Professional (CCP), One duty the section gives it\"><\/textarea><div class=\"pm\" data-m=\"m1b.t9.r5.c2\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m1b.t9\" data-cols=\"3\">+ Add row<\/button>\n<p>Compare your answers with your roles map from Activity 2 (in the Session A workbook). Does the rule match the role you gave each body?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m1b.t10\"><thead><tr><th scope=\"col\"><strong>Where the rule matched your roles map, and where it did not<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m1b.t10.r1.c0\" rows=\"2\" aria-label=\"row 1, Where the rule matched your roles map, and where it did not\"><\/textarea><div class=\"pm\" data-m=\"m1b.t10.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>"]], "deliv": "Module 1 activities", "keys": ["m1b"]}, {"id": "m2a", "group": "Module 2", "nav": "Module 2 activities", "title": "Module 2 Activity Workbooks", "meta": "Session A and Session B workbooks", "tabs": [["Session A", "<p class=\"docmeta\">Download this file before Session A. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 2 activities for Session A, and the online work that goes with it. Session B has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 1 and 2.<\/p><\/aside>\n<h3>Activity 1 — Reading one Registry entry<\/h3>\n<p>Session A. Work with a partner.<\/p>\n<p>Open the National Archives and Records Administration (NARA) CUI Registry at archives.gov/cui. Find the category <strong>Controlled Technical Information<\/strong>. Fill in what the category page says. Copy the words exactly as the Registry writes them.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m2a.t1\"><thead><tr><th scope=\"col\"><strong>What to find<\/strong><\/th><th scope=\"col\"><strong>What the Registry says<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Exact category name<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r1.c1\" rows=\"2\" aria-label=\"Exact category name, What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Category marking<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r2.c1\" rows=\"2\" aria-label=\"Category marking, What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Is it CUI Basic or CUI Specified?<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r3.c1\" rows=\"2\" aria-label=\"Is it CUI Basic or CUI Specified?, What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r3.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Banner marking (what appears at the top of a document)<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r4.c1\" rows=\"2\" aria-label=\"Banner marking (what appears at the top of a document), What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r4.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">One authority the Registry cites (law, regulation, or policy)<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r5.c1\" rows=\"2\" aria-label=\"One authority the Registry cites (law, regulation, or policy), What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r5.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">One example of information that fits this category<\/th><td><textarea class=\"fld \" data-f=\"m2a.t1.r6.c1\" rows=\"2\" aria-label=\"One example of information that fits this category, What the Registry says\"><\/textarea><div class=\"pm\" data-m=\"m2a.t1.r6.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m2a.t1\" data-cols=\"2\">+ Add row<\/button>\n<p>Now use your entry to check ThreadBridge item 1 from the Session A worked example. ThreadBridge called it &quot;Critical Technology.&quot; Does that category name appear in the Registry?<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m2a.t2\"><thead><tr><th scope=\"col\"><strong>Does &quot;Critical Technology&quot; exist as a Registry category? What name should ThreadBridge use?<\/strong><\/th><\/tr><\/thead><tbody><tr><td><textarea class=\"fld \" data-f=\"m2a.t2.r1.c0\" rows=\"2\" aria-label=\"row 1, Does &amp;quot;Critical Technology&amp;quot; exist as a Registry category? What name should ThreadBridge use?\"><\/textarea><div class=\"pm\" data-m=\"m2a.t2.r1.c0\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Activity 2 — Registry practice<\/h3>\n<p>Session A. Work with a partner for 20 minutes. Finish any items you did not reach as part of your online work.<\/p>\n<p>These five items are short practice cases. They are not from ThreadBridge&#x27;s inventory. For each item:<\/p>\n<p>1. Decide: CUI, FCI, or neither.<\/p>\n<p>2. If CUI, find the exact Registry category name and its marking.<\/p>\n<p>3. If FCI or neither, name the part of the definition you used.<\/p>\n<p>4. Write one line that gives your reason.<\/p>\n<p>Two hints:<\/p>\n<ul><li>For Federal Contract Information (FCI), ask whether the information was provided by or made for the Government under a contract. Then check the two things the definition leaves out: information the Government gives to the public, and simple payment information.<\/li><li>For Controlled Unclassified Information (CUI), find the authority on the Registry page. Do not decide by how private the information feels.<\/li><\/ul>\n<div class=\"tbl-wrap\"><table data-tid=\"m2a.t3\"><thead><tr><th scope=\"col\"><strong>Item<\/strong><\/th><th scope=\"col\"><strong>The information<\/strong><\/th><th scope=\"col\"><strong>Your determination<\/strong><\/th><th scope=\"col\"><strong>Registry category and marking (if CUI)<\/strong><\/th><th scope=\"col\"><strong>One-line reason<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">P1<\/th><td>Engineering drawings for a part of a military uniform, given by DoD to a contractor under a contract<\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r1.c2\" rows=\"2\" aria-label=\"P1, Your determination\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r1.c3\" rows=\"2\" aria-label=\"P1, Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r1.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r1.c4\" rows=\"2\" aria-label=\"P1, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r1.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">P2<\/th><td>A repair manual for a military vehicle, given by DoD to a maintenance contractor under a contract<\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r2.c2\" rows=\"2\" aria-label=\"P2, Your determination\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r2.c3\" rows=\"2\" aria-label=\"P2, Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r2.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r2.c4\" rows=\"2\" aria-label=\"P2, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r2.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">P3<\/th><td>Office supply orders and billing codes for a federal agency customer under a GSA Schedule contract<\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r3.c2\" rows=\"2\" aria-label=\"P3, Your determination\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r3.c3\" rows=\"2\" aria-label=\"P3, Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r3.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r3.c4\" rows=\"2\" aria-label=\"P3, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r3.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">P4<\/th><td>A delivery confirmation for an office supply order sent to a DoD base<\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r4.c2\" rows=\"2\" aria-label=\"P4, Your determination\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r4.c3\" rows=\"2\" aria-label=\"P4, Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r4.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r4.c4\" rows=\"2\" aria-label=\"P4, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r4.c4\"><\/div><\/td><\/tr><tr><th scope=\"row\">P5<\/th><td>A notice of a contract award that the Government posted on its public website<\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r5.c2\" rows=\"2\" aria-label=\"P5, Your determination\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r5.c3\" rows=\"2\" aria-label=\"P5, Registry category and marking (if CUI)\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r5.c3\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2a.t3.r5.c4\" rows=\"2\" aria-label=\"P5, One-line reason\"><\/textarea><div class=\"pm\" data-m=\"m2a.t3.r5.c4\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m2a.t3\" data-cols=\"5\">+ Add row<\/button>\n<p>You will do ThreadBridge inventory items 3 to 6 on your own in D1, with the same steps.<\/p>"], ["Session B", "<p class=\"docmeta\">Download this file before Session B. Fill it in during class. The same activities are in the course lab, cmmc_lab.html.<\/p><aside class=\"callout info\"><p class=\"callout-h\">How to use this workbook<\/p><p>This workbook holds the Module 2 activities for Session B, and the online work that goes with it. Session A has its own workbook. Type your answers into the empty cells. You can add rows if you need them.<\/p><p>Activity numbers run through the whole module, so they match the module pages and the course lab.<\/p><p>In class: Activities 3 and 4.<\/p><\/aside>\n<h3>Activity 3 — Reading DFARS 252.204-7012<\/h3>\n<p>Session B. Work alone, then compare with a partner.<\/p>\n<p>Open DFARS 252.204-7012 at acquisition.gov. Read only the parts named below. Answer each question in one or two sentences, and copy the words from the clause that support your answer.<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m2b.t1\"><thead><tr><th scope=\"col\"><strong>Part of the clause<\/strong><\/th><th scope=\"col\"><strong>Question<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><th scope=\"col\"><strong>Words from the clause<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Definition of &quot;covered defense information&quot;<\/th><td>Does it include information the contractor creates during the contract, or only what the Government provides?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r1.c2\" rows=\"2\" aria-label=\"Definition of &amp;quot;covered defense information&amp;quot;, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r1.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r1.c3\" rows=\"2\" aria-label=\"Definition of &amp;quot;covered defense information&amp;quot;, Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r1.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Definition of &quot;covered defense information&quot;<\/th><td>If nothing is marked, is nothing covered? What else can identify the information?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r2.c2\" rows=\"2\" aria-label=\"Definition of &amp;quot;covered defense information&amp;quot;, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r2.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r2.c3\" rows=\"2\" aria-label=\"Definition of &amp;quot;covered defense information&amp;quot;, Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r2.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Paragraph (b)(2)<\/th><td>Which NIST publication must the contractor&#x27;s systems meet?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r3.c2\" rows=\"2\" aria-label=\"Paragraph (b)(2), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r3.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r3.c3\" rows=\"2\" aria-label=\"Paragraph (b)(2), Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r3.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Paragraph (c)<\/th><td>How many hours does the company have to report a cyber incident, and when does the time start?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r4.c2\" rows=\"2\" aria-label=\"Paragraph (c), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r4.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r4.c3\" rows=\"2\" aria-label=\"Paragraph (c), Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r4.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Paragraph (e)<\/th><td>How long must the company keep images and monitoring data after an incident?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r5.c2\" rows=\"2\" aria-label=\"Paragraph (e), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r5.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r5.c3\" rows=\"2\" aria-label=\"Paragraph (e), Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r5.c3\"><\/div><\/td><\/tr><tr><th scope=\"row\">Paragraph (m)<\/th><td>Who else must receive this clause when the company uses them for the work?<\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r6.c2\" rows=\"2\" aria-label=\"Paragraph (m), Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r6.c2\"><\/div><\/td><td><textarea class=\"fld \" data-f=\"m2b.t1.r6.c3\" rows=\"2\" aria-label=\"Paragraph (m), Words from the clause\"><\/textarea><div class=\"pm\" data-m=\"m2b.t1.r6.c3\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m2b.t1\" data-cols=\"4\">+ Add row<\/button>\n<p>Now apply it to ThreadBridge. Use Part 4 of the D1 attachment (the two events, INC-001 and INC-002).<\/p>\n<div class=\"tbl-wrap\"><table data-tid=\"m2b.t2\"><thead><tr><th scope=\"col\"><strong>Question<\/strong><\/th><th scope=\"col\"><strong>Your answer<\/strong><\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Is ThreadBridge bound by DFARS 252.204-7012 today? Name the contract that puts the clause in place.<\/th><td><textarea class=\"fld \" data-f=\"m2b.t2.r1.c1\" rows=\"2\" aria-label=\"Is ThreadBridge bound by DFARS 252.204-7012 today? Name the contract that puts the clause in place., Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t2.r1.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">Should INC-001 have been reported? Give one reason from the clause.<\/th><td><textarea class=\"fld \" data-f=\"m2b.t2.r2.c1\" rows=\"2\" aria-label=\"Should INC-001 have been reported? Give one reason from the clause., Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t2.r2.c1\"><\/div><\/td><\/tr><tr><th scope=\"row\">What evidence could ThreadBridge preserve today, given that it does not review its logs?<\/th><td><textarea class=\"fld \" data-f=\"m2b.t2.r3.c1\" rows=\"2\" aria-label=\"What evidence could ThreadBridge preserve today, given that it does not review its logs?, Your answer\"><\/textarea><div class=\"pm\" data-m=\"m2b.t2.r3.c1\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><button type=\"button\" class=\"addrow\" data-tid=\"m2b.t2\" data-cols=\"2\">+ Add row<\/button>\n<h3>Activity 4 — Start D1<\/h3>\n<p>Session B, then online. Work alone. You may ask a classmate or the instructor questions. You start this plan in the last 20 minutes of Session B and finish it outside class.<\/p>\n<p>Use this p
